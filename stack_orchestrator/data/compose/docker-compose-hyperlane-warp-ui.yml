services:
  warp-ui:
    # TODO: use git.vdb.to/laconic/hyperlane-warp-ui:tag once CI publish workflows are set up
    image: laconic/hyperlane-warp-ui:local
    restart: unless-stopped
    environment:
      # Chain RPC URLs — entrypoint.sh replaces sentinel placeholders in built JS
      GORCHAIN_RPC_URL: ${GORCHAIN_RPC_URL}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      # Domain IDs
      GORCHAIN_DOMAIN_ID: ${GORCHAIN_DOMAIN_ID}
      SOLANA_DOMAIN_ID: ${SOLANA_DOMAIN_ID}
      # Chain IDs
      GORCHAIN_CHAIN_ID: ${GORCHAIN_CHAIN_ID:-99999}
      SOLANA_CHAIN_ID: ${SOLANA_CHAIN_ID:-99998}
      # Chain names
      GORCHAIN_CHAIN_NAME: ${GORCHAIN_CHAIN_NAME:-gorchain}
      SOLANA_CHAIN_NAME: ${SOLANA_CHAIN_NAME:-solana}
      # Native token config
      GORCHAIN_NATIVE_TOKEN_NAME: ${GORCHAIN_NATIVE_TOKEN_NAME:-GOR}
      GORCHAIN_NATIVE_TOKEN_SYMBOL: ${GORCHAIN_NATIVE_TOKEN_SYMBOL:-GOR}
      GORCHAIN_NATIVE_TOKEN_DECIMALS: ${GORCHAIN_NATIVE_TOKEN_DECIMALS:-9}
      SOLANA_NATIVE_TOKEN_NAME: ${SOLANA_NATIVE_TOKEN_NAME:-SOL}
      SOLANA_NATIVE_TOKEN_SYMBOL: ${SOLANA_NATIVE_TOKEN_SYMBOL:-SOL}
      SOLANA_NATIVE_TOKEN_DECIMALS: ${SOLANA_NATIVE_TOKEN_DECIMALS:-9}
      # Mailbox program addresses (from core deployer output)
      GORCHAIN_MAILBOX: ${GORCHAIN_MAILBOX}
      SOLANA_MAILBOX: ${SOLANA_MAILBOX}
      # Warp route addresses (from warp deployer output)
      WARP_COLLATERAL_ADDRESS: ${WARP_COLLATERAL_ADDRESS}
      WARP_SYNTHETIC_ADDRESS: ${WARP_SYNTHETIC_ADDRESS}
      WARP_TOKEN_MINT: ${WARP_TOKEN_MINT:-}
      WARP_SYNTHETIC_MINT: ${WARP_SYNTHETIC_MINT:-}
      # Warp token metadata
      WARP_TOKEN_NAME: ${WARP_TOKEN_NAME:-USD Coin}
      WARP_TOKEN_SYMBOL: ${WARP_TOKEN_SYMBOL:-USDC}
      WARP_TOKEN_DECIMALS: ${WARP_TOKEN_DECIMALS:-6}
      WARP_SYNTHETIC_NAME: ${WARP_SYNTHETIC_NAME:-Synthetic USD Coin}
      WARP_SYNTHETIC_SYMBOL: ${WARP_SYNTHETIC_SYMBOL:-gUSDC}
      # WalletConnect
      NEXT_PUBLIC_WALLET_CONNECT_ID: ${NEXT_PUBLIC_WALLET_CONNECT_ID:-}
      # Standalone server must bind to all interfaces for k8s Service routing
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

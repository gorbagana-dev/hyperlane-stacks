services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    hostname: prometheus
    # Entrypoint renders the file_sd targets + scheme from env on each start,
    # then execs prometheus (it supplies --config.file for the rendered config).
    entrypoint: ["/bin/sh", "/etc/prometheus/render-targets.sh"]
    command:
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    environment:
      # Scrape targets: comma-separated instance=host:port, one per instance.
      PROMETHEUS_VALIDATOR_TARGETS: ${PROMETHEUS_VALIDATOR_TARGETS:-}
      PROMETHEUS_RELAYER_TARGETS: ${PROMETHEUS_RELAYER_TARGETS:-}
      # https in prod (Caddy + Let's Encrypt); http for in-cluster e2e scraping.
      PROMETHEUS_SCRAPE_SCHEME: ${PROMETHEUS_SCRAPE_SCHEME:-https}
    volumes:
      - prometheus-config:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  pushgateway:
    image: prom/pushgateway:latest
    restart: unless-stopped
    hostname: pushgateway
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9091/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Key management — injected via secrets: in spec.yml (envFrom.secretRef)
      # GF_SECURITY_ADMIN_PASSWORD
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-datasources-config:/etc/grafana/provisioning/datasources:ro
      - grafana-dashboard-config:/etc/grafana/provisioning/dashboards:ro
      - grafana-dashboards-config:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  balance-monitor:
    image: python:3.12-alpine
    restart: unless-stopped
    hostname: balance-monitor
    command: ["python3", "/opt/scripts/check-balance.py"]
    environment:
      GORCHAIN_RPC_URL: ${GORCHAIN_RPC_URL}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      MONITORED_WALLETS_GORCHAIN: ${MONITORED_WALLETS_GORCHAIN:-}
      MONITORED_WALLETS_SOLANA: ${MONITORED_WALLETS_SOLANA:-}
      BALANCE_THRESHOLD_SOL: ${BALANCE_THRESHOLD_SOL:-1}
      BALANCE_CHECK_INTERVAL: ${BALANCE_CHECK_INTERVAL:-300}
    volumes:
      - balance-monitor-scripts-config:/opt/scripts:ro

volumes:
  # Config volumes — become ConfigMaps in k8s (contain "config" in name)
  prometheus-config:
  grafana-datasources-config:
  grafana-dashboard-config:
  grafana-dashboards-config:
  balance-monitor-scripts-config:
  # Data volumes — become PVCs in k8s
  prometheus-data:
  grafana-data:

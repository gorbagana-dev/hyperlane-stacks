services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    hostname: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - prometheus-config:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  pushgateway:
    image: prom/pushgateway:latest
    restart: unless-stopped
    hostname: pushgateway
    ports:
      - "9091"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9091/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-datasources-config:/etc/grafana/provisioning/datasources:ro
      - grafana-dashboard-config:/etc/grafana/provisioning/dashboards:ro
      - grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  balance-monitor:
    image: laconicnetwork/hyperlane-svm-deployer:local
    restart: unless-stopped
    hostname: balance-monitor
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Balance monitor sidecar — checks wallet balances and pushes to pushgateway
        PUSHGATEWAY_URL="http://localhost:9091"
        INTERVAL="${BALANCE_CHECK_INTERVAL:-300}"

        check_balance() {
          local label="$$1" address="$$2" rpc_url="$$3" chain="$$4"
          local balance
          balance=$$(solana balance "$$address" --url "$$rpc_url" 2>/dev/null | awk '{print $$1}')
          if [[ -n "$$balance" ]]; then
            cat <<PEOF | curl -s --data-binary @- "$${PUSHGATEWAY_URL}/metrics/job/balance_monitor/chain/$${chain}/wallet/$${label}"
        # HELP hyperlane_wallet_balance_sol Wallet balance in SOL
        # TYPE hyperlane_wallet_balance_sol gauge
        hyperlane_wallet_balance_sol{chain="$${chain}",wallet="$${label}",address="$${address}"} $${balance}
        PEOF

            # Alert threshold check
            threshold="$${BALANCE_THRESHOLD_SOL:-1}"
            if (( $$(echo "$$balance < $$threshold" | bc -l 2>/dev/null || echo 0) )); then
              echo "[balance-monitor] WARNING: $${label} on $${chain} balance $${balance} SOL < threshold $${threshold} SOL"
            fi
          fi
        }

        echo "[balance-monitor] Starting balance monitor (interval: $${INTERVAL}s)"
        while true; do
          # Parse MONITORED_WALLETS: comma-separated "label:address" pairs
          IFS=',' read -ra GORCHAIN_WALLETS <<< "$${MONITORED_WALLETS_GORCHAIN:-}"
          for entry in "$${GORCHAIN_WALLETS[@]}"; do
            [[ -z "$$entry" ]] && continue
            label="$${entry%%:*}"
            address="$${entry#*:}"
            check_balance "$$label" "$$address" "$${GORCHAIN_RPC_URL}" "gorchain"
          done

          IFS=',' read -ra SOLANA_WALLETS <<< "$${MONITORED_WALLETS_SOLANA:-}"
          for entry in "$${SOLANA_WALLETS[@]}"; do
            [[ -z "$$entry" ]] && continue
            label="$${entry%%:*}"
            address="$${entry#*:}"
            check_balance "$$label" "$$address" "$${SOLANA_RPC_URL}" "solanasvm"
          done

          sleep "$$INTERVAL"
        done
    environment:
      GORCHAIN_RPC_URL: ${GORCHAIN_RPC_URL}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      MONITORED_WALLETS_GORCHAIN: ${MONITORED_WALLETS_GORCHAIN:-}
      MONITORED_WALLETS_SOLANA: ${MONITORED_WALLETS_SOLANA:-}
      BALANCE_THRESHOLD_SOL: ${BALANCE_THRESHOLD_SOL:-1}
      BALANCE_CHECK_INTERVAL: ${BALANCE_CHECK_INTERVAL:-300}

volumes:
  # Config volumes — become ConfigMaps in k8s (contain "config" in name)
  prometheus-config:
  grafana-datasources-config:
  grafana-dashboard-config:
  grafana-dashboards:
  # Data volumes — become PVCs in k8s
  prometheus-data:
  grafana-data:

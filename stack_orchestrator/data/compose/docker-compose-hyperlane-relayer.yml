services:
  relayer:
    image: gcr.io/abacus-labs-dev/hyperlane-agent:agents-v2.0.0
    restart: unless-stopped
    hostname: relayer
    command:
      - relayer
      - --db
      - /data/relayer
      - --relayChains
      - gorchain,solanatestnet
      - --allowLocalCheckpointSyncers
      - "false"
      - --metricsPort
      - "9091"
    environment:
      CONFIG_FILES: /config/agent-config.json
      # Gas enforcement: None — Sealevel process_estimate_costs returns
      # hardcoded zeros, making OnChainFeeQuoting non-functional
      HYP_BASE_GASPAYMENTENFORCEMENT: '[{"type": "none"}]'
      # Key management — injected via secrets: in spec.yml (envFrom.secretRef)
      # HYP_BASE_CHAINS_GORCHAIN_SIGNER_KEY, HYP_BASE_CHAINS_SOLANATESTNET_SIGNER_KEY
      # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      # MinIO for reading validator checkpoints
      AWS_ENDPOINT_URL_S3: "http://hyperlane-minio:9000"
      AWS_REGION: us-east-1
    volumes:
      - agent-config:/config:ro
      - relayer-data:/data
    ports:
      - "9091"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9091 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  igp-fee-claim:
    # TODO: use git.vdb.to/laconicnetwork/hyperlane-svm-deployer:tag once CI publish workflows are set up
    image: laconicnetwork/hyperlane-svm-deployer:local
    restart: unless-stopped
    hostname: igp-fee-claim
    command: ["/bin/bash", "/opt/scripts/claim-fees.sh"]
    environment:
      GORCHAIN_RPC_URL: ${GORCHAIN_RPC_URL}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      GORCHAIN_IGP_PROGRAM_ID: ${GORCHAIN_IGP_PROGRAM_ID}
      SOLANA_IGP_PROGRAM_ID: ${SOLANA_IGP_PROGRAM_ID}
      # Key management — injected via secrets: in spec.yml (envFrom.secretRef)
      # RELAYER_KEYPAIR_JSON
    volumes:
      - igp-fee-claim-scripts-config:/opt/scripts:ro

volumes:
  agent-config:
  relayer-data:
  igp-fee-claim-scripts-config:

services:
  relayer:
    image: ghcr.io/gorbagana-dev/hyperlane-agent:latest
    # image: gorbagana-dev/hyperlane-agent:local
    user: "0"
    restart: unless-stopped
    hostname: relayer
    command:
      - ./relayer
      - --db
      - /data/relayer
      - --relayChains
      - gorchain,solana
      - --allowLocalCheckpointSyncers
      - "false"
      - --metricsPort
      - "9091"
    environment:
      CONFIG_FILES: /config/agent-config.json
      # agent-config.json carries placeholder rpcUrls; real URLs arrive here.
      # Solana (secret) is injected via secrets: as HYP_CHAINS_SOLANA_CUSTOMRPCURLS.
      HYP_CHAINS_GORCHAIN_CUSTOMRPCURLS: ${GORCHAIN_RPC_URL:-http://rpc-placeholder.invalid}
      # Gas enforcement: None — Sealevel process_estimate_costs returns
      # hardcoded zeros, making OnChainFeeQuoting non-functional
      HYP_GASPAYMENTENFORCEMENT: '[{"type": "none"}]'
      # Relay endorsement: only messages delivered to a known warp program.
      # Built by the warp-deployer; populated into config: by conftest (e2e) /
      # publish-bridge-state (prod). Default below is deny-all (an empty []
      # would mean relay-everything).
      HYP_WHITELIST: ${HYP_WHITELIST}
      # Key management — injected via secrets: in spec.yml (envFrom.secretRef)
      # HYP_CHAINS_GORCHAIN_SIGNER_KEY, HYP_CHAINS_SOLANA_SIGNER_KEY
      # No MinIO credentials needed — relayer uses anonymous S3 client (.no_credentials()).
      # MinIO endpoint — set in each spec's config: block.
      # Dev: http://hyperlane-minio:9000 (direct cross-NS via external-services selector).
      # Prod: https://s3.bridge.gorbagana.wtf (Caddy via public DNS, LE cert trusted by webpki-roots).
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3}
      AWS_REGION: us-east-1
    volumes:
      - agent-config:/config:ro
      - relayer-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9091 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  igp-fee-claim:
    image: ghcr.io/gorbagana-dev/hyperlane-svm-deployer:latest
    restart: unless-stopped
    hostname: igp-fee-claim
    command: ["/bin/bash", "/opt/scripts/claim-fees.sh"]
    environment:
      GORCHAIN_RPC_URL: ${GORCHAIN_RPC_URL}
      GORCHAIN_IGP_PROGRAM_ID: ${GORCHAIN_IGP_PROGRAM_ID}
      SOLANA_IGP_PROGRAM_ID: ${SOLANA_IGP_PROGRAM_ID}
      GORCHAIN_IGP_ACCOUNT: ${GORCHAIN_IGP_ACCOUNT}
      SOLANA_IGP_ACCOUNT: ${SOLANA_IGP_ACCOUNT}
      CLAIM_INTERVAL_SECONDS: ${CLAIM_INTERVAL_SECONDS:-21600}
      # Key management — injected via secrets: in spec.yml (envFrom.secretRef)
      # RELAYER_KEYPAIR_JSON
    volumes:
      - igp-fee-claim-scripts-config:/opt/scripts:ro

volumes:
  # agent-config: ConfigMap volume sourced from BridgeStateLoader at deploy-create
  agent-config:
  relayer-data:
  igp-fee-claim-scripts-config:

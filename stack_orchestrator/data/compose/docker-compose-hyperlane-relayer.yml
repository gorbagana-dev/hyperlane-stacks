services:
  relayer:
    image: gcr.io/abacus-labs-dev/hyperlane-agent:agents-v2.0.0
    restart: unless-stopped
    hostname: relayer
    command:
      - relayer
      - --db
      - /data/relayer
      - --relayChains
      - gorchain,solanatestnet
      - --allowLocalCheckpointSyncers
      - "false"
      - --metricsPort
      - "9091"
    environment:
      CONFIG_FILES: /config/agent-config.json
      # Gas enforcement: None — Sealevel process_estimate_costs returns
      # hardcoded zeros, making OnChainFeeQuoting non-functional
      HYP_BASE_GASPAYMENTENFORCEMENT: '[{"type": "none"}]'
      # Relayer signing keys (hex 0x...)
      HYP_BASE_CHAINS_GORCHAIN_SIGNER_KEY: ${RELAYER_KEY}
      HYP_BASE_CHAINS_SOLANATESTNET_SIGNER_KEY: ${RELAYER_KEY}
      # MinIO for reading validator checkpoints
      AWS_ENDPOINT_URL_S3: "http://hyperlane-minio:9000"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - agent-config:/config:ro
      - relayer-data:/data
    ports:
      - "9091"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9091 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  igp-fee-claim:
    image: git.vdb.to/laconicnetwork/hyperlane-svm-deployer:local
    restart: unless-stopped
    hostname: igp-fee-claim
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "IGP fee claim sidecar starting (interval: 6h)..."
        while true; do
          echo "[$(date -u)] Claiming IGP fees on Gorchain..."
          hyperlane-sealevel-client \
            --url "$GORCHAIN_RPC_URL" \
            igp claim \
            --program-id "$GORCHAIN_IGP_PROGRAM_ID" \
            --keypair /dev/stdin <<< "$$RELAYER_KEYPAIR_JSON" || \
            echo "Warning: Gorchain fee claim failed"

          echo "[$(date -u)] Claiming IGP fees on Solana..."
          hyperlane-sealevel-client \
            --url "$SOLANA_RPC_URL" \
            igp claim \
            --program-id "$SOLANA_IGP_PROGRAM_ID" \
            --keypair /dev/stdin <<< "$$RELAYER_KEYPAIR_JSON" || \
            echo "Warning: Solana fee claim failed"

          echo "[$(date -u)] Fee claim cycle complete. Sleeping 6h..."
          sleep 21600
        done
    environment:
      GORCHAIN_RPC_URL: ${GORCHAIN_RPC_URL}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      GORCHAIN_IGP_PROGRAM_ID: ${GORCHAIN_IGP_PROGRAM_ID}
      SOLANA_IGP_PROGRAM_ID: ${SOLANA_IGP_PROGRAM_ID}
      RELAYER_KEYPAIR_JSON: ${RELAYER_KEYPAIR_JSON}

volumes:
  agent-config:
  relayer-data:

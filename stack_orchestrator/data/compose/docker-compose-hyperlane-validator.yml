services:
  validator:
    image: ghcr.io/gorbagana-dev/hyperlane-agent:latest
    # image: gorbagana-dev/hyperlane-agent:local
    user: "0"
    restart: unless-stopped
    hostname: validator
    command:
      - /bin/bash
      - -c
      - |
        echo "Validator starting up..."
        echo "Waiting for KMS proxy on localhost:9999..."
        until echo > /dev/tcp/localhost/9999 2>/dev/null; do
          sleep 1
        done
        echo "KMS proxy is ready, starting validator"
        exec ./validator
    environment:
      # Hyperlane agent config (HYP_ prefix, _ separator)
      HYP_ORIGINCHAINNAME: ${ORIGIN_CHAIN_NAME}
      HYP_DB: /data/validator
      HYP_CHECKPOINTSYNCER_TYPE: s3
      HYP_CHECKPOINTSYNCER_BUCKET: ${CHECKPOINT_BUCKET}
      HYP_CHECKPOINTSYNCER_REGION: us-east-1
      HYP_VALIDATOR_TYPE: aws
      HYP_VALIDATOR_ID: ${PRIVY_WALLET_ID}
      HYP_VALIDATOR_REGION: us-east-1
      HYP_METRICSPORT: "9090"
      CONFIG_FILES: /config/agent-config.json
      # KMS proxy sidecar for Privy signing (same pod = localhost)
      AWS_ENDPOINT_URL_KMS: "http://localhost:9999"
      # MinIO for checkpoint storage (cross-namespace FQDN; PR2 replaces with external-services)
      AWS_ENDPOINT_URL_S3: "http://hyperlane-minio.laconic-hyperlane-minio.svc.cluster.local:9000"
      AWS_REGION: us-east-1
      # Key management — injected via secrets: in spec.yml (envFrom.secretRef)
      # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY — MinIO credentials
      # HYP_DEFAULTSIGNER_KEY — chain signer for announce tx (hot ed25519 hex key,
      #   separate from KMS validator key; only HexKey type supported for SVM)
    volumes:
      - agent-config:/config:ro
      - validator-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9090 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  kms-proxy:
    image: ghcr.io/gorbagana-dev/hyperlane-kms-proxy:latest
    # image: gorbagana-dev/hyperlane-kms-proxy:local
    restart: unless-stopped
    hostname: kms-proxy
    environment:
      LISTEN_ADDR: ":9999"
      # Key management — injected via secrets: in spec.yml (envFrom.secretRef)
      # PRIVY_APP_ID, PRIVY_APP_SECRET, PRIVY_WALLET_ID
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9999 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  # agent-config: ConfigMap volume sourced from BridgeStateLoader at deploy-create
  agent-config:
  validator-data:

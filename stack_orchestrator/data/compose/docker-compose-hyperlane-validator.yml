services:
  validator:
    image: gcr.io/abacus-labs-dev/hyperlane-agent:agents-v2.0.0
    restart: unless-stopped
    hostname: validator
    command:
      - validator
      - --origin-chain-name
      - ${ORIGIN_CHAIN_NAME}
      - --db
      - /data/validator
      - --checkpointSyncer.type
      - s3
      - --checkpointSyncer.bucket
      - ${CHECKPOINT_BUCKET}
      - --checkpointSyncer.region
      - us-east-1
      - --validator.type
      - aws
      - --validator.id
      - ${PRIVY_WALLET_ID}
      - --validator.region
      - us-east-1
      - --metricsPort
      - "9090"
    environment:
      # KMS proxy sidecar for Privy signing (same pod = localhost)
      AWS_ENDPOINT_URL_KMS: "http://localhost:9999"
      # MinIO for checkpoint storage (cross-stack, k8s service DNS)
      AWS_ENDPOINT_URL_S3: "http://hyperlane-minio:9000"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      CONFIG_FILES: /config/agent-config.json
    volumes:
      - agent-config:/config:ro
      - validator-data:/data
    ports:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9090 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  kms-proxy:
    # TODO: use git.vdb.to/laconicnetwork/hyperlane-kms-proxy:tag once CI publish workflows are set up
    image: laconicnetwork/hyperlane-kms-proxy:local
    restart: unless-stopped
    hostname: kms-proxy
    environment:
      KMS_PROXY_PORT: "9999"
      PRIVY_APP_ID: ${PRIVY_APP_ID}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET}
      PRIVY_WALLET_ID: ${PRIVY_WALLET_ID}
    ports:
      - "9999"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9999 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  # Config volume — becomes ConfigMap in k8s (contains "config" in name)
  agent-config:
  # Data volume — becomes PVC in k8s
  validator-data:

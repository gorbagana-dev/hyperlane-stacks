services:
  validator:
    image: gcr.io/abacus-labs-dev/hyperlane-agent:agents-v2.0.0
    restart: unless-stopped
    hostname: validator
    command:
      - validator
      - --origin-chain-name
      - solanatestnet
      - --db
      - /data/validator-solana
      - --checkpointSyncer.type
      - s3
      - --checkpointSyncer.bucket
      - hyperlane-validator-solana
      - --checkpointSyncer.region
      - us-east-1
      - --validator.type
      - aws
      - --validator.id
      - ${PRIVY_VALIDATOR_SOLANA_WALLET_ID}
      - --validator.region
      - us-east-1
      - --metricsPort
      - "9090"
    environment:
      AWS_ENDPOINT_URL_KMS: "http://localhost:9999"
      AWS_ENDPOINT_URL_S3: "http://hyperlane-minio:9000"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      CONFIG_FILES: /config/agent-config.json
    volumes:
      - agent-config:/config:ro
      - validator-solana-data:/data
    ports:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9090 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  kms-proxy:
    image: git.vdb.to/laconicnetwork/hyperlane-kms-proxy:local
    restart: unless-stopped
    hostname: kms-proxy
    environment:
      KMS_PROXY_PORT: "9999"
      PRIVY_APP_ID: ${PRIVY_APP_ID}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET}
      PRIVY_WALLET_ID: ${PRIVY_VALIDATOR_SOLANA_WALLET_ID}
    ports:
      - "9999"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9999 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  agent-config:
  validator-solana-data:

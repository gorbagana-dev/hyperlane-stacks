groups:
  - name: hyperlane-alerts
    rules:
      # Validator not signing checkpoints.
      # hyperlane_latest_checkpoint is a gauge tracking the latest checkpoint
      # index, labeled by phase. phase="validator_processed" increments when
      # the validator signs a new checkpoint. If the value hasn't changed in
      # 10 minutes, the validator is stuck.
      - alert: ValidatorNotSigning
        expr: |
          changes(
            hyperlane_latest_checkpoint{phase="validator_processed"}[10m]
          ) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Hyperlane validator on {{ $labels.chain }} not signing checkpoints"
          description: "Validator has not produced a new checkpoint in over 10 minutes."

      # Relayer message submission failures.
      # hyperlane_operations_processed_count tracks operations by phase and
      # chain. phase="submission_failed" indicates failed deliveries.
      - alert: RelayerSubmissionFailures
        expr: rate(hyperlane_operations_processed_count{phase="submission_failed"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hyperlane relayer failing to submit messages on {{ $labels.chain }}"
          description: "Relayer has been failing to deliver messages for 5 minutes."

      # Agent pod restart.
      # TODO: Requires kube-state-metrics to be deployed in the cluster.
      # Without it this alert is inert — kube_pod_container_status_restarts_total
      # won't exist.
      - alert: AgentPodRestarting
        expr: rate(kube_pod_container_status_restarts_total{pod=~".*hyperlane.*"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hyperlane agent pod {{ $labels.pod }} is restarting"
          description: "Pod has restarted in the last 15 minutes."

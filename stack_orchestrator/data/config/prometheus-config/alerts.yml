groups:
  - name: hyperlane-alerts
    # TODO: Verify actual Hyperlane agent metric names against the running
    # validator/relayer. These were written from docs and may not match the
    # exact metric names emitted by the Sealevel agents. Check:
    #   curl http://<agent-pod>:9090/metrics
    # The AgentPodRestarting alert requires kube-state-metrics to be deployed
    # in the cluster (it provides kube_pod_container_status_restarts_total).
    rules:
      # Validator not signing checkpoints
      - alert: ValidatorNotSigning
        expr: |
          time() - max by (app) (
            hyperlane_latest_checkpoint_observed_count{app=~".*validator.*"}
          ) > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Hyperlane validator {{ $labels.app }} not signing checkpoints"
          description: "Validator has not produced a new checkpoint in over 10 minutes."

      # Relayer delivery failures
      - alert: RelayerDeliveryFailures
        expr: rate(hyperlane_messages_processed_count{status="error"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hyperlane relayer experiencing delivery failures"
          description: "Relayer has been failing to deliver messages for 5 minutes."

      # Wallet balance low
      - alert: WalletBalanceLow
        expr: hyperlane_wallet_balance_sol < 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Wallet {{ $labels.wallet }} on {{ $labels.chain }} balance low"
          description: "Balance is {{ $value }} SOL, below threshold."

      # Agent pod restart
      - alert: AgentPodRestarting
        expr: rate(kube_pod_container_status_restarts_total{pod=~".*hyperlane.*"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hyperlane agent pod {{ $labels.pod }} is restarting"
          description: "Pod has restarted in the last 15 minutes."

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Validator metrics — scraped cross-host over public DNS via each validator's
  # Caddy hostname. The container entrypoint (run.sh) renders the
  # target list from PROMETHEUS_VALIDATOR_TARGETS into validators.yml on start.
  # hyperlane_instance distinguishes validators (incl. multiple on one chain).
  # Scheme is rendered from PROMETHEUS_SCRAPE_SCHEME (https prod, http e2e).
  - job_name: validators
    scheme: https
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/prometheus/targets/validators.yml"]

  # Relayer metrics — rendered from PROMETHEUS_RELAYER_TARGETS into relayer.yml.
  - job_name: relayers
    scheme: https
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/prometheus/targets/relayer.yml"]

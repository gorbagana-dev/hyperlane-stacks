global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Pushgateway (balance monitor metrics)
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["localhost:9091"]

  # Validator metrics — scraped cross-host over public DNS via each
  # validator's Caddy hostname. The target list is rendered from the
  # deployment spec (PROMETHEUS_VALIDATOR_TARGETS) into validators.yml by the
  # stack's deploy/commands.py hook; Prometheus watches that file and reloads
  # targets without a restart, so validators can be added to a live deployment.
  # hyperlane_instance distinguishes validators (incl. multiple on one chain).
  # Prod serves Let's Encrypt certs (trusted by the default CA bundle), so no
  # tls_config is needed. The e2e harness adds a tls_config.ca_file pointing at
  # the mkcert root CA for the .test hostnames.
  - job_name: validators
    scheme: https
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/validators.yml"]

  # Relayer metrics — rendered from PROMETHEUS_RELAYER_TARGETS into relayer.yml.
  - job_name: relayer
    scheme: https
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/relayer.yml"]

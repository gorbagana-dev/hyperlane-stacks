# Warp route configurations with sentinel placeholders.
# Compiled into Next.js bundles at build time, then replaced
# with real values by entrypoint.sh at container start.
#
# Collateral token lives on Solana (the original SPL token).
# Synthetic token is minted on Gorchain (the wrapped representation).
#
# Numeric fields (decimals) use sentinels — fix-numeric-types.js
# converts the stringified values back to numbers after sed replacement.

tokens:
  - chainName: __SOLANA_CHAIN_NAME__
    standard: SealevelHypCollateral
    decimals: __WARP_TOKEN_DECIMALS__
    name: __WARP_TOKEN_NAME__
    symbol: __WARP_TOKEN_SYMBOL__
    addressOrDenom: __WARP_COLLATERAL_ADDRESS__
    collateralAddressOrDenom: __WARP_TOKEN_MINT__
    mailbox: __SOLANA_MAILBOX__
    connections:
      - token: sealevel|__GORCHAIN_CHAIN_NAME__|__WARP_SYNTHETIC_ADDRESS__

  - chainName: __GORCHAIN_CHAIN_NAME__
    standard: SealevelHypSynthetic
    decimals: __WARP_TOKEN_DECIMALS__
    name: __WARP_SYNTHETIC_NAME__
    symbol: __WARP_SYNTHETIC_SYMBOL__
    addressOrDenom: __WARP_SYNTHETIC_ADDRESS__
    collateralAddressOrDenom: __WARP_SYNTHETIC_MINT__
    mailbox: __GORCHAIN_MAILBOX__
    connections:
      - token: sealevel|__SOLANA_CHAIN_NAME__|__WARP_COLLATERAL_ADDRESS__

options: {}

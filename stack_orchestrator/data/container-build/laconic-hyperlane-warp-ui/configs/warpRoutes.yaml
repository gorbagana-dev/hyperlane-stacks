# Warp route configurations with sentinel placeholders.
# These are replaced at container start by entrypoint.sh.

tokens:
  - chainName: __GORCHAIN_CHAIN_NAME__
    standard: sealevelCollateral
    addressOrDenom: __WARP_COLLATERAL_ADDRESS__
    collateralAddressOrDenom: __WARP_COLLATERAL_ADDRESS__
    connections:
      - token: sealevelSynthetic|__SOLANA_CHAIN_NAME__|__WARP_SYNTHETIC_ADDRESS__

  - chainName: __SOLANA_CHAIN_NAME__
    standard: sealevelSynthetic
    addressOrDenom: __WARP_SYNTHETIC_ADDRESS__
    connections:
      - token: sealevelCollateral|__GORCHAIN_CHAIN_NAME__|__WARP_COLLATERAL_ADDRESS__

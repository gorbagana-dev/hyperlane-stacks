# Chain configurations with sentinel placeholders.
# Compiled into Next.js bundles at build time, replaced at runtime by entrypoint.sh.
#
# Numeric fields (chainId, domainId, decimals) use sentinels too — they compile
# as strings, then fix-numeric-types.js converts them back to numbers after
# sed replacement. This lets the image be reused across deployments with
# different chain IDs.

gorchain:
  chainId: __GORCHAIN_CHAIN_ID__
  domainId: __GORCHAIN_DOMAIN_ID__
  name: __GORCHAIN_CHAIN_NAME__
  protocol: sealevel
  mailbox: __GORCHAIN_MAILBOX__
  rpcUrls:
    - http: __GORCHAIN_RPC_URL__
  nativeToken:
    name: __GORCHAIN_NATIVE_TOKEN_NAME__
    symbol: __GORCHAIN_NATIVE_TOKEN_SYMBOL__
    decimals: __GORCHAIN_NATIVE_TOKEN_DECIMALS__
  blocks:
    confirmations: 1
    estimateBlockTime: 0.4
    reorgPeriod: 0

solana:
  chainId: __SOLANA_CHAIN_ID__
  domainId: __SOLANA_DOMAIN_ID__
  name: __SOLANA_CHAIN_NAME__
  protocol: sealevel
  mailbox: __SOLANA_MAILBOX__
  rpcUrls:
    - http: __SOLANA_RPC_URL__
  nativeToken:
    name: __SOLANA_NATIVE_TOKEN_NAME__
    symbol: __SOLANA_NATIVE_TOKEN_SYMBOL__
    decimals: __SOLANA_NATIVE_TOKEN_DECIMALS__
  blocks:
    confirmations: 1
    estimateBlockTime: 0.4
    reorgPeriod: 0

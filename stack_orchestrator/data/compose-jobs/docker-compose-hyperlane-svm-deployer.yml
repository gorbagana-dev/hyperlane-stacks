services:
  deployer:
    image: ghcr.io/gorbagana-dev/hyperlane-svm-deployer:latest
    restart: "no"
    entrypoint: ["/bin/bash"]
    command: ["/opt/scripts/deploy.sh"]
    environment:
      GORCHAIN_RPC_URL: ${GORCHAIN_RPC_URL}
      GORCHAIN_DOMAIN_ID: ${GORCHAIN_DOMAIN_ID}
      SOLANA_DOMAIN_ID: ${SOLANA_DOMAIN_ID}
      GORCHAIN_CHAIN_ID: ${GORCHAIN_CHAIN_ID}
      SOLANA_CHAIN_ID: ${SOLANA_CHAIN_ID}
      GORCHAIN_IS_TESTNET: ${GORCHAIN_IS_TESTNET:-true}
      SOLANA_IS_TESTNET: ${SOLANA_IS_TESTNET:-true}
      FORCE_REDEPLOY: ${FORCE_REDEPLOY:-false}
      # Key management + SOLANA_RPC_URL — injected via secrets: in spec.yml
      # (envFrom.secretRef), so they're not repeated in this environment block.
      # DEPLOYER_KEYPAIR, BRIDGE_OWNER_PUBKEY, IGP_ORACLE_PUBKEY
      # GORCHAIN_VALIDATOR_ADDRESS, SOLANA_VALIDATOR_ADDRESS, SOLANA_RPC_URL
    volumes:
      - deployer-scripts-config:/opt/scripts:ro
      - deployer-gas-oracle-config:/config/gas-oracle:ro
      - deployer-multisig-config:/config/multisig:ro
      - deployer-registry-config:/config/registry:ro
      - bridge-state:/state
      - bridge-logs:/logs

volumes:
  deployer-scripts-config:
  deployer-gas-oracle-config:
  deployer-multisig-config:
  deployer-registry-config:
  bridge-state:
  bridge-logs:

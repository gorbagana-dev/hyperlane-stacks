services:
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        MINIO_URL="http://hyperlane-minio:9000"

        # Wait for MinIO S3 API to be fully ready.
        # mc alias set can succeed before MinIO is fully operational,
        # so we also verify with mc ls (actual S3 ListBuckets call).
        echo "Waiting for MinIO to be ready at $${MINIO_URL}..."
        retries=0
        until mc alias set local "$${MINIO_URL}" $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} 2>/dev/null \
              && mc ls local 2>/dev/null; do
          retries=$$((retries + 1))
          if [ "$$retries" -ge 90 ]; then
            echo "MinIO not ready after 180s, giving up"
            exit 1
          fi
          echo "MinIO not ready yet, retrying in 2s..."
          sleep 2
        done
        echo "MinIO is ready"

        mc mb --ignore-existing local/hyperlane-validator-gorchain
        mc mb --ignore-existing local/hyperlane-validator-solana

        # Allow anonymous read access so the relayer can fetch checkpoints
        # without AWS credentials (it uses an anonymous S3 client).
        # Retry each command — MinIO may briefly drop connections after startup.
        for bucket in hyperlane-validator-gorchain hyperlane-validator-solana; do
          retries=0
          until mc anonymous set download "local/$${bucket}"; do
            retries=$$((retries + 1))
            if [ "$$retries" -ge 30 ]; then
              echo "Failed to set anonymous policy on $${bucket} after 30 retries"
              exit 1
            fi
            echo "Retrying anonymous set for $${bucket} in 3s..."
            sleep 3
          done
        done

        echo "Buckets created with public read access"
    # Key management — injected via secrets: in spec.yml (envFrom.secretRef)
    # MINIO_ROOT_USER, MINIO_ROOT_PASSWORD

services:
  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Wait for MinIO to be ready (the SO stack service routes to port 9000)
        echo "Waiting for MinIO to be ready..."
        until mc alias set local http://hyperlane-minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} 2>/dev/null; do
          echo "MinIO not ready yet, retrying in 2s..."
          sleep 2
        done
        mc mb --ignore-existing local/hyperlane-validator-gorchain
        mc mb --ignore-existing local/hyperlane-validator-solana
        echo "Buckets created successfully"
    # Key management — injected via secrets: in spec.yml (envFrom.secretRef)
    # MINIO_ROOT_USER, MINIO_ROOT_PASSWORD

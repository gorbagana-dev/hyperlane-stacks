version: "1.1"
name: hyperlane-explorer
description: "Hyperlane Explorer — self-hosted message indexer + search UI (frontend + scraper + Postgres + Hasura)"
repos:
  - github.com/gorbagana-dev/hyperlane-explorer@v12.0.0-gorbagana.2
  # Scraper is built from the gorbagana monorepo fork (indexing tolerant of
  # pruned slots), pinned to the same release tag as the deployer and agents so
  # it decodes the on-chain programs' Sealevel account layouts consistently.
  - github.com/gorbagana-dev/hyperlane-monorepo@v2.2.0-gorbagana.1
# containers is commented out so deploy-start won't kind-load the images;
# k8s pulls them from the registry instead. Uncomment for local builds.
# (hasura is the upstream image, wired via the hasura-config configmap — not built.)
# containers:
#   - gorbagana-dev/hyperlane-explorer
#   - gorbagana-dev/hyperlane-scraper
pods:
  - hyperlane-explorer

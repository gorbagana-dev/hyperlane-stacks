# RBAC for the warp deployer pod to read/write ConfigMaps.
# Grants permissions to the default ServiceAccount used by SO deployments.
# If the core deployer RBAC is already applied, this is a no-op (same names).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hyperlane-deployer
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hyperlane-deployer
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
roleRef:
  kind: Role
  name: hyperlane-deployer
  apiGroup: rbac.authorization.k8s.io

version: "1.1"
name: hyperlane-svm-warp-deployer
description: "Deploys Hyperlane warp route contracts for a specific token pair"
repos:
  # gorbagana monorepo fork, same release tag as the agents and scraper. Reuses
  # the hyperlane-svm-deployer image; pin kept in lockstep with that stack.
  - github.com/gorbagana-dev/hyperlane-monorepo@v2.2.0-gorbagana.1
# containers is commented out so deploy-start won't kind-load the image;
# k8s pulls it from the registry instead. Uncomment for local builds.
# containers:
#   - gorbagana-dev/hyperlane-svm-deployer
jobs:
  - hyperlane-svm-warp-deployer

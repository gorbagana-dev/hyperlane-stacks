---
# Clone/update the stack repo on this host so laconic-so deploy create can read
# the committed specs + stack definitions locally. Tracks deploy_branch, which
# publish-bridge-state pushes the deployment-derived spec edits back to. Uses the
# forwarded SSH agent (ansible.cfg sets ForwardAgent) — no creds stored on hosts.
# Caller may override repo_base_dir (validators do, under delegation).

# Consumer stacks (relayer/validators) render runtime tokens + external-services into the
# committed specs in this clone before `deploy create`. Those edits are deploy-time and
# host-specific; discard them here so a later publish-bridge-state `git add` can't sweep
# them into the branch. Untracked paths (the deployer's generated/) are left untouched.
# rc is ignored: on the first run the clone doesn't exist yet (the fetch below creates it).
- name: "{{ '[' ~ stack_name ~ '] ' if stack_name is defined else '' }}Discard deploy-time spec renders before fetch (start from the committed branch)"
  ansible.builtin.command:
    chdir: "{{ repo_root }}"
    argv:
      - git
      - reset
      - --hard
      - HEAD
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: "{{ '[' ~ stack_name ~ '] ' if stack_name is defined else '' }}Fetch/update the stack repo on this host"
  ansible.builtin.command:
    argv:
      - laconic-so
      - fetch-stack
      - "{{ stack_repo_locator }}@{{ deploy_branch }}"
      - --git-ssh
      - --pull
  environment:
    CERC_REPO_BASE_DIR: "{{ repo_base_dir }}"
    # accept-new: fresh hosts have no github.com in known_hosts; a TOFU accept
    # beats an interactive prompt that non-interactive ssh turns into a hard fail.
    GIT_SSH_COMMAND: "ssh -o ForwardAgent=yes -o StrictHostKeyChecking=accept-new"
  register: _fetch
  changed_when: >-
    'Cloning' in _fetch.stdout or 'Updating' in _fetch.stdout
    or 'switching to branch' in _fetch.stdout
  when: not ansible_check_mode

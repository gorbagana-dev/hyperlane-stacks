---
- name: Install prerequisite apt packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, git]
    state: present
    update_cache: true
  become: true

- name: Ensure apt keyrings dir exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add Docker apt repository key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present
  become: true

- name: Install Docker engine
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true
  become: true

- name: Add deploy_user to docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
  become: true

- name: Install kind binary
  ansible.builtin.get_url:
    url: >-
      https://kind.sigs.k8s.io/dl/{{ prerequisites_privileged_kind_version }}/kind-linux-{{ 'amd64' if
      ansible_architecture == 'x86_64' else 'arm64' }}
    dest: /usr/local/bin/kind
    mode: "0755"
  become: true

- name: Install kubectl binary
  ansible.builtin.get_url:
    url: >-
      https://dl.k8s.io/release/{{ prerequisites_privileged_kubectl_version }}/bin/linux/{{ 'amd64' if
      ansible_architecture == 'x86_64' else 'arm64' }}/kubectl
    dest: /usr/local/bin/kubectl
    mode: "0755"
  become: true

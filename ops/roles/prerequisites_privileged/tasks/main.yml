---
- name: Set Go-style arch for binary downloads
  ansible.builtin.set_fact:
    kube_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"

- name: Install prerequisite apt packages
  ansible.builtin.apt:
    # bind9-dnsutils: stack_deploy's preflight shells `dig` on multi-topology hosts
    name: [ca-certificates, curl, gnupg, git, bind9-dnsutils]
    state: present
    update_cache: true
  become: true

- name: Ensure apt keyrings dir exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add Docker apt repository key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true

- name: Read the downloaded Docker key fingerprint
  ansible.builtin.command:
    cmd: gpg --show-keys --with-colons /etc/apt/keyrings/docker.asc
  register: docker_key_show
  changed_when: false
  become: true

- name: Fail unless the Docker key matches the published fingerprint
  ansible.builtin.assert:
    that: "'9DC858229FC7DD38854AE2D88D81803C0EBFCD88' in docker_key_show.stdout"
    fail_msg: "Docker GPG key fingerprint mismatch — refusing to add the repo (possible tampering)"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ kube_arch }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present
  become: true

- name: Install Docker engine
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true
  become: true

- name: Add deploy_user to docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
  become: true

- name: Install kind binary (checksum-verified against the release sha256sum)
  ansible.builtin.get_url:
    url: >-
      https://kind.sigs.k8s.io/dl/{{ prerequisites_privileged_kind_version }}/kind-linux-{{ kube_arch }}
    checksum: >-
      sha256:https://github.com/kubernetes-sigs/kind/releases/download/{{
      prerequisites_privileged_kind_version }}/kind-linux-{{ kube_arch }}.sha256sum
    dest: /usr/local/bin/kind
    mode: "0755"
  become: true

- name: Install kubectl binary (checksum-verified against the published sha256)
  ansible.builtin.get_url:
    url: >-
      https://dl.k8s.io/release/{{ prerequisites_privileged_kubectl_version }}/bin/linux/{{ kube_arch }}/kubectl
    checksum: >-
      sha256:https://dl.k8s.io/release/{{ prerequisites_privileged_kubectl_version }}/bin/linux/{{
      kube_arch }}/kubectl.sha256
    dest: /usr/local/bin/kubectl
    mode: "0755"
  become: true

# Installed system-wide (not deploy_user's ~/bin) so the deploy account needs no sudo
# at any point — all root work lives in this privileged play. force: the release ships
# no checksum, so without it a bumped laconic_so_version would never replace the binary.
- name: Install laconic-so release binary (replace on version bump)
  ansible.builtin.get_url:
    url: "{{ laconic_so_release_base_url }}/{{ laconic_so_version }}/laconic-so"
    dest: /usr/local/bin/laconic-so
    mode: "0755"
    force: true
  become: true

- name: Create kind_mount_root owned by deploy_user
  ansible.builtin.file:
    path: "{{ kind_mount_root }}"
    state: directory
    mode: "0755"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
  become: true

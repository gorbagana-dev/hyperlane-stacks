---
# Load the operator secrets file (inventory_dir/secrets.yml) into play vars at task time.
# A play-level `vars_files: "{{ inventory_dir }}/secrets.yml"` warns and skips on
# ansible-core 2.19+ (vars_files are templated before inventory_dir is bound); include_vars
# runs at task time, where inventory_dir is defined. no_log keeps secrets out of -v output.
- name: Locate the inventory secrets file
  ansible.builtin.stat:
    path: "{{ secrets_file | default(inventory_dir ~ '/secrets.yml') }}"
  register: _secrets_file
- name: The inventory secrets file must exist
  ansible.builtin.assert:
    that: _secrets_file.stat.exists
    fail_msg: >-
      {{ secrets_file | default(inventory_dir ~ '/secrets.yml') }} not found —
      copy secrets.example.yml to secrets.yml and fill it in.
- name: Load the operator secrets
  ansible.builtin.include_vars: "{{ secrets_file | default(inventory_dir ~ '/secrets.yml') }}"
  no_log: true

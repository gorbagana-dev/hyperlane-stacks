---
# Render the routes selected by the spec's WARP_ROUTES into the warp-deployer's
# configmap dir as JSON, before the Job starts. Runs inside the stack_deploy role
# context, so it reads the role's resolved _spec_file/_deploy_dir.
#
# The spec + route files live on the DEPLOY HOST (fetched clone), so read them with
# slurp — lookup('file') runs on the CONTROLLER and can't see the host's clone (it
# only works when controller == host, e.g. the e2e harness).
# Inputs: _spec_file, _deploy_dir, deployment_root, bridge_name.
- name: Read the warp-deployer spec from the host
  ansible.builtin.slurp:
    src: "{{ _spec_file }}"
  register: _warp_spec_raw

- name: Select warp routes from the spec's WARP_ROUTES
  ansible.builtin.set_fact:
    _warp_routes: >-
      {{ (_warp_spec_raw.content | b64decode | from_yaml).config.WARP_ROUTES.replace(',', ' ').split() }}

- name: Ensure warp-routes-config dir exists
  ansible.builtin.file:
    path: "{{ _deploy_dir }}/configmaps/warp-routes-config"
    state: directory
    mode: "0755"

- name: Read each selected route file from the host
  ansible.builtin.slurp:
    src: "{{ deployment_root }}/bridges/{{ bridge_name }}/warp-routes/{{ item }}.yml"
  register: _warp_route_files
  loop: "{{ _warp_routes }}"
  loop_control:
    label: "{{ item }}"

# Catch malformed menu entries here instead of inside the deployer Job: deploy.sh
# reads these fields without defaults (a missing one becomes the string "null"), and
# --argjson requires decimals to be a YAML integer, not a quoted string.
- name: Sanity-check each selected route file
  ansible.builtin.assert:
    that:
      - _r.name | default('') | length > 0
      - _r.origin.chain | default('') in ['gorchain', 'solana']
      - _r.remote.chain | default('') in ['gorchain', 'solana']
      - _r.origin.chain != _r.remote.chain
      - _r.origin.type | default('') in ['native', 'collateral', 'synthetic']
      - _r.remote.type | default('') in ['native', 'collateral', 'synthetic']
      - _r.origin.name | default('') | length > 0
      - _r.remote.name | default('') | length > 0
      - _r.origin.symbol | default('') | length > 0
      - _r.remote.symbol | default('') | length > 0
      - _r.origin.decimals | default('x') is integer
      - _r.remote.decimals | default('x') is integer
      - _r.origin.type != 'collateral' or (_r.origin.token | default('') | length > 0)
    fail_msg: >-
      Route '{{ item.item }}' is malformed: it needs name; origin/remote each with
      chain (gorchain|solana, different per side), type (native|collateral|synthetic),
      name, symbol, and integer decimals; and origin.token when origin.type=collateral.
    quiet: true
  vars:
    _r: "{{ item.content | b64decode | from_yaml }}"
  loop: "{{ _warp_route_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Route names must be unique across the selection
  ansible.builtin.assert:
    that: _names | length == (_names | unique | length)
    fail_msg: "Duplicate route name(s) across the WARP_ROUTES selection: {{ _names }}"
    quiet: true
  vars:
    _names: >-
      {{ _warp_route_files.results | map(attribute='content')
         | map('b64decode') | map('from_yaml') | map(attribute='name') | list }}

# Routes carrying a runtime-generated collateral mint ship token: __WARP_TOKEN_MINT__
# and resolve it from this file on the deploy host. Single-host: prepare-chains.yml
# writes it (chain host == deploy host). Multi-host: the operator drops the
# deploy-spl-token output here next to the keys. Routes with a committed mint
# (prod/staging) carry no placeholder and never touch this file (failed_when: false).
- name: Read the persisted collateral mint, if any
  ansible.builtin.slurp:
    src: "{{ credentials_dir }}/warp-token-mint"
  register: _warp_mint_raw
  failed_when: false

- name: Resolve the collateral mint
  ansible.builtin.set_fact:
    _warp_token_mint: "{{ (_warp_mint_raw.content | b64decode | trim) if (_warp_mint_raw.content is defined) else '' }}"

- name: A collateral mint must be available for routes using __WARP_TOKEN_MINT__
  ansible.builtin.assert:
    that:
      - "not ((item.content | b64decode | string) is search('__WARP_TOKEN_MINT__')) or (_warp_token_mint | length > 0)"
    fail_msg: >-
      Route '{{ item.item }}' uses __WARP_TOKEN_MINT__ but no mint is available at
      {{ credentials_dir }}/warp-token-mint. Single-host: run prepare-chains.yml (it
      persists the mint). Multi-host: write the deploy-spl-token mint to that file on
      this host, alongside the keys.
    quiet: true
  loop: "{{ _warp_route_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Render each selected route file to JSON (substituting the runtime mint)
  ansible.builtin.copy:
    dest: "{{ _deploy_dir }}/configmaps/warp-routes-config/{{ item.item }}.json"
    content: >-
      {{ (item.content | b64decode | from_yaml | to_nice_json)
         | replace('__WARP_TOKEN_MINT__', _warp_token_mint) }}
    mode: "0644"
  loop: "{{ _warp_route_files.results }}"
  loop_control:
    label: "{{ item.item }}"

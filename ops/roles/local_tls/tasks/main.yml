---
- name: This role is single-host (mkcert) only
  ansible.builtin.assert:
    that: topology == 'single'
    fail_msg: "local_tls runs only on the single-host topology (topology=single)."

- name: Load validators (for cert SANs)
  ansible.builtin.include_tasks: ../common/tasks/load_validators.yml

- name: Derive the cert hostname list from dns_record_map + validators
  ansible.builtin.set_fact:
    mkcert_hostnames: "{{ _base_hosts + _validator_hosts }}"
  vars:
    # regex_replace on '$' appends, on '^' prepends — no backreferences, no escaping.
    _base_hosts: "{{ dns_record_map.keys() | map('regex_replace', '$', '.' ~ dns_zone) | list }}"
    _validator_hosts: >-
      {{ validators | map(attribute='chain')
         | map('regex_replace', '^', 'validator-')
         | map('regex_replace', '$', '.' ~ dns_zone) | list }}

- name: Install mkcert binary
  become: true
  ansible.builtin.get_url:
    url: "{{ mkcert_url }}"
    dest: /usr/local/bin/mkcert
    mode: "0755"
    checksum: "sha256:{{ mkcert_sha256 }}"

# All mkcert invocations run as the deploy user so the CAROOT ($HOME/.local/share/mkcert)
# is consistent; the CA is trusted system-wide by the explicit privileged step below.
# CAROOT is per-user — keep these tasks unprivileged so they match the leaf-gen user.
- name: Find the mkcert CAROOT
  ansible.builtin.command: mkcert -CAROOT
  register: _caroot
  changed_when: false

- name: Ensure the cert dir exists
  ansible.builtin.file:
    path: "{{ local_tls_cert_dir }}"
    state: directory
    mode: "0755"

- name: Generate the multi-SAN leaf cert (lazily creates the local CA in CAROOT)
  # Each hostname is its own argv element. Guarded by creates: delete bridge.crt to
  # force re-issue if dns_zone/validators change.
  ansible.builtin.command:
    argv: "{{ _mkcert_base_argv + mkcert_hostnames }}"
  vars:
    _mkcert_base_argv:
      - mkcert
      - -cert-file
      - "{{ local_tls_cert_dir }}/bridge.crt"
      - -key-file
      - "{{ local_tls_cert_dir }}/bridge.key"
  args:
    creates: "{{ local_tls_cert_dir }}/bridge.crt"

- name: Trust the mkcert root CA in the host system store
  become: true
  ansible.builtin.copy:
    src: "{{ _caroot.stdout }}/rootCA.pem"
    dest: /usr/local/share/ca-certificates/mkcert-hyperlane-local.crt
    remote_src: true
    mode: "0644"
  notify: Refresh system trust store

- name: Ensure the caddy cert-backup dir exists
  ansible.builtin.file:
    path: "{{ kind_mount_root }}/caddy-cert-backup"
    state: directory
    mode: "0755"

- name: Slurp cert + key (slurp returns base64-encoded content)
  ansible.builtin.slurp:
    src: "{{ item }}"
  register: _slurped
  no_log: true
  loop:
    - "{{ local_tls_cert_dir }}/bridge.crt"
    - "{{ local_tls_cert_dir }}/bridge.key"

- name: Build the Caddy pre-seed backup (holds the private key — owner-only)
  ansible.builtin.template:
    src: caddy-secrets.yaml.j2
    dest: "{{ kind_mount_root }}/caddy-cert-backup/caddy-secrets.yaml"
    mode: "0600"
  vars:
    cert_b64: "{{ _slurped.results[0].content }}"
    key_b64: "{{ _slurped.results[1].content }}"
    json_b64: "{{ '{}' | b64encode }}"
  no_log: true

- name: Publish rootCA.pem for the operator to fetch (workstation browser trust)
  ansible.builtin.copy:
    src: "{{ _caroot.stdout }}/rootCA.pem"
    dest: "{{ local_tls_published_ca }}"
    remote_src: true
    mode: "0644"

- name: Point the host /etc/hosts at loopback for every bridge hostname
  become: true
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} hyperlane local_tls"
    block: |
      {% for host in mkcert_hostnames %}
      127.0.0.1 {{ host }}
      {% endfor %}

---
# Where mkcert writes the leaf cert/key and where we publish rootCA.pem for the operator
# to scp down for workstation browser trust.
local_tls_cert_dir: "{{ credentials_dir }}/local-certs"
local_tls_published_ca: "{{ credentials_dir }}/local-rootCA.pem"
# mkcert release pinned (version + checksum) for reproducible, tamper-evident installs.
mkcert_version: "v1.4.4"
mkcert_sha256: "6d31c65b03972c6dc4a14ab429f2928300518b26503f58723e532d1b0a3bbb52"
_mkcert_base_url: "https://github.com/FiloSottile/mkcert/releases/download"
mkcert_url: "{{ _mkcert_base_url }}/{{ mkcert_version }}/mkcert-{{ mkcert_version }}-linux-amd64"

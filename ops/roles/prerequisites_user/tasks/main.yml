---
# Everything here runs as deploy_user with NO sudo: the laconic-so binary and
# kind_mount_root are installed by the privileged play (prerequisites_privileged),
# so the deploy account never needs to be in sudoers.
- name: Create credentials dir (0700)
  ansible.builtin.file:
    path: "{{ credentials_dir }}"
    state: directory
    mode: "0700"

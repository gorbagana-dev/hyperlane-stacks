---
- name: Require Cloudflare token
  ansible.builtin.assert:
    that: "cloudflare_api_token | default('') | length > 0"
    fail_msg: "cloudflare_api_token missing — set it in secrets.yml"

- name: Load validator-derived DNS records
  ansible.builtin.include_tasks: ../common/tasks/load_validators.yml

# Envs may declare dns_records statically (prod/staging) OR give a dns_record_map
# of subdomain -> inventory group; the latter resolves each record to that group's
# host, so one map serves any topology (local). Skipped when no map is set.
- name: Derive dns_records from group membership when a map is given
  ansible.builtin.set_fact:
    dns_records: >-
      {{ dns_records | default([])
         + [{'name': item.key, 'host': groups[item.value] | first}] }}
  loop: "{{ dns_record_map | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: dns_record_map is defined

- name: Derive the record-name prefix nesting base_domain under the registered zone
  ansible.builtin.set_fact:
    _base_domain_prefix: >-
      {{ '' if base_domain == cloudflare_zone
         else '.' ~ (base_domain | regex_replace('\.' ~ (cloudflare_zone | regex_escape) ~ '$', '')) }}

# A dns_records entry `name: "@"` means base_domain itself (e.g. the warp-ui URL
# bridge.gorbagana.wtf): the Cloudflare record is the nesting prefix alone, or
# the true zone apex '@' when base_domain IS the registered zone.
- name: Derive the apex record name (base_domain itself)
  ansible.builtin.set_fact:
    _dns_apex_record: "{{ _base_domain_prefix[1:] if _base_domain_prefix else '@' }}"

- name: base_domain must equal or nest under cloudflare_zone  # noqa: name[casing] starts with the var it validates
  ansible.builtin.assert:
    that: "base_domain == cloudflare_zone or base_domain.endswith('.' ~ cloudflare_zone)"
    fail_msg: >-
      base_domain '{{ base_domain }}' is not under cloudflare_zone '{{ cloudflare_zone }}' —
      fix group_vars.
    quiet: true

- name: Build host -> public_ip map from host_vars
  ansible.builtin.set_fact:
    host_ip_map: "{{ host_ip_map | default({}) | combine({item: hostvars[item].public_ip}) }}"
  loop: "{{ (dns_records + validator_dns_records) | map(attribute='host') | unique }}"

- name: Reconcile A records (additive)
  community.general.cloudflare_dns:
    api_token: "{{ cloudflare_api_token }}"
    zone: "{{ cloudflare_zone }}"
    record: "{{ _dns_apex_record if item.name == '@' else item.name ~ _base_domain_prefix }}"
    type: A
    value: "{{ host_ip_map[item.host] }}"
    ttl: "{{ dns_record_ttl }}"
    proxied: "{{ dns_proxied }}"
    state: present
  loop: "{{ dns_records + validator_dns_records }}"
  loop_control:
    label: "{{ base_domain if item.name == '@' else item.name ~ '.' ~ base_domain }}"
  when: not ansible_check_mode

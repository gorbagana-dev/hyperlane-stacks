---
- name: Load secrets
  ansible.builtin.set_fact:
    _secrets: "{{ lookup('ansible.builtin.file', secrets_file) | from_yaml | default({}, true) }}"

- name: Required operator-supplied secrets are present
  ansible.builtin.assert:
    that: "item in _secrets and (_secrets[item] | length > 0)"
    fail_msg: "Required secret '{{ item }}' missing from {{ secrets_file }}"
  loop:
    - cloudflare_api_token
    - privy_app_id
    - privy_app_secret

- name: Stop here when only asserting (used by tests)
  ansible.builtin.meta: end_play
  when: distribute_only_assert | default(false) | bool

- name: Derive validator labels
  ansible.builtin.include_tasks: ../common/tasks/load_validators.yml

- name: Ensure credentials dir on each validator host
  ansible.builtin.file:
    path: ~/.credentials/hyperlane
    state: directory
    mode: "0700"
  delegate_to: "{{ item.host }}"
  loop: "{{ validators }}"
  loop_control:
    label: "{{ item.label }}"
  when: not ansible_check_mode

- name: Drop per-validator MinIO key_id
  ansible.builtin.copy:
    content: "{{ _secrets.minio_iam[item.label].key_id }}"
    dest: "~/.credentials/hyperlane/{{ item.label }}-minio.key_id"
    mode: "0600"
  delegate_to: "{{ item.host }}"
  loop: "{{ validators }}"
  loop_control:
    label: "{{ item.label }}"
  no_log: true
  when: not ansible_check_mode

- name: Drop per-validator MinIO secret
  ansible.builtin.copy:
    content: "{{ _secrets.minio_iam[item.label].secret }}"
    dest: "~/.credentials/hyperlane/{{ item.label }}-minio.secret"
    mode: "0600"
  delegate_to: "{{ item.host }}"
  loop: "{{ validators }}"
  loop_control:
    label: "{{ item.label }}"
  no_log: true
  when: not ansible_check_mode

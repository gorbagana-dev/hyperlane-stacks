---
# Path to the gitignored secrets file for the active env.
secrets_file: "{{ inventory_dir }}/secrets.yml"

# Operator-supplied secrets distribute.yml requires before running. Envs that
# need fewer (e.g. local has no Cloudflare DNS and no Helius) override this in
# their group_vars.
required_operator_secrets:
  - cloudflare_api_token
  - privy_app_id
  - privy_app_secret
  - privy_oracle_wallet_id
  - helius_api_key
  - ghcr_pat

---
# Stop every stack on a host. Single-stack stops skip cluster management; pass
# -e destroy_cluster=true to tear the cluster down after. Deployments are
# discovered under ~/deployments (excluding the fetched hyperlane-stacks clone),
# so this covers every stack — deployers, validators, consumers — without a list
# to keep in sync.
#
# For a clean slate, add -e wipe_data=true: removes the deployment dirs and the
# persisted host-path volumes under kind_mount_root (keeping caddy-cert-backup so
# setup-all needn't re-run). Combine with destroy_cluster. The chains under
# ~/chains are never touched.
#
# Privilege: the stop/destroy work and the deployment-dir removal run as the
# unprivileged deploy_user (Docker group + deploy_user-owned dirs — no sudo). Only
# the kind-written, root-owned host-path data needs root, so that is the second
# play below, run as privileged_user. It stays a single invocation: -e wipe_data=true
# triggers the privileged play; add -K if privileged_user lacks passwordless sudo.
- name: Stop stacks (deploy_user — no sudo)
  hosts: all:!controller
  gather_facts: true
  vars:
    destroy_cluster: false
    wipe_data: false
  tasks:
    - name: Find laconic deployments on this host
      ansible.builtin.find:
        paths: "{{ ansible_env.HOME }}/deployments"
        file_type: directory
        patterns: "hyperlane-*"
        excludes: "hyperlane-stacks"
        recurse: false
      register: _deployments

    # Run from repo_root so any relative stack path in the deployment resolves
    # (consistent with deploy create/start; failed_when:false would otherwise mask it).
    - name: Stop each deployment (skip cluster management)
      ansible.builtin.command:
        chdir: "{{ repo_root }}"
        argv:
          - laconic-so
          - deployment
          - --dir
          - "{{ item.path }}"
          - stop
          - --skip-cluster-management
      changed_when: true
      failed_when: false
      loop: "{{ _deployments.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Destroy the host cluster on request
      ansible.builtin.command:
        argv:
          - kind
          - delete
          - cluster
          - --name
          - hyperlane
      changed_when: true
      when: destroy_cluster | bool

    # deploy_user owns ~/deployments, so this needs no escalation.
    - name: Remove the discovered deployment dirs (wipe)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _deployments.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: wipe_data | bool

# kind writes the host-path data as root, so removing it is the one teardown step
# that needs sudo — done as privileged_user to keep the deploy account sudo-free.
# A plain stop ends at the meta task below and never connects here.
- name: Wipe root-owned host-path data on request (privileged_user)
  hosts: all:!controller
  gather_facts: false
  become: true
  vars:
    wipe_data: false
    ansible_user: "{{ privileged_user }}"
  tasks:
    - name: Nothing to wipe unless requested
      ansible.builtin.meta: end_play
      when: not (wipe_data | bool)

    # Single mkcert cert backup lives here too — keep it so local_tls/setup-all
    # needn't re-run. Everything else under the mount root is regenerable data.
    - name: Find persisted host-path data under kind_mount_root
      ansible.builtin.find:
        paths: "{{ kind_mount_root }}"
        file_type: any
        excludes: "caddy-cert-backup"
        recurse: false
      register: _persisted

    - name: Remove the persisted host-path data (keep caddy-cert-backup)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _persisted.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

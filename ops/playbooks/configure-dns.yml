---
# Reconcile Cloudflare DNS from the controller. Run with:
#   ansible-playbook -i inventories/<env>/hosts.yml playbooks/configure-dns.yml
- name: Reconcile Cloudflare DNS from the controller
  hosts: controller
  gather_facts: false
  pre_tasks:
    - name: Load the deployment config
      ansible.builtin.include_tasks: ../roles/common/tasks/load_deployment_config.yml
  roles:
    - role: dns_cloudflare
      when: manage_dns | default(true) | bool

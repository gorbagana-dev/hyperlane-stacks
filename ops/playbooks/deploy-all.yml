---
# Phase 2 — deploy stacks (assumes setup-all has run). Stops after stacks are
# running; on-chain ownership/ISM is sub-project 3. Each singleton play passes only
# stack_name; stack_deploy resolves spec/path/is_job from the `stacks` map in
# group_vars and assembles the secret env from `stack_env_vars`.
- name: Preflight — fleet is provisioned
  hosts: all:!controller
  gather_facts: false
  tasks:
    - name: A deploy_branch is required
      ansible.builtin.assert:
        that: deploy_branch is defined
        fail_msg: >-
          Pass -e deploy_branch=<branch> — the hosts fetch the repo on it and
          publish-bridge-state pushes to it.
      run_once: true

    - name: Verify laconic-so is present (else run setup-all first)
      ansible.builtin.command: laconic-so version
      changed_when: false

- name: MinIO
  hosts: minio_hosts
  gather_facts: true
  vars:
    stack_name: hyperlane-minio
    # Accumulated in pre_tasks under a private name, then handed to stack_deploy as a
    # play-scoped var. set_fact-ing `stack_env_extra` directly would persist it across
    # plays, leaking MinIO's IAM creds into every later stack's secret env.
    stack_env_extra: "{{ _minio_env_extra | default({}) }}"
  pre_tasks:
    - name: Load inventory secrets
      ansible.builtin.include_tasks: ../roles/common/tasks/load_secrets.yml
    - name: Derive validator labels + MINIO_USERS
      ansible.builtin.include_tasks: ../roles/common/tasks/load_validators.yml
    - name: Build MinIO env (MINIO_USERS + per-validator IAM)
      ansible.builtin.set_fact:
        _minio_env_extra: >-
          {{ _minio_env_extra | default({'MINIO_USERS': minio_users}) | combine({
             (item.label | upper | replace('-', '_') ~ '_KEY_ID'): minio_iam[item.label].key_id,
             (item.label | upper | replace('-', '_') ~ '_SECRET'): minio_iam[item.label].secret }) }}
      loop: "{{ validators }}"
      loop_control:
        label: "{{ item.label }}"
      no_log: true
  roles:
    - fetch_stack
    - stack_deploy

- name: Deployer (Job)
  hosts: deployer_hosts
  gather_facts: true
  pre_tasks:
    - name: Load inventory secrets
      ansible.builtin.include_tasks: ../roles/common/tasks/load_secrets.yml
  vars:
    stack_name: hyperlane-svm-deployer
  roles:
    - fetch_stack
    - stack_deploy

- name: Warp route deployer
  hosts: deployer_hosts
  gather_facts: true
  pre_tasks:
    - name: Load inventory secrets
      ansible.builtin.include_tasks: ../roles/common/tasks/load_secrets.yml
  roles:
    - fetch_stack
  tasks:
    - name: Deploy the warp routes selected by the spec's WARP_ROUTES
      ansible.builtin.include_role:
        name: stack_deploy
      vars:
        stack_name: hyperlane-warp-deployer
        spec_file: "{{ deployment_root }}/spec-warp-deployer.yml"
        stack_path: "{{ repo_root }}/{{ stacks['hyperlane-svm-warp-deployer'].path }}"
        stack_is_job: true
        stack_env_map_key: hyperlane-svm-warp-deployer
        stack_pre_start_tasks: "{{ playbook_dir }}/../roles/common/tasks/load_warp_routes.yml"

- name: Publish deployer + warp-deployer bridge state
  ansible.builtin.import_playbook: publish-bridge-state.yml

- name: Relayer
  hosts: relayer_hosts
  gather_facts: true
  pre_tasks:
    - name: Load inventory secrets
      ansible.builtin.include_tasks: ../roles/common/tasks/load_secrets.yml
  vars:
    stack_name: hyperlane-relayer
    spec_render_generated: true
    configmap_names: "{{ stacks['hyperlane-relayer'].configmaps }}"
    # state_distribute runs as the pre-start hook (after deploy create makes the dir,
    # before start mounts the configmaps) — running it as a pre-role would create
    # deploy_dir first and make `deploy create` fail "already exists". deploy_dir is
    # set here (play-scoped) so both the hook and stack_deploy resolve the same dir.
    deploy_dir: "{{ ansible_env.HOME }}/deployments/hyperlane-relayer"
    stack_pre_start_tasks: "{{ playbook_dir }}/../roles/state_distribute/tasks/main.yml"
  roles:
    - fetch_stack
    - stack_deploy

- name: Gas oracle
  hosts: gas_oracle_hosts
  gather_facts: true
  pre_tasks:
    - name: Load inventory secrets
      ansible.builtin.include_tasks: ../roles/common/tasks/load_secrets.yml
  vars:
    stack_name: hyperlane-gas-oracle
    spec_render_generated: true
  roles:
    - fetch_stack
    - stack_deploy

- name: Warp UI
  hosts: warp_ui_hosts
  gather_facts: true
  pre_tasks:
    - name: Load inventory secrets
      ansible.builtin.include_tasks: ../roles/common/tasks/load_secrets.yml
  vars:
    stack_name: hyperlane-warp-ui
    spec_render_generated: true
    configmap_names: "{{ stacks['hyperlane-warp-ui'].configmaps }}"
    # state_distribute runs as the pre-start hook (see the Relayer play for the rationale).
    deploy_dir: "{{ ansible_env.HOME }}/deployments/hyperlane-warp-ui"
    # Source only generated/warp-routes/ so the ConfigMap holds just warpRoutes.yaml.
    generated_subdir: warp-routes
    stack_pre_start_tasks: "{{ playbook_dir }}/../roles/state_distribute/tasks/main.yml"
  roles:
    - fetch_stack
    - stack_deploy

# Validators come from validators.yaml (not inventory), so loop + delegate per host.
- name: Validators
  hosts: controller
  gather_facts: false
  pre_tasks:
    - name: Load inventory secrets
      ansible.builtin.include_tasks: ../roles/common/tasks/load_secrets.yml
  tasks:
    - name: Load validators
      ansible.builtin.include_tasks: ../roles/common/tasks/load_validators.yml

    - name: Gather facts for each validator host (for ansible_env under delegation)
      ansible.builtin.setup:
      delegate_to: "{{ validator.host }}"
      delegate_facts: true
      loop: "{{ validators }}"
      loop_control:
        loop_var: validator
        label: "{{ validator.host }}"

    - name: Fetch the stack repo on each validator host
      ansible.builtin.include_role:
        name: fetch_stack
        apply:
          delegate_to: "{{ validator.host }}"
      vars:
        repo_base_dir: "{{ hostvars[validator.host].ansible_env.HOME }}/deployments"
      loop: "{{ validators }}"
      loop_control:
        loop_var: validator
        label: "{{ validator.label }}"

    # loop_var: validator (not the default `item`) — stack_deploy has its own `item`
    # loops, and these vars are lazily re-evaluated inside it; sharing `item` rebinds
    # it to a string and breaks `validator.label`.
    - name: Deploy each validator on its host
      ansible.builtin.include_role:
        name: stack_deploy
        apply:
          delegate_to: "{{ validator.host }}"
      vars:
        stack_name: "hyperlane-validator-{{ validator.label }}"
        repo_base_dir: "{{ hostvars[validator.host].ansible_env.HOME }}/deployments"
        repo_root: "{{ repo_base_dir }}/hyperlane-stacks"
        deployment_root: "{{ repo_root }}/{{ deployment_subdir }}"
        spec_file: "{{ deployment_root }}/spec-validator-{{ validator.chain }}.yml"
        stack_path: "{{ repo_root }}/{{ stacks['hyperlane-validator'].path }}"
        deploy_dir: "{{ repo_base_dir }}/hyperlane-validator-{{ validator.label }}"
        # state_distribute runs as the pre-start hook (after create, before start),
        # delegated to the validator's host since this play targets the controller.
        configmap_names: "{{ stacks['hyperlane-validator'].configmaps }}"
        stack_pre_start_tasks: "{{ playbook_dir }}/../roles/state_distribute/tasks/main.yml"
        stack_hook_delegate_to: "{{ validator.host }}"
        stack_env_map_key: hyperlane-validator
        stack_env_extra: >-
          {{ {(validator.label | upper | replace('-', '_') ~ '_KEY_ID'): minio_iam[validator.label].key_id,
              (validator.label | upper | replace('-', '_') ~ '_SECRET'): minio_iam[validator.label].secret} }}
        # The committed spec ships PRIVY_WALLET_ID: REPLACE_WITH_WALLET_ID; render this
        # validator's id (from validators.yaml) into it. HYP_VALIDATOR_ID derives from
        # PRIVY_WALLET_ID in the compose, so this one render covers both containers.
        spec_token_renders_extra:
          REPLACE_WITH_WALLET_ID: "{{ validator.privy_wallet_id }}"
      loop: "{{ validators }}"
      loop_control:
        loop_var: validator
        label: "{{ validator.label }}"

- name: Monitoring
  hosts: monitoring_hosts
  gather_facts: true
  pre_tasks:
    - name: Load inventory secrets
      ansible.builtin.include_tasks: ../roles/common/tasks/load_secrets.yml
  vars:
    stack_name: hyperlane-monitoring
  roles:
    - fetch_stack
    - stack_deploy

---
# Publish bridge state from the DEPLOYER HOST, where the artifacts already live.
# fetch_stack put the stack repo clone on this host (on deploy_branch); we copy the
# deployer's generated/ from its host-path volume into that clone, patch the
# deployment-derived config: keys into the committed specs, then commit + push over
# the forwarded SSH agent using the operator's git identity. No controller round-trip.
# Default: hands-off (auto commit + push). -e state_review=true to gate.
- name: Publish bridge state to git
  hosts: deployer_hosts
  gather_facts: true
  vars:
    state_review: false
    generated_rel: "bridges/{{ bridge_name }}/generated"
  roles:
    - fetch_stack            # ensure the clone exists + is current on deploy_branch
  tasks:
    - name: Read the operator git identity from the controller
      ansible.builtin.command: "git -C {{ playbook_dir }} config user.{{ item }}"  # noqa: command-instead-of-module
      delegate_to: localhost
      run_once: true
      changed_when: false
      register: _git_id
      loop:
        - name
        - email

    - name: Operator git identity must be set (committer for published state)
      ansible.builtin.assert:
        that:
          - _git_id.results[0].stdout | length > 0
          - _git_id.results[1].stdout | length > 0
        fail_msg: >-
          git user.name/user.email not configured on the controller; set them so
          the published commit has an author.

    - name: Copy the deployer's generated state into the on-host clone
      ansible.builtin.copy:
        src: "{{ kind_mount_root }}/bridge/generated/"
        dest: "{{ deployment_root }}/{{ generated_rel }}/"
        remote_src: true
        mode: "0644"
      when: not ansible_check_mode

    - name: Load deployer program-ids.json
      ansible.builtin.slurp:
        src: "{{ deployment_root }}/{{ generated_rel }}/program-ids.json"
      register: _pids_raw
      when: not ansible_check_mode

    - name: Parse program-ids.json
      ansible.builtin.set_fact:
        _pids: "{{ _pids_raw.content | b64decode | from_json }}"
      when: not ansible_check_mode

    - name: Stat the warp-deployer artifacts (present only after the warp Job)
      ansible.builtin.stat:
        path: "{{ deployment_root }}/{{ generated_rel }}/{{ item }}"
      register: _warp_stat
      loop:
        - token-config.json
        - warp-deploy-outputs/program-ids.json
      when: not ansible_check_mode

    - name: Read warp artifacts when present
      ansible.builtin.slurp:
        src: "{{ deployment_root }}/{{ generated_rel }}/{{ item }}"
      register: _warp_raw
      loop:
        - token-config.json
        - warp-deploy-outputs/program-ids.json
      when:
        - not ansible_check_mode
        - _warp_stat.results | selectattr('stat.exists') | list | length == 2

    - name: Derive warp-route values when the warp artifacts are present
      ansible.builtin.set_fact:
        _warp_collateral_addr: "{{ _wpids[_tcfg.warpRoute.collateral.chain].base58 }}"
        _warp_synthetic_addr: "{{ _wpids[_tcfg.warpRoute.synthetic.chain].base58 }}"
        _warp_token_mint: "{{ _tcfg.warpRoute.tokenMint }}"
        _warp_synthetic_mint: "{{ _tcfg.warpRoute.synthetic.mint }}"
      vars:
        _tcfg: "{{ _warp_raw.results[0].content | b64decode | from_json }}"
        _wpids: "{{ _warp_raw.results[1].content | b64decode | from_json }}"
      when:
        - not ansible_check_mode
        - _warp_stat.results | selectattr('stat.exists') | list | length == 2

    # Patch the scalar deployment-derived values into the committed specs. The rich
    # agent-config.json is distributed as a ConfigMap by state_distribute, not here.
    # Core values (IGP/mailbox) come from program-ids.json; warp-route addresses, the
    # collateral mint, and the synthetic mint come from the warp-deployer
    # (token-config.json + warp-deploy-outputs/program-ids.json).
    - name: Patch core deployment-derived config keys into committed specs
      ansible.builtin.replace:
        path: "{{ deployment_root }}/{{ item.spec }}"
        regexp: '^(\s*{{ item.key }}:\s*).*$'
        replace: '\g<1>"{{ item.value }}"'
      loop:
        - spec: spec-relayer.yml
          key: GORCHAIN_IGP_PROGRAM_ID
          value: "{{ (_pids | default({})).gorchain.igp_program_id | default('') }}"
        - spec: spec-relayer.yml
          key: SOLANA_IGP_PROGRAM_ID
          value: "{{ (_pids | default({})).solana.igp_program_id | default('') }}"
        - spec: spec-relayer.yml
          key: GORCHAIN_IGP_ACCOUNT
          value: "{{ (_pids | default({})).gorchain.igp_account | default('') }}"
        - spec: spec-relayer.yml
          key: SOLANA_IGP_ACCOUNT
          value: "{{ (_pids | default({})).solana.igp_account | default('') }}"
        - spec: spec-gas-oracle.yml
          key: GORCHAIN_IGP_PROGRAM_ID
          value: "{{ (_pids | default({})).gorchain.igp_program_id | default('') }}"
        - spec: spec-gas-oracle.yml
          key: SOLANA_IGP_PROGRAM_ID
          value: "{{ (_pids | default({})).solana.igp_program_id | default('') }}"
        - spec: spec-warp-ui.yml
          key: GORCHAIN_MAILBOX
          value: "{{ (_pids | default({})).gorchain.mailbox | default('') }}"
        - spec: spec-warp-ui.yml
          key: SOLANA_MAILBOX
          value: "{{ (_pids | default({})).solana.mailbox | default('') }}"
      loop_control:
        label: "{{ item.spec }}:{{ item.key }}"
      when: not ansible_check_mode

    - name: Patch warp-route values into spec-warp-ui.yml (after the warp Job)
      ansible.builtin.replace:
        path: "{{ deployment_root }}/spec-warp-ui.yml"
        regexp: '^(\s*{{ item.key }}:\s*).*$'
        replace: '\g<1>"{{ item.value }}"'
      loop:
        - key: WARP_COLLATERAL_ADDRESS
          value: "{{ _warp_collateral_addr | default('') }}"
        - key: WARP_SYNTHETIC_ADDRESS
          value: "{{ _warp_synthetic_addr | default('') }}"
        - key: WARP_TOKEN_MINT
          value: "{{ _warp_token_mint | default('') }}"
        - key: WARP_SYNTHETIC_MINT
          value: "{{ _warp_synthetic_mint | default('') }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - not ansible_check_mode
        - _warp_collateral_addr is defined

    - name: Stage the generated paths and patched specs (scoped)
      ansible.builtin.command:  # noqa: command-instead-of-module no module for scoped git add
        argv:
          - git
          - -C
          - "{{ repo_root }}"
          - add
          - "{{ deployment_root }}/{{ generated_rel }}"
          - "{{ deployment_root }}/spec-relayer.yml"
          - "{{ deployment_root }}/spec-gas-oracle.yml"
          - "{{ deployment_root }}/spec-warp-ui.yml"
      changed_when: true
      when: not ansible_check_mode

    - name: Check whether anything is staged
      ansible.builtin.command:  # noqa: command-instead-of-module no module for git diff --cached
        argv:
          - git
          - -C
          - "{{ repo_root }}"
          - diff
          - --cached
          - --quiet
      register: _staged
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Capture the staged diff
      ansible.builtin.command:  # noqa: command-instead-of-module no module for git diff --cached
        argv:
          - git
          - -C
          - "{{ repo_root }}"
          - diff
          - --cached
      register: _diff
      changed_when: false
      when:
        - not ansible_check_mode
        - _staged.rc | default(0) != 0

    - name: Display the staged diff
      ansible.builtin.debug:
        var: _diff.stdout_lines
      when:
        - not ansible_check_mode
        - _staged.rc | default(0) != 0

    - name: Review gate (only when state_review=true)
      ansible.builtin.pause:
        prompt: "Press enter to commit + push the above, or Ctrl-C to abort"
      when:
        - not ansible_check_mode
        - _staged.rc | default(0) != 0
        - state_review | bool

    - name: Commit the staged state (operator identity)
      ansible.builtin.command:  # noqa: command-instead-of-module no module for scoped git commit
        argv:
          - git
          - -C
          - "{{ repo_root }}"
          - -c
          - "user.name={{ _git_id.results[0].stdout }}"
          - -c
          - "user.email={{ _git_id.results[1].stdout }}"
          - commit
          - -m
          - "chore: publish bridge state"
      changed_when: true
      when:
        - not ansible_check_mode
        - _staged.rc | default(0) != 0

    - name: Push to deploy_branch (via forwarded agent)
      ansible.builtin.command:  # noqa: command-instead-of-module no module for git push
        argv:
          - git
          - -C
          - "{{ repo_root }}"
          - push
          - origin
          - "HEAD:{{ deploy_branch }}"
      environment:
        GIT_SSH_COMMAND: "ssh -o ForwardAgent=yes"
      changed_when: true
      when:
        - not ansible_check_mode
        - _staged.rc | default(0) != 0

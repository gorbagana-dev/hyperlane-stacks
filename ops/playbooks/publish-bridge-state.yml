---
# Publish bridge state from the DEPLOYER HOST, where the artifacts already live.
# fetch_stack put the stack repo clone on this host (on deploy_branch); we copy the
# deployer's generated/ from its host-path volume into that clone, patch the
# deployment-derived config: keys into the committed specs, then commit + push over
# the forwarded SSH agent using the operator's git identity. No controller round-trip.
# Default: hands-off (auto commit + push). -e state_review=true to gate.
- name: Publish bridge state to git
  hosts: deployer_hosts
  gather_facts: true
  vars:
    state_review: false
    generated_rel: "bridges/{{ bridge_name }}/generated"
  roles:
    - fetch_stack            # ensure the clone exists + is current on deploy_branch
  tasks:
    - name: Read the operator git identity from the controller
      ansible.builtin.command: "git -C {{ playbook_dir }} config user.{{ item }}"  # noqa: command-instead-of-module
      delegate_to: localhost
      run_once: true
      changed_when: false
      register: _git_id
      loop:
        - name
        - email

    - name: Operator git identity must be set (committer for published state)
      ansible.builtin.assert:
        that:
          - _git_id.results[0].stdout | length > 0
          - _git_id.results[1].stdout | length > 0
        fail_msg: >-
          git user.name/user.email not configured on the controller; set them so
          the published commit has an author.

    # Symbolic mode (capital X = dir-only execute): a numeric 0644 on a recursive
    # copy strips the execute bit off the subdirs too, so the deploy user can't
    # traverse generated/ to read program-ids.json.
    - name: Copy the deployer's generated state into the on-host clone
      ansible.builtin.copy:
        src: "{{ kind_mount_root }}/bridge/generated/"
        dest: "{{ deployment_root }}/{{ generated_rel }}/"
        remote_src: true
        mode: "u=rwX,go=rX"
      when: not ansible_check_mode

    - name: Load deployer program-ids.json
      ansible.builtin.slurp:
        src: "{{ deployment_root }}/{{ generated_rel }}/program-ids.json"
      register: _pids_raw
      when: not ansible_check_mode

    - name: Parse program-ids.json
      ansible.builtin.set_fact:
        _pids: "{{ _pids_raw.content | b64decode | from_json }}"
      when: not ansible_check_mode

    # The warp-UI needs a WarpCoreConfig (warpRoutes.yaml) covering ALL routes in
    # the spec's WARP_ROUTES. Each route's per-route state lives under
    # warp-routes/<name>/, where <name> comes from that route's menu file.
    - name: Read the warp-deployer spec (for WARP_ROUTES)
      ansible.builtin.slurp:
        src: "{{ deployment_root }}/spec-warp-deployer.yml"
      register: _warp_spec_raw
      when: not ansible_check_mode

    - name: Resolve all warp-route stems from WARP_ROUTES
      ansible.builtin.set_fact:
        _warp_stems: >-
          {{ ((_warp_spec_raw.content | b64decode | from_yaml).config.WARP_ROUTES
              | replace(',', ' ') | split) }}
      when: not ansible_check_mode

    - name: Slurp each route's menu file
      ansible.builtin.slurp:
        src: "{{ deployment_root }}/bridges/{{ bridge_name }}/warp-routes/{{ item }}.yml"
      register: _menus_raw
      loop: "{{ _warp_stems | default([]) }}"
      when: not ansible_check_mode

    - name: Build route items list (stem + route name)
      ansible.builtin.set_fact:
        _route_items: >-
          {{ _route_items | default([]) + [
               {'stem': _warp_stems[item | int],
                'name': (_menus_raw.results[item | int].content | b64decode | from_yaml).name}
             ] }}
      loop: "{{ range(_warp_stems | default([]) | length) | list }}"
      when: not ansible_check_mode

    - name: Slurp token-config.json for each route
      ansible.builtin.slurp:
        src: "{{ deployment_root }}/{{ generated_rel }}/warp-routes/{{ item.name }}/token-config.json"
      register: _tcfgs_raw
      loop: "{{ _route_items | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: not ansible_check_mode

    - name: Slurp warp-deploy-outputs/program-ids.json for each route
      ansible.builtin.slurp:
        src: "{{ deployment_root }}/{{ generated_rel }}/warp-routes/{{ item.name }}/warp-deploy-outputs/program-ids.json"
      register: _wpids_raw
      loop: "{{ _route_items | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: not ansible_check_mode

    # Build a per-chain mailbox lookup from the deployer program-ids (same source
    # the existing code uses for GORCHAIN_MAILBOX / SOLANA_MAILBOX).
    - name: Build chain mailbox lookup
      ansible.builtin.set_fact:
        _mailboxes: "{{ {'gorchain': (_pids | default({})).gorchain.mailbox | default(''),
                         'solana':   (_pids | default({})).solana.mailbox   | default('') } }}"
      when: not ansible_check_mode

    # token-config.json is chain-keyed (warpRoute.<chain> with type inside).
    # For each route, emit two token entries (one per chain side). The type→standard
    # mapping and collateralAddressOrDenom field follow the side's declared type:
    #   collateral → SealevelHypCollateral + collateralAddressOrDenom = side.token
    #   synthetic  → SealevelHypSynthetic  + collateralAddressOrDenom = side.mint
    #   native     → SealevelHypNative     (no collateralAddressOrDenom)
    - name: Accumulate warp token entries for all routes
      ansible.builtin.set_fact:
        _warp_tokens: >-
          {{ _warp_tokens | default([]) + [
               _entry_a | combine(
                 ({'collateralAddressOrDenom': _side_a.value.token}
                   if _side_a.value.type == 'collateral' else
                  {'collateralAddressOrDenom': _side_a.value.mint}
                   if _side_a.value.type == 'synthetic' else {})
               ),
               _entry_b | combine(
                 ({'collateralAddressOrDenom': _side_b.value.token}
                   if _side_b.value.type == 'collateral' else
                  {'collateralAddressOrDenom': _side_b.value.mint}
                   if _side_b.value.type == 'synthetic' else {})
               )
             ] }}
      vars:
        _type_to_standard:
          collateral: SealevelHypCollateral
          synthetic: SealevelHypSynthetic
          native: SealevelHypNative
        _tcfg: "{{ _tcfgs_raw.results[item | int].content | b64decode | from_json }}"
        _wpids: "{{ _wpids_raw.results[item | int].content | b64decode | from_json }}"
        _sides: "{{ _tcfg.warpRoute | dict2items | rejectattr('key', 'equalto', 'name') | list }}"
        _side_a: "{{ _sides[0] }}"
        _side_b: "{{ _sides[1] }}"
        _route_name: "{{ _route_items[item | int].name }}"
        _entry_a:
          chainName: "{{ _side_a.key }}"
          standard: "{{ _type_to_standard[_side_a.value.type] }}"
          name: "{{ _route_name }}"
          symbol: "{{ _side_a.value.symbol | default(_route_name) }}"
          decimals: "{{ _side_a.value.decimals | default(9) }}"
          addressOrDenom: "{{ _wpids[_side_a.key].base58 }}"
          mailbox: "{{ _mailboxes[_side_a.key] | default('') }}"
          connections:
            - token: "sealevel|{{ _side_b.key }}|{{ _wpids[_side_b.key].base58 }}"
        _entry_b:
          chainName: "{{ _side_b.key }}"
          standard: "{{ _type_to_standard[_side_b.value.type] }}"
          name: "{{ _route_name }}"
          symbol: "{{ _side_b.value.symbol | default(_route_name) }}"
          decimals: "{{ _side_b.value.decimals | default(9) }}"
          addressOrDenom: "{{ _wpids[_side_b.key].base58 }}"
          mailbox: "{{ _mailboxes[_side_b.key] | default('') }}"
          connections:
            - token: "sealevel|{{ _side_a.key }}|{{ _wpids[_side_a.key].base58 }}"
      loop: "{{ range(_route_items | default([]) | length) | list }}"
      when: not ansible_check_mode

    - name: Ensure warp-ui-config generated dir exists
      ansible.builtin.file:
        path: "{{ deployment_root }}/{{ generated_rel }}/warp-ui-config"
        state: directory
        mode: "0755"
      when: not ansible_check_mode

    - name: Write warpRoutes.yaml into the generated state
      ansible.builtin.copy:
        content: "{{ {'tokens': _warp_tokens | default([]), 'options': {}} | to_nice_yaml }}"
        dest: "{{ deployment_root }}/{{ generated_rel }}/warp-ui-config/warpRoutes.yaml"
        mode: "0644"
      when: not ansible_check_mode

    # Patch the scalar deployment-derived values into the committed specs. The rich
    # agent-config.json is distributed as a ConfigMap by state_distribute, not here.
    # Core values (IGP/mailbox) come from program-ids.json.
    - name: Patch core deployment-derived config keys into committed specs
      ansible.builtin.replace:
        path: "{{ deployment_root }}/{{ item.spec }}"
        regexp: '^(\s*{{ item.key }}:\s*).*$'
        replace: '\g<1>"{{ item.value }}"'
      loop:
        - spec: spec-relayer.yml
          key: GORCHAIN_IGP_PROGRAM_ID
          value: "{{ (_pids | default({})).gorchain.igp_program_id | default('') }}"
        - spec: spec-relayer.yml
          key: SOLANA_IGP_PROGRAM_ID
          value: "{{ (_pids | default({})).solana.igp_program_id | default('') }}"
        - spec: spec-relayer.yml
          key: GORCHAIN_IGP_ACCOUNT
          value: "{{ (_pids | default({})).gorchain.igp_account | default('') }}"
        - spec: spec-relayer.yml
          key: SOLANA_IGP_ACCOUNT
          value: "{{ (_pids | default({})).solana.igp_account | default('') }}"
        - spec: spec-gas-oracle.yml
          key: GORCHAIN_IGP_PROGRAM_ID
          value: "{{ (_pids | default({})).gorchain.igp_program_id | default('') }}"
        - spec: spec-gas-oracle.yml
          key: SOLANA_IGP_PROGRAM_ID
          value: "{{ (_pids | default({})).solana.igp_program_id | default('') }}"
        - spec: spec-warp-ui.yml
          key: GORCHAIN_MAILBOX
          value: "{{ (_pids | default({})).gorchain.mailbox | default('') }}"
        - spec: spec-warp-ui.yml
          key: SOLANA_MAILBOX
          value: "{{ (_pids | default({})).solana.mailbox | default('') }}"
      loop_control:
        label: "{{ item.spec }}:{{ item.key }}"
      when: not ansible_check_mode

    - name: Stage the generated paths and patched specs (scoped)
      ansible.builtin.command:  # noqa: command-instead-of-module no module for scoped git add
        argv:
          - git
          - -C
          - "{{ repo_root }}"
          - add
          - "{{ deployment_root }}/{{ generated_rel }}"
          - "{{ deployment_root }}/spec-relayer.yml"
          - "{{ deployment_root }}/spec-gas-oracle.yml"
          - "{{ deployment_root }}/spec-warp-ui.yml"
      changed_when: true
      when: not ansible_check_mode

    - name: Check whether anything is staged
      ansible.builtin.command:  # noqa: command-instead-of-module no module for git diff --cached
        argv:
          - git
          - -C
          - "{{ repo_root }}"
          - diff
          - --cached
          - --quiet
      register: _staged
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Capture the staged diff
      ansible.builtin.command:  # noqa: command-instead-of-module no module for git diff --cached
        argv:
          - git
          - -C
          - "{{ repo_root }}"
          - diff
          - --cached
      register: _diff
      changed_when: false
      when:
        - not ansible_check_mode
        - _staged.rc | default(0) != 0

    - name: Display the staged diff
      ansible.builtin.debug:
        var: _diff.stdout_lines
      when:
        - not ansible_check_mode
        - _staged.rc | default(0) != 0

    - name: Review gate (only when state_review=true)
      ansible.builtin.pause:
        prompt: "Press enter to commit + push the above, or Ctrl-C to abort"
      when:
        - not ansible_check_mode
        - _staged.rc | default(0) != 0
        - state_review | bool

    - name: Commit the staged state (operator identity)
      ansible.builtin.command:  # noqa: command-instead-of-module no module for scoped git commit
        argv:
          - git
          - -C
          - "{{ repo_root }}"
          - -c
          - "user.name={{ _git_id.results[0].stdout }}"
          - -c
          - "user.email={{ _git_id.results[1].stdout }}"
          - commit
          - -m
          - "chore: publish bridge state"
      changed_when: true
      when:
        - not ansible_check_mode
        - _staged.rc | default(0) != 0

    - name: Push to deploy_branch (via forwarded agent)
      ansible.builtin.command:  # noqa: command-instead-of-module no module for git push
        argv:
          - git
          - -C
          - "{{ repo_root }}"
          - push
          - origin
          - "HEAD:{{ deploy_branch }}"
      environment:
        GIT_SSH_COMMAND: "ssh -o ForwardAgent=yes"
      changed_when: true
      when:
        - not ansible_check_mode
        - _staged.rc | default(0) != 0

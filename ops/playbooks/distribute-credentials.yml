---
# Generate (idempotent) + distribute credentials from the controller. Run with:
#   ansible-playbook -i inventories/<env>/hosts.yml playbooks/distribute-credentials.yml
- name: Generate + distribute credentials
  hosts: controller
  gather_facts: false
  pre_tasks:
    - name: Load the deployment config
      ansible.builtin.include_tasks: ../roles/common/tasks/load_deployment_config.yml
  roles:
    - credentials

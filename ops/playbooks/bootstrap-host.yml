---
# Two plays: privileged host setup, then unprivileged deploy_user setup.
# Target a host/group with: -e target=<host-or-group>  (default: all)
#
# The privileged play overrides the connection via `vars: ansible_user`, NOT
# `remote_user:` — an inventory/group `ansible_user` outranks the `remote_user`
# keyword, so `remote_user` would be silently ignored when the two users differ.
# The unprivileged play needs no override: it connects as the default ansible_user
# (= deploy_user).
- name: Privileged host prerequisites
  hosts: "{{ target | default('all:!controller') }}"
  become: true
  vars:
    ansible_user: "{{ privileged_user }}"
  roles:
    - prerequisites_privileged
  post_tasks:
    # The role added deploy_user to the docker group; drop the multiplexed SSH
    # session (ControlPersist) so later plays get a fresh login that carries the
    # new group instead of a pre-group session within the persist window.
    - name: Reset the SSH connection to pick up the docker group
      ansible.builtin.meta: reset_connection

- name: Unprivileged deploy_user prerequisites
  hosts: "{{ target | default('all:!controller') }}"
  roles:
    - prerequisites_user

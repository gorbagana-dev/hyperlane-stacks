---
- name: Inventory structure assertions
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    expected_groups:
      - controller
      - deployer_hosts
      - minio_hosts
      - relayer_hosts
      - gas_oracle_hosts
      - monitoring_hosts
      - warp_ui_hosts
  tasks:
    - name: Every singleton group is defined
      ansible.builtin.assert:
        that: "item in groups"
        fail_msg: "Inventory group '{{ item }}' missing"
      loop: "{{ expected_groups }}"

    - name: Stack_env_vars map covers every deployable stack
      ansible.builtin.assert:
        that: "item in stack_env_vars"
        fail_msg: "stack_env_vars missing key '{{ item }}'"
      loop:
        - hyperlane-minio
        - hyperlane-svm-deployer
        - hyperlane-relayer
        - hyperlane-gas-oracle
        - hyperlane-monitoring
        - hyperlane-warp-ui
        - hyperlane-validator

    - name: Deploy hosts connect as the deploy_user; controller has neither var
      vars:
        deploy_host: "{{ groups['deployer_hosts'][0] }}"
      ansible.builtin.assert:
        that:
          - "hostvars[deploy_host].ansible_user == hostvars[deploy_host].deploy_user"
          - "'deploy_user' not in hostvars['localhost']"
        fail_msg: >-
          Connection identity broken: ansible_user must derive from deploy_user on
          deploy hosts and stay unset on the controller.

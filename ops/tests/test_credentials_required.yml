---
- name: Missing required external secret fails fast
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    deployment_config_file: "/tmp/ops-test-secrets-req.yml"
    validators_file: "{{ playbook_dir }}/fixtures/validators.yaml"
    distribute_only_assert: true
  tasks:
    - name: Secrets missing cloudflare_api_token
      ansible.builtin.copy:
        content: "privy_app_id: x\nprivy_app_secret: y\n"
        dest: "{{ deployment_config_file }}"
        mode: "0600"

    - name: Expect assertion failure
      block:
        - name: Run distribute (should fail on missing token)
          ansible.builtin.include_role:
            name: credentials
            tasks_from: distribute
        - name: Mark not-failed (should not reach here)
          ansible.builtin.set_fact:
            req_failed: false
      rescue:
        - name: Mark failed as expected
          ansible.builtin.set_fact:
            req_failed: true

    - name: Assert the role failed fast
      ansible.builtin.assert:
        that: "req_failed | bool"
        fail_msg: "distribute did not fail on missing cloudflare_api_token"

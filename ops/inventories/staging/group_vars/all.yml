---
# --- Environment wiring ---
# Each deploy host fetches the stack repo itself (laconic-so fetch-stack), so
# repo_root/deployment_root resolve against the ON-HOST clone, not the operator's
# checkout — laconic-so deploy create runs on the host and reads them there.
bridge_name: default
stack_repo_locator: github.com/gorbagana-dev/hyperlane-stacks
# Branch the hosts fetch and publish-bridge-state pushes to: -e deploy_branch=<branch>
repo_base_dir: "{{ ansible_env.HOME }}/deployments"
repo_root: "{{ repo_base_dir }}/hyperlane-stacks"
deployment_subdir: deployment/staging               # staging specs live in deployment/staging/
deployment_root: "{{ repo_root }}/{{ deployment_subdir }}"

# --- Connection identity ---
# Ansible connects as the deploy_user for every play except the privileged bootstrap
# prep, which overrides ansible_user to privileged_user in bootstrap-host.yml.
ansible_user: "{{ deploy_user | default(lookup('env', 'USER')) }}"

# --- Topology / DNS mode ---
# 'single' is the local-only mkcert/no-DNS mode. Staging is always Cloudflare DNS
# + Let's Encrypt, whatever the host count — so 'multi', stated explicitly (the
# env contract rejects inventories that leave these to role defaults).
topology: multi
manage_dns: true
# SSH by public_ip from host_vars (aliases like staging-gorchain are not DNS names).
# Defaults match no-ansible_host behavior; NOT default(omit) — omit only works for
# module arguments, anywhere else the sentinel leaks (e.g. as a literal hostname).
ansible_host: "{{ public_ip | default(inventory_hostname) }}"

# --- laconic-so install (prerequisites_user) ---
laconic_so_version: "v1.1.0-3c6d2f7-202606100934"
laconic_so_release_base_url: "https://github.com/cerc-io/stack-orchestrator/releases/download"

# --- Credentials dir ---
# Host dir holding operator-placed keyfiles. MUST match the `file:` paths in the
# deployment/staging/spec-*.yml secrets blocks (read by laconic-so, not ansible).
credentials_dir: "{{ ansible_env.HOME }}/.credentials/hyperlane"

# --- DNS ---
# Hostname suffix for every staging endpoint (specs + DNS records). Changing the
# zone is mechanical: edit this + the hostname literals in deployment/staging/
# spec-*.yml, then re-run configure-dns.yml.
base_domain: staging.gorbagana.wtf
cloudflare_zone: gorbagana.wtf      # the registered CF zone; base_domain nests under it
# Gorchain RPC for ops tooling (funding/drain checks). The spec carries its own GORCHAIN_RPC_URL literal.
gorchain_rpc_url: "https://rpc.staging.gorbagana.wtf"
dns_record_ttl: 300
dns_records:
  - name: s3
    host: staging-bridge-ops
  - name: minio-console
    host: staging-bridge-ops
  - name: grafana
    host: staging-bridge-ops
  - name: prometheus
    host: staging-bridge-ops
  # warp-ui — served at base_domain itself (staging.gorbagana.wtf)
  - name: "@"
    host: staging-bridge-ops
  - name: relayer
    host: staging-bridge-ops
  # gorchain RPC — Caddy TLS front on the chain host (prepare-gorchain.yml)
  - name: rpc
    host: staging-gorchain

# Deploy-time spec renders (render_spec.yml): operator values substituted into the
# on-host spec copy — the committed spec keeps the sentinel.
spec_token_renders:
  # from deployment-config.yml ("" disables WalletConnect)
  REPLACE_WITH_WALLETCONNECT_PROJECT_ID: "{{ wallet_connect_id }}"
  # Gas-oracle loop interval (ms); operator override, default 15 min.
  __GAS_ORACLE_INTERVAL_MS__: "{{ gas_oracle_interval_ms | default('900000') }}"
  # IGP fee-claim interval (seconds); operator override, default 6 h.
  __CLAIM_INTERVAL_SECONDS__: "{{ fee_claim_interval_seconds | default('21600') }}"

# --- Secret-env values ---
# See the prod group_vars for the full rationale. Staging differences: Solana uses
# the Helius DEVNET endpoint; chain RPC/domain IDs (Solana devnet 1399811151,
# *_IS_TESTNET=true) are committed literals in deployment/staging/spec-*.yml.
SOLANA_RPC_URL: "https://devnet.helius-rpc.com/?api-key={{ helius_api_key }}"
BRIDGE_OWNER_PUBKEY: "{{ bridge_owner_pubkey }}"
IGP_ORACLE_PUBKEY: "{{ igp_oracle_pubkey }}"
IGP_BENEFICIARY_PUBKEY: "{{ igp_beneficiary_pubkey | default('') }}"
GORCHAIN_VALIDATOR_ADDRESS: "{{ gorchain_validator_address }}"
SOLANA_VALIDATOR_ADDRESS: "{{ solana_validator_address }}"
PRIVY_APP_ID: "{{ privy_app_id }}"
PRIVY_APP_SECRET: "{{ privy_app_secret }}"
PRIVY_ORACLE_WALLET_ID: "{{ privy_oracle_wallet_id }}"
GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
SLACK_WEBHOOK_URL: "{{ slack_webhook_url | default('') }}"
GHCR_PAT: "{{ ghcr_pat }}"
MINIO_ROOT_USER: "{{ minio_root_user }}"
MINIO_ROOT_PASSWORD: "{{ minio_root_password }}"
POSTGRES_PASSWORD: "{{ explorer_db_password }}"
HASURA_GRAPHQL_ADMIN_SECRET: "{{ explorer_hasura_admin_secret }}"

# --- Per-stack secret env-var map (see prod group_vars for the contract) ---
stack_env_vars:
  hyperlane-minio:
    - MINIO_ROOT_USER
    - MINIO_ROOT_PASSWORD
  hyperlane-svm-deployer:
    - BRIDGE_OWNER_PUBKEY
    - IGP_ORACLE_PUBKEY
    - IGP_BENEFICIARY_PUBKEY
    - GORCHAIN_VALIDATOR_ADDRESS
    - SOLANA_VALIDATOR_ADDRESS
    - SOLANA_RPC_URL
    - GHCR_PAT
  hyperlane-svm-warp-deployer:
    - BRIDGE_OWNER_PUBKEY
    - SOLANA_RPC_URL
    - GHCR_PAT
  hyperlane-relayer:
    - SOLANA_RPC_URL
    - GHCR_PAT
  hyperlane-gas-oracle:
    - PRIVY_APP_ID
    - PRIVY_APP_SECRET
    - PRIVY_ORACLE_WALLET_ID
    - SOLANA_RPC_URL
    - GHCR_PAT
  hyperlane-monitoring:
    - GF_SECURITY_ADMIN_PASSWORD
    - SOLANA_RPC_URL
    - SLACK_WEBHOOK_URL
  hyperlane-warp-ui:
    - SOLANA_RPC_URL
    - GHCR_PAT
  hyperlane-validator:
    - PRIVY_APP_ID
    - PRIVY_APP_SECRET
    - SOLANA_RPC_URL
    - GHCR_PAT
  hyperlane-explorer:
    - SOLANA_RPC_URL
    - POSTGRES_PASSWORD
    - HASURA_GRAPHQL_ADMIN_SECRET
    - GHCR_PAT

# --- Per-stack static metadata (see prod group_vars for the contract) ---
stacks:
  hyperlane-minio:
    spec: spec-minio.yml
    path: stack_orchestrator/data/stacks/hyperlane-minio
  hyperlane-svm-deployer:
    spec: spec-deployer.yml
    path: stack_orchestrator/data/stacks/hyperlane-svm-deployer
    is_job: true
  hyperlane-svm-warp-deployer:
    path: stack_orchestrator/data/stacks/hyperlane-svm-warp-deployer
    is_job: true
  hyperlane-relayer:
    spec: spec-relayer.yml
    path: stack_orchestrator/data/stacks/hyperlane-relayer
    configmaps:
      - agent-config
  hyperlane-gas-oracle:
    spec: spec-gas-oracle.yml
    path: stack_orchestrator/data/stacks/hyperlane-gas-oracle
  hyperlane-monitoring:
    spec: spec-monitoring.yml
    path: stack_orchestrator/data/stacks/hyperlane-monitoring
  hyperlane-warp-ui:
    spec: spec-warp-ui.yml
    path: stack_orchestrator/data/stacks/hyperlane-warp-ui
    configmaps:
      - warp-ui-config
  hyperlane-validator:
    path: stack_orchestrator/data/stacks/hyperlane-validator
    configmaps:
      - agent-config
  hyperlane-explorer:
    spec: spec-explorer.yml
    path: stack_orchestrator/data/stacks/hyperlane-explorer
    configmaps:
      - agent-config

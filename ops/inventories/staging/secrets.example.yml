---
# Copy to secrets.yml (gitignored) and fill in. Operator-supplied secrets that
# cannot be generated. Generated secrets (MinIO root/IAM, Grafana admin password)
# are written here automatically by the `credentials` role and need not be set.

# --- Operator-supplied (REQUIRED) ---
cloudflare_api_token: ""        # scoped to dns_zone records
privy_app_id: ""
privy_app_secret: ""
privy_oracle_wallet_id: ""      # Privy server-wallet id for the gas oracle
helius_api_key: ""              # Helius RPC API key — builds SOLANA_RPC_URL
ghcr_pat: ""                    # GitHub PAT (packages:read) for private GHCR images

# --- Generated by `credentials` role (leave unset on first run) ---
# minio_root_user: ""
# minio_root_password: ""
# minio_iam: {}                 # { "<label>": { key_id, secret } }
# grafana_admin_password: ""

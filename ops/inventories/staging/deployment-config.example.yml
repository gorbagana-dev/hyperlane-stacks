---
# Copy to deployment-config.yml (gitignored) and fill in. This is the ONE file an
# operator edits: secrets + bridge identity. The plays read it directly at runtime —
# nothing else to fill except host connectivity (host_vars/<host>.yml).
# setup-all fails fast naming any missing value.

# --- Secrets (sensitive) ---
cloudflare_api_token: ""        # zone-scoped: DNS edit on cloudflare_zone
privy_app_id: ""                # the STAGING Privy app (runbooks/privy-wallets.md)
privy_app_secret: ""
privy_oracle_wallet_id: ""      # gas-oracle wallet `id` (oracle.json)
privy_bridge_owner_wallet_id: "" # bridge-owner wallet `id` (owner.json) — upgrade authority; signs program close on decommission (decommission.yml)
helius_api_key: ""              # Helius DEVNET API key — builds SOLANA_RPC_URL
ghcr_pat: ""                    # GitHub PAT (packages:read) for private GHCR images
slack_webhook_url: ""           # Slack incoming-webhook URL; empty disables balance alerts

# --- Bridge identity (not sensitive — env-specific values from your Privy
#     wallets; runbooks/privy-wallets.md Step 4 maps each output here) ---
bridge_owner_pubkey: ""          # owner.json `address` (base58) — receives all ownership
igp_oracle_pubkey: ""            # oracle.json `address` (base58)
igp_beneficiary_pubkey: ""       # optional — defaults to bridge_owner_pubkey
gorchain_validator_address: ""   # val-gorchain.json `address` (0x…)
solana_validator_address: ""     # val-solana.json `address` (0x…)
# Each validator wallet's `id` from privy-wallets.md Step 3, keyed by its
# validators.yaml label:
privy_validator_wallet_ids:
  gorchain-primary: ""           # val-gorchain.json `id`
  solana-primary: ""             # val-solana.json `id`

# --- Warp UI ---
# WalletConnect project id (from cloud.reown.com). Must be non-empty — the UI
# refuses an empty id; a dummy value works (Backpack and other injected wallets
# don't use it).
wallet_connect_id: ""

# --- Balance monitoring (optional; defaults shown) ---
# Auto-watched signers: relayer (both chains), fee-claim, igp-oracle, validators.
# Add extra/SPL watches post-deploy by editing the generated watches.json on the
# monitoring host and `laconic-so deployment <dir> restart` (see runbooks).
balance_monitor:
  # Alert when a signer's native balance drops below its floor. Operational signers
  # are funded ~1 each and burn little (see runbooks/funding-estimate.md), so floors
  # sit below 1 — warn ahead of a top-up without firing on a freshly-funded bridge.
  default_threshold: 0.1        # any signer without a role entry
  thresholds:
    relayer: 0.5                # active spender + critical path (delivery halts if dry)
    fee-claim: 0.2              # periodic claim txs only
    igp-oracle: 0.2             # periodic gas-oracle posts only
    # validator keys are not watched — drained by retire-keys after the one-time announce

# --- Tuning (optional; defaults shown) ---
# gas_oracle_interval_ms: "900000"     # gas-oracle price-update loop interval (15 min)
# fee_claim_interval_seconds: "21600"  # IGP fee-claim loop interval (6 h)

# --- Generated by `credentials` role (leave unset on first run) ---
# minio_root_user: ""
# minio_root_password: ""
# minio_iam: {}                 # { "<label>": { key_id, secret } }
# grafana_admin_password: ""
# explorer_db_password: ""
# explorer_hasura_admin_secret: ""

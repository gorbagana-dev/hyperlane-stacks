---
# --- Environment wiring ---
# Each deploy host fetches the stack repo itself (laconic-so fetch-stack), so
# repo_root/deployment_root resolve against the ON-HOST clone, not the operator's
# checkout — laconic-so deploy create runs on the host and reads them there.
bridge_name: default
stack_repo_locator: github.com/gorbagana-dev/hyperlane-stacks
# Branch the hosts fetch and publish-bridge-state pushes to. Override to test off
# main: -e deploy_branch=<branch>
deploy_branch: main
repo_base_dir: "{{ ansible_env.HOME }}/deployments"
repo_root: "{{ repo_base_dir }}/hyperlane-stacks"
deployment_subdir: deployment                       # prod specs live in deployment/
deployment_root: "{{ repo_root }}/{{ deployment_subdir }}"

# --- Connection identity ---
# Ansible connects as the deploy_user for every play except the privileged bootstrap
# prep, which overrides ansible_user to privileged_user in bootstrap-host.yml.
ansible_user: "{{ deploy_user | default(lookup('env', 'USER')) }}"

# --- Topology / DNS mode ---
# Single-host by default (all bridge services co-located); add a separate
# relayer/minio host to flip to multi. Unlike local, prod's topology switches ONLY
# the MinIO endpoint — chains are external mainnet/Helius and DNS is always real.
topology: "{{ 'single' if (groups['minio_hosts'][0] == groups['relayer_hosts'][0]) else 'multi' }}"
manage_dns: true
# SSH by public_ip from host_vars (aliases like bridge-host-1 are not DNS names).
# Defaults match no-ansible_host behavior; NOT default(omit) — omit only works for
# module arguments, anywhere else the sentinel leaks (e.g. as a literal hostname).
ansible_host: "{{ public_ip | default(inventory_hostname) }}"

# --- laconic-so install (prerequisites_user) ---
laconic_so_version: "v1.1.0-3c6d2f7-202606100934"
laconic_so_release_base_url: "https://github.com/cerc-io/stack-orchestrator/releases/download"

# --- Credentials dir ---
# Host dir holding operator-placed keyfiles. MUST match the `file:` paths in the
# deployment/spec-*.yml secrets blocks (those are read by laconic-so, not ansible).
credentials_dir: "{{ ansible_env.HOME }}/.credentials/hyperlane"

# --- DNS ---
base_domain: bridge.gorbagana.wtf
cloudflare_zone: gorbagana.wtf      # the registered CF zone; base_domain nests under it
# Gorchain RPC for ops tooling (funding/drain checks). The spec carries its own GORCHAIN_RPC_URL literal.
gorchain_rpc_url: "https://rpc.gorbagana.wtf"
dns_record_ttl: 300
dns_records:
  - name: s3
    host: bridge-host-1
  - name: minio-console
    host: bridge-host-1
  - name: grafana
    host: bridge-host-1
  - name: prometheus
    host: bridge-host-1
  # warp-ui — served at base_domain itself (bridge.gorbagana.wtf)
  - name: "@"
    host: bridge-host-1
  - name: relayer
    host: bridge-host-1

# Deploy-time spec renders (render_spec.yml): operator values substituted into the
# on-host spec copy — the committed spec keeps the sentinel.
spec_token_renders:
  # from deployment-config.yml ("" disables WalletConnect)
  REPLACE_WITH_WALLETCONNECT_PROJECT_ID: "{{ wallet_connect_id }}"
  # Gas-oracle loop interval (ms); operator override, default 15 min.
  __GAS_ORACLE_INTERVAL_MS__: "{{ gas_oracle_interval_ms | default('900000') }}"
  # IGP fee-claim interval (seconds); operator override, default 6 h.
  __CLAIM_INTERVAL_SECONDS__: "{{ fee_claim_interval_seconds | default('21600') }}"
  # single-host reaches MinIO in-cluster (no Caddy hairpin / 308); multi uses the
  # public S3 Caddy front. Chains are NOT tokenized — they stay public literals.
  __S3_ENDPOINT__: "{{ 'http://hyperlane-minio:9000' if topology == 'single' else 'https://s3.' ~ base_domain }}"

# Single-host external-services: each consumer gets a headless Service backed by
# the MinIO pods' Endpoints (cross-namespace, plain HTTP) so it reaches MinIO at
# http://hyperlane-minio:9000 without Caddy/public DNS. render_spec injects this
# at the `# __SINGLE_HOST_EXTERNAL_SERVICES__` marker on single-host and strips it
# otherwise. MinIO only: prod chains are external in every topology.
_xs_minio: |
  external-services:
    hyperlane-minio:
      selector:
        app.kubernetes.io/stack: hyperlane-minio
      namespace: laconic-hyperlane-minio
      port: 9000

single_host_external_services:
  hyperlane-validator: "{{ _xs_minio }}"
  hyperlane-relayer: "{{ _xs_minio }}"

# --- Secret-env values ---
# SO writes a spec's config: VERBATIM (no ${VAR} expansion), so chain RPCs, domain
# IDs, and chain IDs are committed literals in the specs — NOT here. Only values a
# spec injects via `secrets: { env: NAME }` live here, keyed by the exact NAME the
# process environment must carry. Every operator-supplied value (secrets AND the
# non-secret pubkeys/addresses) comes from the gitignored deployment-config.yml —
# the one file an operator fills; minio_*/grafana_* are generated by the
# credentials role into the same file.
SOLANA_RPC_URL: "https://mainnet.helius-rpc.com/?api-key={{ helius_api_key }}"
BRIDGE_OWNER_PUBKEY: "{{ bridge_owner_pubkey }}"
IGP_ORACLE_PUBKEY: "{{ igp_oracle_pubkey }}"
IGP_BENEFICIARY_PUBKEY: "{{ igp_beneficiary_pubkey | default('') }}"
GORCHAIN_VALIDATOR_ADDRESS: "{{ gorchain_validator_address }}"
SOLANA_VALIDATOR_ADDRESS: "{{ solana_validator_address }}"
PRIVY_APP_ID: "{{ privy_app_id }}"
PRIVY_APP_SECRET: "{{ privy_app_secret }}"
PRIVY_ORACLE_WALLET_ID: "{{ privy_oracle_wallet_id }}"
GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
GHCR_PAT: "{{ ghcr_pat }}"
MINIO_ROOT_USER: "{{ minio_root_user }}"
MINIO_ROOT_PASSWORD: "{{ minio_root_password }}"

# --- Per-stack secret env-var map ---
# Each key is a stack name; the value lists the env var NAMES that stack's spec
# injects via `secrets: { env: NAME }`. stack_deploy resolves each NAME to the
# same-named ansible variable above and exports it for `laconic-so`. config: vars
# are NOT here — they are committed literals in the spec. Keep in sync with the
# secrets: blocks in deployment/spec-*.yml. Dynamic per-validator IAM
# (<LABEL>_KEY_ID / <LABEL>_SECRET) and MINIO_USERS are added at runtime by
# deploy-all.yml via stack_env_extra.
stack_env_vars:
  hyperlane-minio:
    - MINIO_ROOT_USER
    - MINIO_ROOT_PASSWORD
  hyperlane-svm-deployer:
    - BRIDGE_OWNER_PUBKEY
    - IGP_ORACLE_PUBKEY
    - IGP_BENEFICIARY_PUBKEY
    - GORCHAIN_VALIDATOR_ADDRESS
    - SOLANA_VALIDATOR_ADDRESS
    - SOLANA_RPC_URL
    - GHCR_PAT
  hyperlane-svm-warp-deployer:
    - BRIDGE_OWNER_PUBKEY
    - SOLANA_RPC_URL
    - GHCR_PAT
  hyperlane-relayer:
    - SOLANA_RPC_URL
    - GHCR_PAT
  hyperlane-gas-oracle:
    - PRIVY_APP_ID
    - PRIVY_APP_SECRET
    - PRIVY_ORACLE_WALLET_ID
    - SOLANA_RPC_URL
    - GHCR_PAT
  hyperlane-monitoring:
    - GF_SECURITY_ADMIN_PASSWORD
    - SOLANA_RPC_URL
  hyperlane-warp-ui:
    - SOLANA_RPC_URL
    - GHCR_PAT
  hyperlane-validator:
    - PRIVY_APP_ID
    - PRIVY_APP_SECRET
    - SOLANA_RPC_URL
    - GHCR_PAT

# --- Per-stack static metadata ---
# deploy-all plays pass only stack_name; stack_deploy resolves spec_file/stack_path/
# is_job from here (caller-set spec_file wins — validators override per-chain). Keep
# in sync with deployment/spec-*.yml and stack_orchestrator/data/stacks/.
stacks:
  hyperlane-minio:
    spec: spec-minio.yml
    path: stack_orchestrator/data/stacks/hyperlane-minio
  hyperlane-svm-deployer:
    spec: spec-deployer.yml
    path: stack_orchestrator/data/stacks/hyperlane-svm-deployer
    is_job: true
  hyperlane-svm-warp-deployer:
    path: stack_orchestrator/data/stacks/hyperlane-svm-warp-deployer
    is_job: true
  hyperlane-relayer:
    spec: spec-relayer.yml
    path: stack_orchestrator/data/stacks/hyperlane-relayer
    configmaps:
      - agent-config
  hyperlane-gas-oracle:
    spec: spec-gas-oracle.yml
    path: stack_orchestrator/data/stacks/hyperlane-gas-oracle
  hyperlane-monitoring:
    spec: spec-monitoring.yml
    path: stack_orchestrator/data/stacks/hyperlane-monitoring
  hyperlane-warp-ui:
    spec: spec-warp-ui.yml
    path: stack_orchestrator/data/stacks/hyperlane-warp-ui
    configmaps:
      - warp-ui-config
  hyperlane-validator:
    path: stack_orchestrator/data/stacks/hyperlane-validator
    configmaps:
      - agent-config

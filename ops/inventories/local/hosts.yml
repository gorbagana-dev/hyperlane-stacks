---
# Local own-chains inventory (testing Layers 1-2). Same layout as prod/staging:
# one group per singleton stack plus `controller`. Validators come from
# bridges/default/operator/validators.yaml, not here.
#
# Default below is the SINGLE-HOST topology (Layer 1): every group, including the
# `chain_hosts` group running gorchain + solana-test-validator, points at one VM.
# For the MULTI-HOST split (Layer 2) spread the groups across local-1..local-N —
# see the commented block at the bottom — and set each host's public_ip in
# host_vars/. Chains are stood up out-of-band (gorchain-stacks + a local
# solana-test-validator); this inventory only consumes their RPC endpoints.
all:
  children:
    controller:
      hosts:
        localhost:
          ansible_connection: local
    deployer_hosts:
      hosts:
        local-1:
    minio_hosts:
      hosts:
        local-1:
    relayer_hosts:
      hosts:
        local-1:
    gas_oracle_hosts:
      hosts:
        local-1:
    monitoring_hosts:
      hosts:
        local-1:
    warp_ui_hosts:
      hosts:
        local-1:
    chain_hosts:
      hosts:
        local-1:

# --- Multi-host (Layer 2) example — replace the single-host groups above ---
#   deployer_hosts:   { hosts: { local-1: {} } }   # also runs MinIO + chains
#   minio_hosts:      { hosts: { local-1: {} } }
#   chain_hosts:      { hosts: { local-1: {} } }
#   relayer_hosts:    { hosts: { local-2: {} } }
#   gas_oracle_hosts: { hosts: { local-2: {} } }
#   monitoring_hosts: { hosts: { local-2: {} } }
#   warp_ui_hosts:    { hosts: { local-2: {} } }
# Add host_vars/local-2.yml, and spread the dns_records `host:` fields in
# group_vars/all.yml across the hosts that serve each stack. The chains are
# domain-routed out-of-band, so they're reached via gorchain_rpc_url/solana_rpc_url
# regardless of which host runs them.

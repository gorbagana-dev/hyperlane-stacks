---
# Local own-chains inventory (testing Layers 1-2). Same layout as prod/staging:
# one group per singleton stack plus `controller`. Validators come from
# bridges/default/operator/validators.yaml, not here.
#
# This is the SINGLE-HOST topology (Layer 1): every group, including the chain_hosts
# group running both test validators, points at one VM. For the MULTI-HOST split
# (Layer 2) use the committed `hosts-multihost.yml` in this directory (it shares this
# group_vars/ and host_vars/). The chain test validators are stood up out-of-band
# (gorchain-stacks + a solana-test-validator); this inventory only consumes their
# RPC endpoints via the gorchain_rpc_url/solana_rpc_url domains.
all:
  children:
    controller:
      hosts:
        localhost:
          ansible_connection: local
    deployer_hosts:
      hosts:
        local-1:
    minio_hosts:
      hosts:
        local-1:
    relayer_hosts:
      hosts:
        local-1:
    gas_oracle_hosts:
      hosts:
        local-1:
    monitoring_hosts:
      hosts:
        local-1:
    warp_ui_hosts:
      hosts:
        local-1:
    chain_hosts:
      hosts:
        local-1:

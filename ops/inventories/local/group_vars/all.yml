---
# --- Environment wiring ---
# Each deploy host fetches the stack repo itself (laconic-so fetch-stack), so
# repo_root/deployment_root resolve against the ON-HOST clone, not the operator's
# checkout — laconic-so deploy create runs on the host and reads them there.
bridge_name: default
stack_repo_locator: github.com/gorbagana-dev/hyperlane-stacks
# Branch the hosts fetch and publish-bridge-state pushes to: -e deploy_branch=<branch>
repo_base_dir: "{{ ansible_env.HOME }}/deployments"
repo_root: "{{ repo_base_dir }}/hyperlane-stacks"
deployment_subdir: deployment/local                 # local specs live in deployment/local/
deployment_root: "{{ repo_root }}/{{ deployment_subdir }}"

# --- Connection identity ---
# Ansible connects as the deploy_user for every play except the privileged bootstrap
# prep, which overrides ansible_user to privileged_user in bootstrap-host.yml.
ansible_user: "{{ deploy_user | default(lookup('env', 'USER')) }}"
# On a local test VM the controller reaches the host at its public_ip, so default the
# SSH target to it (set public_ip in host_vars and connection just works); hosts without
# one fall back to their inventory name, ansible's no-ansible_host behavior. NOT
# default(omit) — omit only works for module arguments, anywhere else the sentinel
# leaks (e.g. as a literal hostname). Override per-host if SSH lands elsewhere
# (bastion/private address).
ansible_host: "{{ public_ip | default(inventory_hostname) }}"

# --- laconic-so install (prerequisites_user) ---
laconic_so_version: "v1.1.0-0088581-202606181336"
laconic_so_release_base_url: "https://github.com/cerc-io/stack-orchestrator/releases/download"

# --- Credentials dir ---
# Host dir holding operator-placed keyfiles. MUST match the `file:` paths in the
# deployment/local/spec-*.yml secrets blocks (read by laconic-so, not ansible).
credentials_dir: "{{ ansible_env.HOME }}/.credentials/hyperlane"

# --- DNS / TLS ---
# Local mirrors the prod/staging ingress path: Caddy + Cloudflare DNS + real
# Let's Encrypt, under an operator-supplied public zone. The only local-specific
# networking bit is the chains — own and out-of-band, reached at their own domains
# (gorchain_rpc_url/solana_rpc_url below), not via this zone.
# Single-host uses hyperlane.test as-is; for multi-host set local_base_domain (a
# real Cloudflare zone) in deployment-config.yml — validators-multihost.yaml
# hostnames carry a token load_validators renders from it.
# Topology is DERIVED from inventory group membership: in single-host MinIO and the
# agents (relayer + validators) share a host = one kind cluster, the precondition for
# the in-cluster MinIO/scrape paths; in multi-host they don't. No flag, no per-inventory
# var — the shared group_vars serves both hosts.yml and hosts-multihost.yml.
topology: "{{ 'single' if (groups['minio_hosts'][0] == groups['relayer_hosts'][0]) else 'multi' }}"
# Single-host uses mkcert (local_tls role) and needs no DNS provider; multi-host
# reconciles Cloudflare. configure-dns.yml is gated on this.
manage_dns: "{{ topology == 'multi' }}"
base_domain: "{{ local_base_domain | default('hyperlane.test', true) }}"
dns_record_ttl: 300
# Singleton DNS records are DERIVED from inventory group membership (dns_cloudflare
# role): each subdomain points at whichever host runs that stack. One map serves both
# topologies — single-host (all groups -> local-1) and multi-host (groups spread) —
# so switching is a pure -i swap. Validator records come from validators.yaml.
dns_record_map:
  s3: minio_hosts
  minio-console: minio_hosts
  grafana: monitoring_hosts
  prometheus: monitoring_hosts
  warp-ui: warp_ui_hosts
  relayer: relayer_hosts
  explorer: explorer_hosts

# --- On-host spec token rendering ---
# Operator-supplied values not known until the zone/chains exist are committed as
# __TOKENS__ in deployment/local/spec-*.yml and substituted into the on-host clone
# before `deploy create` (stack_deploy). Set only here — a no-op for prod/staging,
# which commit concrete values.
#
# Chain RPCs are topology-dependent (see spec_token_renders):
#   single-host: chains run on the VM; in-cluster pods reach them as
#     gorchain-rpc:8899 / solana-rpc:18899 (external-services ip: -> kind gateway),
#     and warp-ui's browser reaches them over the SSH tunnel at localhost. The two
#     vars below are UNUSED on single-host — leave local_*_rpc_url unset.
#   multi-host: chains run out-of-band on a separate box; set their full RPC URLs
#     (scheme + domain) as local_*_rpc_url in deployment-config.yml — used for the
#     in-cluster agents AND warp-ui. Left unset, the placeholder survives into the
#     render and the placeholder gate refuses the deploy.
gorchain_rpc_url: "{{ local_gorchain_rpc_url | default('REPLACE_WITH_GORCHAIN_RPC_URL', true) }}"
solana_rpc_url: "{{ local_solana_rpc_url | default('REPLACE_WITH_SOLANA_RPC_URL', true) }}"

# --- Single-host external-services (one block per stack) ---
# Single-host shares one kind cluster, so cross-stack and chain hops resolve
# in-cluster. external-services is ONE key per spec, so each stack's full block is
# defined here and rendered into the spec's `# __SINGLE_HOST_EXTERNAL_SERVICES__`
# marker by stack_deploy (multi-host renders ''). Chains run on the host, reached via
# the kind-network gateway IP — the e2e `ip:` pattern; MinIO and the Prometheus scrape
# targets are in-cluster pods. The gateway IP is a literal __KIND_GATEWAY_IP__
# placeholder (NOT a {{ kind_gateway_ip }} template): these values are referenced in the
# `when:` membership checks before the gateway is detected, and an embedded undefined var
# makes `map | default({})` collapse to {} on eager-templating ansible (2.18.x), silently
# dropping the block. stack_deploy substitutes the detected IP at render time.
_xs_chains_only: |
  external-services:
    gorchain-rpc:
      ip: __KIND_GATEWAY_IP__
      port: 8899
    solana-rpc:
      ip: __KIND_GATEWAY_IP__
      port: 18899
_xs_chains_minio: |
  external-services:
    gorchain-rpc:
      ip: __KIND_GATEWAY_IP__
      port: 8899
    solana-rpc:
      ip: __KIND_GATEWAY_IP__
      port: 18899
    hyperlane-minio:
      selector:
        app.kubernetes.io/stack: hyperlane-minio
      namespace: laconic-hyperlane-minio
      port: 9000
_xs_chains_prom: |
  external-services:
    gorchain-rpc:
      ip: __KIND_GATEWAY_IP__
      port: 8899
    solana-rpc:
      ip: __KIND_GATEWAY_IP__
      port: 18899
    validator-gorchain:
      selector:
        app.kubernetes.io/stack: hyperlane-validator
      namespace: laconic-hyperlane-validator-gorchain
      port: 9090
    validator-solana:
      selector:
        app.kubernetes.io/stack: hyperlane-validator
      namespace: laconic-hyperlane-validator-solana
      port: 9090
    relayer:
      selector:
        app.kubernetes.io/stack: hyperlane-relayer
      namespace: laconic-hyperlane-relayer
      port: 9091

# stack_env_map_key | default(stack_name) -> that stack's external-services block.
# Stacks absent here (minio, warp-ui) get no block.
single_host_external_services:
  hyperlane-svm-deployer: "{{ _xs_chains_only }}"
  hyperlane-svm-warp-deployer: "{{ _xs_chains_only }}"
  hyperlane-gas-oracle: "{{ _xs_chains_only }}"
  hyperlane-validator: "{{ _xs_chains_minio }}"
  hyperlane-relayer: "{{ _xs_chains_minio }}"
  hyperlane-monitoring: "{{ _xs_chains_prom }}"
  hyperlane-explorer: "{{ _xs_chains_only }}"

spec_token_renders:
  __BASE_DOMAIN__: "{{ base_domain }}"
  # operator value from deployment-config.yml ("" disables WalletConnect)
  REPLACE_WITH_WALLETCONNECT_PROJECT_ID: "{{ wallet_connect_id }}"
  # Gas-oracle loop interval (ms); operator override, default 15 min.
  __GAS_ORACLE_INTERVAL_MS__: "{{ gas_oracle_interval_ms | default('900000') }}"
  # IGP fee-claim interval (seconds); operator override, default 6 h.
  __CLAIM_INTERVAL_SECONDS__: "{{ fee_claim_interval_seconds | default('21600') }}"
  # single: in-cluster service names (external-services); multi: operator domains
  __GORCHAIN_RPC_URL__: "{{ 'http://gorchain-rpc:8899' if topology == 'single' else gorchain_rpc_url }}"
  __SOLANA_RPC_URL__: "{{ 'http://solana-rpc:18899' if topology == 'single' else solana_rpc_url }}"
  # warp-ui is browser-facing: single -> chains over the SSH tunnel; multi -> domains
  __BROWSER_GORCHAIN_RPC_URL__: "{{ 'http://localhost:8899' if topology == 'single' else gorchain_rpc_url }}"
  __BROWSER_SOLANA_RPC_URL__: "{{ 'http://localhost:18899' if topology == 'single' else solana_rpc_url }}"
  __S3_ENDPOINT__: "{{ 'http://hyperlane-minio:9000' if topology == 'single' else 'https://s3.' ~ base_domain }}"
  __PROM_SCRAPE_SCHEME__: "{{ 'http' if topology == 'single' else 'https' }}"
  __PROM_VALIDATOR_TARGETS__: >-
    {{ 'gorchain-primary=validator-gorchain:9090,solana-primary=validator-solana:9090'
       if topology == 'single'
       else 'gorchain-primary=validator-gorchain.' ~ base_domain ~ ':443,'
            ~ 'solana-primary=validator-solana.' ~ base_domain ~ ':443' }}
  __PROM_RELAYER_TARGETS__: >-
    {{ 'primary=relayer:9091' if topology == 'single'
       else 'primary=relayer.' ~ base_domain ~ ':443' }}

# --- Secret-env values ---
# Local has no Helius (own Solana chain → solana_rpc_url is a plain domain rendered
# into config, not a secret). Every operator-supplied value (secrets AND the
# non-secret pubkeys/addresses) comes from the gitignored deployment-config.yml;
# MinIO/Grafana are generated by the credentials role into the same file.
BRIDGE_OWNER_PUBKEY: "{{ bridge_owner_pubkey }}"
IGP_ORACLE_PUBKEY: "{{ igp_oracle_pubkey }}"
IGP_BENEFICIARY_PUBKEY: "{{ igp_beneficiary_pubkey | default('') }}"
GORCHAIN_VALIDATOR_ADDRESS: "{{ gorchain_validator_address }}"
SOLANA_VALIDATOR_ADDRESS: "{{ solana_validator_address }}"
PRIVY_APP_ID: "{{ privy_app_id }}"
PRIVY_APP_SECRET: "{{ privy_app_secret }}"
PRIVY_ORACLE_WALLET_ID: "{{ privy_oracle_wallet_id }}"
GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
SLACK_WEBHOOK_URL: "{{ slack_webhook_url | default('') }}"
GHCR_PAT: "{{ ghcr_pat }}"
MINIO_ROOT_USER: "{{ minio_root_user }}"
MINIO_ROOT_PASSWORD: "{{ minio_root_password }}"
# Explorer DB password + Hasura admin secret — generated by the credentials role
# (like grafana_admin_password); injected via the spec secrets: { env: NAME } keys.
POSTGRES_PASSWORD: "{{ explorer_db_password }}"
HASURA_GRAPHQL_ADMIN_SECRET: "{{ explorer_hasura_admin_secret }}"
# Not a secret locally (own Solana chain) — exported only so the specs'
# HYP_CHAINS_SOLANA_CUSTOMRPCURLS: { env: SOLANA_RPC_URL } keys resolve.
SOLANA_RPC_URL: "{{ 'http://solana-rpc:18899' if topology == 'single' else solana_rpc_url }}"

# Local needs no Helius. Cloudflare is multi-host only (single-host uses mkcert).
required_operator_secrets: >-
  {{ (['cloudflare_api_token'] if manage_dns | bool else [])
     + ['privy_app_id', 'privy_app_secret', 'privy_oracle_wallet_id', 'ghcr_pat',
        'bridge_owner_pubkey', 'igp_oracle_pubkey', 'gorchain_validator_address',
        'solana_validator_address', 'privy_validator_wallet_ids',
        'wallet_connect_id'] }}

# --- Per-stack secret env-var map ---
# Lists the env-var NAMES each spec injects via secrets: { env: NAME }.
# COLLATERAL_CHAIN_RPC_URL stays a rendered config: literal (see
# spec_token_renders); SOLANA_RPC_URL is listed for the CUSTOMRPCURLS override
# keys. Keep in sync with the secrets: blocks in deployment/local/spec-*.yml.
stack_env_vars:
  hyperlane-minio:
    - MINIO_ROOT_USER
    - MINIO_ROOT_PASSWORD
  hyperlane-svm-deployer:
    - BRIDGE_OWNER_PUBKEY
    - IGP_ORACLE_PUBKEY
    - IGP_BENEFICIARY_PUBKEY
    - GORCHAIN_VALIDATOR_ADDRESS
    - SOLANA_VALIDATOR_ADDRESS
    - GHCR_PAT
  hyperlane-svm-warp-deployer:
    - BRIDGE_OWNER_PUBKEY
    - GHCR_PAT
  hyperlane-relayer:
    - SOLANA_RPC_URL
    - GHCR_PAT
  hyperlane-gas-oracle:
    - PRIVY_APP_ID
    - PRIVY_APP_SECRET
    - PRIVY_ORACLE_WALLET_ID
    - GHCR_PAT
  hyperlane-monitoring:
    - GF_SECURITY_ADMIN_PASSWORD
    - SLACK_WEBHOOK_URL
  hyperlane-warp-ui:
    - GHCR_PAT
  hyperlane-validator:
    - PRIVY_APP_ID
    - PRIVY_APP_SECRET
    - SOLANA_RPC_URL
    - GHCR_PAT
  hyperlane-explorer:
    - SOLANA_RPC_URL
    - POSTGRES_PASSWORD
    - HASURA_GRAPHQL_ADMIN_SECRET
    - GHCR_PAT

# --- Per-stack static metadata ---
# deploy-all plays pass only stack_name; stack_deploy resolves spec_file/stack_path/
# is_job from here. Keep in sync with deployment/local/spec-*.yml and
# stack_orchestrator/data/stacks/.
stacks:
  hyperlane-minio:
    spec: spec-minio.yml
    path: stack_orchestrator/data/stacks/hyperlane-minio
  hyperlane-svm-deployer:
    spec: spec-deployer.yml
    path: stack_orchestrator/data/stacks/hyperlane-svm-deployer
    is_job: true
  hyperlane-svm-warp-deployer:
    spec: spec-warp-deployer.yml
    path: stack_orchestrator/data/stacks/hyperlane-svm-warp-deployer
    is_job: true
  hyperlane-relayer:
    spec: spec-relayer.yml
    path: stack_orchestrator/data/stacks/hyperlane-relayer
    configmaps:
      - agent-config
  hyperlane-gas-oracle:
    spec: spec-gas-oracle.yml
    path: stack_orchestrator/data/stacks/hyperlane-gas-oracle
  hyperlane-monitoring:
    spec: spec-monitoring.yml
    path: stack_orchestrator/data/stacks/hyperlane-monitoring
  hyperlane-warp-ui:
    spec: spec-warp-ui.yml
    path: stack_orchestrator/data/stacks/hyperlane-warp-ui
    configmaps:
      - warp-ui-config
  hyperlane-validator:
    path: stack_orchestrator/data/stacks/hyperlane-validator
    configmaps:
      - agent-config
  hyperlane-explorer:
    spec: spec-explorer.yml
    path: stack_orchestrator/data/stacks/hyperlane-explorer
    configmaps:
      - agent-config

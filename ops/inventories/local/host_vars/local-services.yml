---
# Multi-host (Layer 2): the services host — MinIO, monitoring, gas-oracle, warp-ui,
# deployer. Serves s3/minio-console/grafana/prometheus/warp-ui under base_domain, so its
# public_ip backs those A records and inbound 80/443 (Let's Encrypt) + 22 must be open.
# deploy_user = unprivileged account that runs laconic-so, and the SSH/connection user
# (ansible_user derives from it in group_vars). privileged_user = sudo account used only
# for the bootstrap host prep.
public_ip: "REPLACE_WITH_HOST_PUBLIC_IP"
privileged_user: dev
deploy_user: dev
kind_mount_root: /srv/kind/hyperlane

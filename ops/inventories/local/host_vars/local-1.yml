---
# All-in-one host for single-host (Layer 1) runs. For multi-host, copy to
# host_vars/local-2.yml etc. and split the groups in hosts.yml.
# public_ip is this host's public IPv4 — the Cloudflare A records for the stacks
# it serves point here, and the deploy preflight checks the served hostnames
# resolve to it. Inbound 80/443 (Let's Encrypt) + 22 (controller) must be open.
public_ip: "REPLACE_WITH_HOST_PUBLIC_IP"
privileged_user: ubuntu
deploy_user: ubuntu
kind_mount_root: /srv/kind/hyperlane
ansible_user: ubuntu

---
# Copy to secrets.yml (gitignored) and fill in. Local needs one fewer than
# prod/staging: no Helius (Solana RPC is the own out-of-band chain, set as
# solana_rpc_url in group_vars, not a Helius secret). Generated secrets (MinIO
# root/IAM, Grafana admin password) are written here by the `credentials` role and
# need not be set.

# --- Operator-supplied (REQUIRED) ---
cloudflare_api_token: ""        # zone-scoped: DNS edit on cloudflare_zone (Let's Encrypt + A records)
privy_app_id: ""
privy_app_secret: ""
privy_oracle_wallet_id: ""      # Privy server-wallet id for the gas oracle
ghcr_pat: ""                    # GitHub PAT (packages:read) for private GHCR images

# --- Generated by `credentials` role (leave unset on first run) ---
# minio_root_user: ""
# minio_root_password: ""
# minio_iam: {}                 # { "<label>": { key_id, secret } }
# grafana_admin_password: ""

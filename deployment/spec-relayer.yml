# Hyperlane Relayer - deployment spec
# Delivers cross-chain messages between Gorchain and Solana.
stack: stack_orchestrator/data/stacks/hyperlane-relayer
deploy-to: k8s-kind
namespace: laconic-hyperlane
kind-cluster-name: hyperlane
config:
  GORCHAIN_RPC_URL: "REPLACE_WITH_GORCHAIN_RPC_URL"
  SOLANA_RPC_URL: "REPLACE_WITH_SOLANA_RPC_URL"
  GORCHAIN_IGP_PROGRAM_ID: "REPLACE_WITH_GORCHAIN_IGP_PROGRAM_ID"
  SOLANA_IGP_PROGRAM_ID: "REPLACE_WITH_SOLANA_IGP_PROGRAM_ID"
  GORCHAIN_IGP_ACCOUNT: "REPLACE_WITH_GORCHAIN_IGP_ACCOUNT"
  SOLANA_IGP_ACCOUNT: "REPLACE_WITH_SOLANA_IGP_ACCOUNT"
  # CLAIM_INTERVAL_SECONDS: "21600"  # IGP fee claim interval (default: 6h)
annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9091"
volumes:
  relayer-data:
resources:
  volumes:
    relayer-data:
      reservations:
        storage: 5Gi
configmaps:
  igp-fee-claim-scripts-config: ./configmaps/igp-fee-claim-scripts-config
secrets:
  hyperlane-relayer-secrets:
    - HYP_CHAINS_GORCHAIN_SIGNER_KEY
    - HYP_CHAINS_SOLANA_SIGNER_KEY
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - RELAYER_KEYPAIR_JSON
# Private registry auth — set GHCR_PAT env var before deploy start:
#   export GHCR_PAT=ghp_xxxx  # GitHub PAT with packages:read scope
image-pull-secret:
  server: ghcr.io
  username: REPLACE_WITH_GITHUB_USERNAME
  token-env: GHCR_PAT

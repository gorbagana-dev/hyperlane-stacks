# Hyperlane Warp UI - deployment spec
# Browser-based bridge UI for cross-chain token transfers.
stack: stack_orchestrator/data/stacks/hyperlane-warp-ui
deploy-to: k8s-kind
namespace: laconic-hyperlane
kind-cluster-name: hyperlane
config:
  GORCHAIN_RPC_URL: "REPLACE_WITH_GORCHAIN_RPC_URL"
  SOLANA_RPC_URL: "REPLACE_WITH_SOLANA_RPC_URL"
  GORCHAIN_DOMAIN_ID: "99999"
  SOLANA_DOMAIN_ID: "99998"
  GORCHAIN_CHAIN_ID: "99999"
  SOLANA_CHAIN_ID: "99998"
  GORCHAIN_MAILBOX: "REPLACE_WITH_GORCHAIN_MAILBOX_ADDRESS"
  SOLANA_MAILBOX: "REPLACE_WITH_SOLANA_MAILBOX_ADDRESS"
  WARP_COLLATERAL_ADDRESS: "REPLACE_WITH_COLLATERAL_ADDRESS"
  WARP_SYNTHETIC_ADDRESS: "REPLACE_WITH_SYNTHETIC_ADDRESS"
  WARP_TOKEN_MINT: "REPLACE_WITH_COLLATERAL_TOKEN_MINT"
  WARP_SYNTHETIC_MINT: "REPLACE_WITH_SYNTHETIC_TOKEN_MINT"
  NEXT_PUBLIC_WALLET_CONNECT_ID: "REPLACE_WITH_WALLETCONNECT_PROJECT_ID"
resources:
  containers:
    warp-ui:
      reservations:
        cpus: "0.25"
        memory: 256M
      limits:
        cpus: "0.5"
        memory: 512M
network:
  http-proxy:
    - host-name: bridge.example.com
      routes:
        - path: /
          proxy-to: warp-ui:3000
# Private registry auth — set GHCR_PAT env var before deploy start:
#   export GHCR_PAT=ghp_xxxx  # GitHub PAT with packages:read scope
image-pull-secret:
  server: ghcr.io
  username: REPLACE_WITH_GITHUB_USERNAME
  token-env: GHCR_PAT

# Hyperlane Explorer - LOCAL (own-chains) deployment spec
# Self-hosted message indexer + search UI (frontend + scraper + Postgres + Hasura).
#
# Local differences from prod: chain RPCs are __TOKENS__ rendered on the host. The
# scraper runs in-cluster and reaches the host chains via the single-host
# external-services block. The explorer's browser never calls the chain RPCs
# (read-only over the /api/graphql proxy), so the injected-metadata rpcUrls just
# need to be present.
stack: stack_orchestrator/data/stacks/hyperlane-explorer
deploy-to: k8s-kind
kind-cluster-name: hyperlane
kind-mount-root: /srv/kind/hyperlane
network:
  acme-email: admin@gorbagana.wtf
  http-proxy:
    - host-name: explorer.__BASE_DOMAIN__
      routes:
        - path: /
          proxy-to: explorer:3000
# Single-host only: the scraper reaches the host chains in-cluster. Rendered to an
# external-services: block on single-host, removed on multi-host.
# __SINGLE_HOST_EXTERNAL_SERVICES__
volumes:
  explorer-postgres-data: /srv/kind/hyperlane/explorer/postgres
config:
  GORCHAIN_RPC_URL: "__GORCHAIN_RPC_URL__"
  SOLANA_RPC_URL: "__SOLANA_RPC_URL__"
  GORCHAIN_DOMAIN_ID: "1198486095"
  SOLANA_DOMAIN_ID: "1399811151"
  GORCHAIN_CHAIN_ID: "1198486095"
  SOLANA_CHAIN_ID: "1399811151"
  GORCHAIN_CHAIN_NAME: "gorchain"
  SOLANA_CHAIN_NAME: "solana"
  GORCHAIN_IS_TESTNET: "true"
  SOLANA_IS_TESTNET: "true"
configmaps:
  agent-config: ./configmaps/agent-config
secrets:
  hyperlane-explorer-secrets:
    keys:
      # Keyed solana RPC for the SCRAPER (overrides the agent-config placeholder).
      HYP_CHAINS_SOLANA_CUSTOMRPCURLS: { env: SOLANA_RPC_URL }
      POSTGRES_PASSWORD: { env: POSTGRES_PASSWORD }
      HASURA_GRAPHQL_ADMIN_SECRET: { env: HASURA_GRAPHQL_ADMIN_SECRET }
# Private registry auth — set GHCR_PAT env var before deploy start:
#   export GHCR_PAT=ghp_xxxx  # GitHub PAT with packages:read scope
image-pull-secret:
  server: ghcr.io
  username: gorbagana-dev
  token-env: GHCR_PAT
resources:
  containers:
    postgres:
      reservations:
        cpus: "0.25"
        memory: 512M
      limits:
        cpus: "1.0"
        memory: 1024M
    scraper:
      reservations:
        cpus: "0.25"
        memory: 512M
      limits:
        cpus: "0.5"
        memory: 1024M
    hasura:
      reservations:
        cpus: "0.25"
        memory: 256M
      limits:
        cpus: "0.5"
        memory: 512M
    explorer:
      reservations:
        cpus: "0.25"
        memory: 256M
      limits:
        cpus: "0.5"
        memory: 512M
  volumes:
    explorer-postgres-data:
      reservations:
        storage: 10Gi

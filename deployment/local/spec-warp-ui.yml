# Hyperlane Warp UI - LOCAL (own-chains) deployment spec
# Browser-based bridge UI. Fronted by Caddy + LE at warp-ui.<zone> like prod.
#
# Local differences from prod: chain RPCs are __TOKENS__ rendered on the host —
# SOLANA_RPC_URL is the own out-of-band chain, not a Helius secret; devnet IDs.
stack: stack_orchestrator/data/stacks/hyperlane-warp-ui
deploy-to: k8s-kind
kind-cluster-name: hyperlane
kind-mount-root: /srv/kind/hyperlane
config:
  # warp-ui is browser-facing — the user's browser talks to these RPCs, so they must
  # be browser-reachable (single-host: chains over the SSH tunnel at localhost;
  # multi-host: the public chain domains), NOT the in-cluster gorchain-rpc names.
  GORCHAIN_RPC_URL: "__BROWSER_GORCHAIN_RPC_URL__"
  SOLANA_RPC_URL: "__BROWSER_SOLANA_RPC_URL__"
  GORCHAIN_DOMAIN_ID: "1198486095"
  SOLANA_DOMAIN_ID: "1399811151"
  GORCHAIN_CHAIN_ID: "1198486095"
  SOLANA_CHAIN_ID: "1399811151"
  GORCHAIN_MAILBOX: "__GORCHAIN_MAILBOX__"
  SOLANA_MAILBOX: "__SOLANA_MAILBOX__"
  NEXT_PUBLIC_WALLET_CONNECT_ID: "REPLACE_WITH_WALLETCONNECT_PROJECT_ID"
configmaps:
  warp-ui-config: ./configmaps/warp-ui-config
resources:
  containers:
    warp-ui:
      reservations:
        cpus: "0.25"
        memory: 256M
      limits:
        cpus: "0.5"
        memory: 512M
# Private registry auth — set GHCR_PAT env var before deploy start:
#   export GHCR_PAT=ghp_xxxx  # GitHub PAT with packages:read scope
image-pull-secret:
  server: ghcr.io
  username: REPLACE_WITH_GITHUB_USERNAME
  token-env: GHCR_PAT
network:
  acme-email: admin@gorbagana.wtf
  http-proxy:
    - host-name: warp-ui.__DNS_ZONE__
      routes:
        - path: /
          proxy-to: warp-ui:3000

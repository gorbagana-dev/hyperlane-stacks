# Hyperlane Relayer - LOCAL (own-chains) deployment spec
# Delivers cross-chain messages between Gorchain and Solana.
#
# Local differences from prod: chain RPCs are __TOKENS__ rendered on the host; the S3
# endpoint renders per topology (single -> in-cluster MinIO over HTTP; multi -> Caddy +
# LE at s3.<zone>).
stack: stack_orchestrator/data/stacks/hyperlane-relayer
deploy-to: k8s-kind
kind-cluster-name: hyperlane
kind-mount-root: /srv/kind/hyperlane
config:
  GORCHAIN_RPC_URL: "http://gorchain-rpc:8899"
  SOLANA_RPC_URL: "http://solana-rpc:18899"
  GORCHAIN_IGP_PROGRAM_ID: "6WCZTP3DfUXip27QDEG2nwgHYebvUyLypGLNfvbovPmT"
  SOLANA_IGP_PROGRAM_ID: "3U4fkoih8WmrpiWj2Lusgu6aSU9Tr9cWT4y6SddFrRBQ"
  GORCHAIN_IGP_ACCOUNT: "HkqzX3LP7hDHW7wK98i4zWJEpHsudL9ioRiEkWnTVaL9"
  SOLANA_IGP_ACCOUNT: "48AVoTZ6j5AXeioMsSrSC9goqjKGfwZ8FRiNcA2eEqwB"
  # Rendered per topology: single -> http://hyperlane-minio:9000 (in-cluster, plain
  # HTTP); multi -> https://s3.<zone> (Caddy + LE). See ops group_vars spec_token_renders.
  AWS_ENDPOINT_URL_S3: "http://hyperlane-minio:9000"
annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9091"
volumes:
  relayer-data: /srv/kind/hyperlane/relayer/data
resources:
  volumes:
    relayer-data:
      reservations:
        storage: 5Gi
configmaps:
  igp-fee-claim-scripts-config: ./configmaps/igp-fee-claim-scripts-config
  agent-config: ./configmaps/agent-config
# Before deploying, place these keyfiles on the host:
#   ~/.credentials/hyperlane/relayer-gorchain.key  (hex-encoded relayer signing key for Gorchain)
#   ~/.credentials/hyperlane/relayer-solana.key    (hex-encoded relayer signing key for Solana)
#   ~/.credentials/hyperlane/relayer-fee-claim.json (Solana keypair JSON array for IGP fee claims)
# No MinIO credentials needed — the relayer uses an anonymous S3 client.
secrets:
  hyperlane-relayer-secrets:
    keys:
      HYP_CHAINS_GORCHAIN_SIGNER_KEY: { file: ~/.credentials/hyperlane/relayer-gorchain.key }
      HYP_CHAINS_SOLANA_SIGNER_KEY:   { file: ~/.credentials/hyperlane/relayer-solana.key }
      RELAYER_KEYPAIR_JSON:           { file: ~/.credentials/hyperlane/relayer-fee-claim.json }
# Private registry auth — set GHCR_PAT env var before deploy start:
#   export GHCR_PAT=ghp_xxxx  # GitHub PAT with packages:read scope
image-pull-secret:
  server: ghcr.io
  username: REPLACE_WITH_GITHUB_USERNAME
  token-env: GHCR_PAT
network:
  acme-email: admin@gorbagana.wtf
  http-proxy:
    - host-name: relayer.hyperlane.local
      routes:
        - path: /
          proxy-to: relayer:9091
# Single-host only: relayer reads validator checkpoints from the MinIO pod cross-NS
# in-cluster. Rendered to an external-services: block on single-host, removed on multi-host.
external-services:
  gorchain-rpc:
    ip: 172.18.0.1
    port: 8899
  solana-rpc:
    ip: 172.18.0.1
    port: 18899
  hyperlane-minio:
    selector:
      app.kubernetes.io/stack: hyperlane-minio
    namespace: laconic-hyperlane-minio
    port: 9000


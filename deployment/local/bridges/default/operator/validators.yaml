---
# Local own-chains validator set. Single-host (Layer 1): both on local-1. For the
# multi-host split (Layer 2) move a validator's `host` to local-2 etc. Pure
# topology: wallet ids come from deployment-config (privy_validator_wallet_ids).
# Hostnames match the group_vars base_domain (load_validators derives the DNS
# record name by stripping base_domain off the hostname).
validators:
  - label: gorchain-primary
    chain: gorchain
    host: local-1
    hostname: validator-gorchain.hyperlane.test
  - label: solana-primary
    chain: solana
    host: local-1
    hostname: validator-solana.hyperlane.test

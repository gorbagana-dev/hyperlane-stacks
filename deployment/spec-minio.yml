# Hyperlane MinIO - deployment spec
# S3-compatible storage for validator checkpoints.
stack: stack_orchestrator/data/stacks/hyperlane-minio
deploy-to: k8s-kind
kind-cluster-name: hyperlane
volumes:
  minio-data:
resources:
  volumes:
    minio-data:
      reservations:
        storage: 10Gi
secrets:
  hyperlane-minio-secrets:
    - MINIO_ROOT_USER
    - MINIO_ROOT_PASSWORD

# Hyperlane MinIO - deployment spec
# S3-compatible storage for validator checkpoints.
stack: stack_orchestrator/data/stacks/hyperlane-minio
deploy-to: k8s-kind
kind-cluster-name: hyperlane
kind-mount-root: /srv/kind/hyperlane-bridge
# Replace with operator email for Let's Encrypt registration:
acme-email: ops@example.com
volumes:
  minio-data:
resources:
  volumes:
    minio-data:
      reservations:
        storage: 10Gi
network:
  http-proxy:
    - host-name: minio-console.example.com
      routes:
        - path: /
          proxy-to: minio:9001
secrets:
  hyperlane-minio-secrets:
    - MINIO_ROOT_USER
    - MINIO_ROOT_PASSWORD

# Hyperlane Gas Oracle - deployment spec
# Periodically updates IGP gas oracle configurations on both chains.
stack: stack_orchestrator/data/stacks/hyperlane-gas-oracle
deploy-to: k8s-kind
config:
  GORCHAIN_RPC_URL: "REPLACE_WITH_GORCHAIN_RPC_URL"
  SOLANA_RPC_URL: "REPLACE_WITH_SOLANA_RPC_URL"
  GORCHAIN_IGP_PROGRAM_ID: "REPLACE_WITH_GORCHAIN_IGP_PROGRAM_ID"
  SOLANA_IGP_PROGRAM_ID: "REPLACE_WITH_SOLANA_IGP_PROGRAM_ID"
  GORCHAIN_DOMAIN_ID: "99999"
  SOLANA_DOMAIN_ID: "99998"
  GAS_ORACLE_INTERVAL_MS: "900000"
secrets:
  hyperlane-gas-oracle-secrets:
    - PRIVY_APP_ID
    - PRIVY_APP_SECRET
    - PRIVY_ORACLE_WALLET_ID

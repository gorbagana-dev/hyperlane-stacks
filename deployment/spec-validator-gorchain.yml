# Hyperlane Validator (Gorchain) - deployment spec
# Runs a validator for Gorchain using the hyperlane-validator stack.
stack: stack_orchestrator/data/stacks/hyperlane-validator-gorchain
deploy-to: k8s-kind
config:
  ORIGIN_CHAIN_NAME: gorchain
  CHECKPOINT_BUCKET: hyperlane-validator-gorchain
  MINIO_ACCESS_KEY: "REPLACE_WITH_MINIO_ACCESS_KEY"
volumes:
  validator-gorchain-data: 5Gi
configmaps:
  agent-config: ./configmaps/agent-config

# Hyperlane Monitoring - deployment spec
# Prometheus, Grafana, pushgateway, and balance monitoring.
stack: stack_orchestrator/data/stacks/hyperlane-monitoring
deploy-to: k8s-kind
kind-cluster-name: hyperlane
kind-mount-root: /srv/kind/hyperlane
network:
  acme-email: admin@gorbagana.wtf
  http-proxy:
    - host-name: grafana.bridge.gorbagana.wtf
      routes:
        - path: /
          proxy-to: grafana:3000
    - host-name: prometheus.bridge.gorbagana.wtf
      routes:
        - path: /
          proxy-to: prometheus:9090
volumes:
  prometheus-data: /srv/kind/hyperlane/monitoring/prometheus
  grafana-data: /srv/kind/hyperlane/monitoring/grafana
config:
  GORCHAIN_RPC_URL: "https://rpc.gorbagana.wtf"
  # Wallet format: label:address or label:address:threshold
  # Per-wallet threshold overrides BALANCE_THRESHOLD_SOL (the fallback).
  MONITORED_WALLETS_GORCHAIN: "relayer:ADDR:5.0,igp-oracle:ADDR:2.0"
  MONITORED_WALLETS_SOLANA: "relayer:ADDR:5.0,igp-oracle:ADDR:2.0"
  BALANCE_THRESHOLD_SOL: "1.0"  # fallback for wallets without explicit threshold
  BALANCE_CHECK_INTERVAL: "300"
  # Prometheus scrape targets, rendered to file_sd by the prometheus container's
  # entrypoint on each start. Format: comma-separated instance_label=host:port,
  # one entry per instance. Add an instance here and restart the stack to pick
  # it up.
  PROMETHEUS_VALIDATOR_TARGETS: "gorchain-primary=validator-gorchain.bridge.gorbagana.wtf:443,solana-primary=validator-solana.bridge.gorbagana.wtf:443"
  PROMETHEUS_RELAYER_TARGETS: "primary=relayer.bridge.gorbagana.wtf:443"
configmaps:
  prometheus-config: ./configmaps/prometheus-config
  grafana-datasources-config: ./configmaps/grafana-datasources-config
  grafana-dashboard-config: ./configmaps/grafana-dashboard-config
  grafana-dashboards-config: ./configmaps/grafana-dashboards-config
  balance-monitor-scripts-config: ./configmaps/balance-monitor-scripts-config
# Before deploying, export this env var in the shell that runs `laconic-so`:
#   GF_SECURITY_ADMIN_PASSWORD
secrets:
  hyperlane-monitoring-secrets:
    keys:
      GF_SECURITY_ADMIN_PASSWORD: { env: GF_SECURITY_ADMIN_PASSWORD }
      SOLANA_RPC_URL:             { env: SOLANA_RPC_URL }
# Optional: override container images (service name → full image ref)
# image-overrides:
#   prometheus: prom/prometheus:v2.53.0
#   grafana: grafana/grafana:11.1.0
#   balance-monitor: ghcr.io/gorbagana-dev/hyperlane-balance-monitor:v1.0.0
resources:
  volumes:
    prometheus-data:
      reservations:
        storage: 10Gi
    grafana-data:
      reservations:
        storage: 2Gi

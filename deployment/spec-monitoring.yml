# Hyperlane Monitoring - deployment spec
# Prometheus, Grafana, pushgateway, and balance monitoring.
stack: stack_orchestrator/data/stacks/hyperlane-monitoring
deploy-to: k8s-kind
namespace: laconic-hyperlane
kind-cluster-name: hyperlane
config:
  GORCHAIN_RPC_URL: "REPLACE_WITH_GORCHAIN_RPC_URL"
  SOLANA_RPC_URL: "REPLACE_WITH_SOLANA_RPC_URL"
  MONITORED_WALLETS_GORCHAIN: "REPLACE_WITH_GORCHAIN_WALLETS"
  MONITORED_WALLETS_SOLANA: "REPLACE_WITH_SOLANA_WALLETS"
  BALANCE_THRESHOLD_SOL: "1.0"
  BALANCE_CHECK_INTERVAL: "300"
network:
  ports:
    prometheus:
      - "9090"
    grafana:
      - "3000"
volumes:
  prometheus-data:
  grafana-data:
resources:
  volumes:
    prometheus-data:
      reservations:
        storage: 10Gi
    grafana-data:
      reservations:
        storage: 2Gi
configmaps:
  prometheus-config: ./configmaps/prometheus-config
  grafana-datasources-config: ./configmaps/grafana-datasources-config
  grafana-dashboard-config: ./configmaps/grafana-dashboard-config
  grafana-dashboards: ./configmaps/grafana-dashboards
  balance-monitor-scripts-config: ./configmaps/balance-monitor-scripts-config
secrets:
  hyperlane-monitoring-secrets:
    - GF_SECURITY_ADMIN_PASSWORD

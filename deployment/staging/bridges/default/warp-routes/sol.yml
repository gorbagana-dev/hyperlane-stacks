# Warp route: native SOL (Solana) <-> gorchain synthetic.
# Chain endpoints live in spec-warp-deployer.yml, not here.
name: SOL-solana-gorchain
origin:
  chain: solana
  type: native
  name: "Solana"
  symbol: "SOL"
  decimals: 9
remote:
  chain: gorchain
  type: synthetic
  name: "Solana"
  symbol: "SOL"
  decimals: 9
# Offchain metadata for the gorchain synthetic (Token-2022 metadata URI). The
# deployer validates it: name/symbol must match remote.name/remote.symbol and
# the image URL must serve. Revision-pinned gist raw URL.
metadataUri: "https://gist.githubusercontent.com/prathamesh0/685734f8aac9dd22c9eeb3d1e7f8e407/raw/f8b8de3e2438b891cea8dd15ae699a618e9ee849/sol-token-metadata.json"
# Token logo shown in the warp-UI (applied to both sides). Separate from
# metadataUri: the UI reads warpRoutes.yaml, not the on-chain Token-2022 metadata.
# Canonical wrapped-SOL logo asset — a public URL, nothing to host.
logoURI: "https://raw.githubusercontent.com/solana-labs/token-list/main/assets/mainnet/So11111111111111111111111111111111111111112/logo.png"

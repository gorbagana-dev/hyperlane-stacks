# Warp route: USDC (Solana collateral) <-> gorchain synthetic.
# Chain endpoints live in spec-warp-deployer.yml, not here.
name: USDC-solana-gorchain
origin:
  chain: solana
  type: collateral
  # Circle's devnet USDC mint — real Circle metadata, faucetable.
  token: "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
  name: "USD Coin"
  symbol: "USDC"
  decimals: 6
remote:
  chain: gorchain
  type: synthetic
  name: "USD Coin"
  symbol: "USDC"
  decimals: 6
# Offchain metadata for the gorchain synthetic (Token-2022 metadata URI):
# a hosted JSON whose name/symbol MUST match remote.name/remote.symbol —
# see the staging runbook's "Token metadata" prerequisite (one-time: host
# it, e.g. a gist raw URL, and commit the URL here).
metadataUri: "REPLACE_WITH_STAGING_USDC_METADATA_URI"

# Hyperlane Explorer - staging deployment spec
# Self-hosted message indexer + search UI (frontend + scraper + Postgres + Hasura).
stack: stack_orchestrator/data/stacks/hyperlane-explorer
deploy-to: k8s-kind
kind-cluster-name: hyperlane
kind-mount-root: /srv/kind/hyperlane
network:
  acme-email: admin@gorbagana.wtf
  http-proxy:
    - host-name: explorer.staging.gorbagana.wtf
      routes:
        - path: /
          proxy-to: explorer:3000
volumes:
  explorer-postgres-data: /srv/kind/hyperlane/explorer/postgres
config:
  # gorchain RPC — used by the scraper (HYP_CHAINS_GORCHAIN_*) and injected into
  # the frontend chain metadata. The Solana RPC is the SOLANA_RPC_URL secret below.
  GORCHAIN_RPC_URL: "https://rpc.staging.gorbagana.wtf"
  GORCHAIN_DOMAIN_ID: "1198486095"
  SOLANA_DOMAIN_ID: "1399811151"
  GORCHAIN_CHAIN_ID: "1198486095"
  SOLANA_CHAIN_ID: "1399811151"
  GORCHAIN_CHAIN_NAME: "gorchain"
  SOLANA_CHAIN_NAME: "solana"
  GORCHAIN_IS_TESTNET: "true"
  SOLANA_IS_TESTNET: "true"
configmaps:
  agent-config: ./configmaps/agent-config
# Before deploying, export this env var in the shell that runs laconic-so:
#   SOLANA_RPC_URL  (Helius RPC — embeds an API key; scraper-only)
secrets:
  hyperlane-explorer-secrets:
    keys:
      # Solana RPC for the scraper (overrides the agent-config placeholder).
      HYP_CHAINS_SOLANA_CUSTOMRPCURLS: { env: SOLANA_RPC_URL }
      # DB password (built into the DSN at runtime by the scraper/hasura
      # entrypoints) + Hasura admin secret (enforces the anon read-only role).
      # Generated by the ops credentials role, like the Grafana admin password.
      POSTGRES_PASSWORD: { env: POSTGRES_PASSWORD }
      HASURA_GRAPHQL_ADMIN_SECRET: { env: HASURA_GRAPHQL_ADMIN_SECRET }
# Private registry auth — set GHCR_PAT env var before deploy start:
#   export GHCR_PAT=ghp_xxxx  # GitHub PAT with packages:read scope
image-pull-secret:
  server: ghcr.io
  username: gorbagana-dev
  token-env: GHCR_PAT
# Pinned releases; bump deliberately (latest is only for first bring-up).
image-overrides:
  explorer: ghcr.io/gorbagana-dev/hyperlane-explorer:latest
  scraper: ghcr.io/gorbagana-dev/hyperlane-scraper:latest
  hasura: ghcr.io/gorbagana-dev/hyperlane-hasura:latest
resources:
  containers:
    db:
      reservations:
        cpus: "0.5"
        memory: 512M
      limits:
        cpus: "1.0"
        memory: 1024M
    scraper:
      reservations:
        cpus: "0.25"
        memory: 512M
      limits:
        cpus: "0.5"
        memory: 1024M
    hasura:
      reservations:
        cpus: "0.25"
        memory: 256M
      limits:
        cpus: "0.5"
        memory: 512M
    explorer:
      reservations:
        cpus: "0.25"
        memory: 256M
      limits:
        cpus: "0.5"
        memory: 512M
  volumes:
    explorer-postgres-data:
      reservations:
        storage: 10Gi

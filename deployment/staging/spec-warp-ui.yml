# Hyperlane Warp UI - deployment spec
# Browser-based bridge UI for cross-chain token transfers.
stack: stack_orchestrator/data/stacks/hyperlane-warp-ui
deploy-to: k8s-kind
kind-cluster-name: hyperlane
kind-mount-root: /srv/kind/hyperlane
config:
  GORCHAIN_RPC_URL: "https://rpc.staging.gorbagana.wtf"
  GORCHAIN_DOMAIN_ID: "1198486095"
  SOLANA_DOMAIN_ID: "1399811151"
  GORCHAIN_CHAIN_ID: "1198486095"
  SOLANA_CHAIN_ID: "1399811151"
  GORCHAIN_MAILBOX: "__GORCHAIN_MAILBOX__"
  SOLANA_MAILBOX: "__SOLANA_MAILBOX__"
  NEXT_PUBLIC_WALLET_CONNECT_ID: "REPLACE_WITH_WALLETCONNECT_PROJECT_ID"
configmaps:
  warp-ui-config: ./configmaps/warp-ui-config
# Before deploying, export this env var in the shell that runs `laconic-so`:
#   SOLANA_RPC_URL  (Helius RPC URL — embeds an API key, so kept out of config)
secrets:
  hyperlane-warp-ui-secrets:
    keys:
      SOLANA_RPC_URL: { env: SOLANA_RPC_URL }
resources:
  containers:
    warp-ui:
      reservations:
        cpus: "0.25"
        memory: 256M
      limits:
        cpus: "0.5"
        memory: 512M
network:
  acme-email: admin@gorbagana.wtf
  http-proxy:
    - host-name: warp-ui.staging.gorbagana.wtf
      routes:
        - path: /
          proxy-to: warp-ui:3000
# Private registry auth — set GHCR_PAT env var before deploy start:
#   export GHCR_PAT=ghp_xxxx  # GitHub PAT with packages:read scope
image-pull-secret:
  server: ghcr.io
  username: REPLACE_WITH_GITHUB_USERNAME
  token-env: GHCR_PAT
# Optional: override container images (service name → full image ref)
# image-overrides:
#   warp-ui: ghcr.io/gorbagana-dev/hyperlane-warp-ui:v1.0.0

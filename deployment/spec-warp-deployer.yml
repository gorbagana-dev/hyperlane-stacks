# Hyperlane SVM Warp Route Deployer - deployment spec
# Deploys warp route contracts for a specific token pair.
# Requires core deployer (spec-deployer.yml) to have run first.
#
# COLLATERAL_CHAIN_RPC_URL, SYNTHETIC_CHAIN_RPC_URL, etc. default from
# SOLANA_*/GORCHAIN_* vars in the compose file, so you only need to set
# those unless your collateral/synthetic chains differ from the defaults.
stack: stack_orchestrator/data/stacks/hyperlane-svm-warp-deployer
deploy-to: k8s-kind
config:
  WARP_TOKEN_MINT: "REPLACE_WITH_TOKEN_MINT_ADDRESS"
  WARP_ROUTE_NAME: "USDC-solana-gorchain"
  COLLATERAL_CHAIN: solana
  SYNTHETIC_CHAIN: gorchain
  GORCHAIN_RPC_URL: "REPLACE_WITH_GORCHAIN_RPC_URL"
  GORCHAIN_DOMAIN_ID: "99999"
  GORCHAIN_CHAIN_ID: "99999"
  SOLANA_RPC_URL: "REPLACE_WITH_SOLANA_RPC_URL"
  SOLANA_DOMAIN_ID: "99998"
  SOLANA_CHAIN_ID: "99998"
  FORCE_REDEPLOY: "false"
configmaps:
  warp-deployer-scripts-config: ./configmaps/warp-deployer-scripts-config
  warp-deployer-token-config: ./configmaps/warp-deployer-token-config
  warp-deployer-registry-config: ./configmaps/warp-deployer-registry-config
secrets:
  hyperlane-warp-deployer-secrets:
    - DEPLOYER_KEYPAIR
    - HARDWARE_WALLET_PUBKEY

- name: Hyperlane emergency kill switch
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    job_name: "hyperlane-kill-switch-{{ lookup('pipe', 'date +%s') }}"
    script_configmap_name: "{{ job_name }}-script"
    output_dir: "./kill-switch-output"
    image: "laconicnetwork/hyperlane-svm-deployer:local"

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - gorchain_rpc_url | length > 0
          - solana_rpc_url | length > 0
          - gorchain_domain_id is defined
          - solana_domain_id is defined
          - hardware_wallet_pubkey | length > 0
        fail_msg: "Required variables not set. Check group_vars/all.yml"

    - name: Check cluster connectivity
      kubernetes.core.k8s_info:
        kind: Namespace
        name: "{{ namespace }}"
      register: ns_check

    - name: Check program-ids ConfigMap exists
      kubernetes.core.k8s_info:
        kind: ConfigMap
        name: hyperlane-program-ids
        namespace: "{{ namespace }}"
      register: program_ids_cm
      failed_when: program_ids_cm.resources | length == 0

    - name: Find agent deployments
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: "{{ namespace }}"
        label_selectors:
          - "app.kubernetes.io/name=hyperlane-svm-ops"
      register: agent_deployments
      failed_when: false

    - name: Scale agent deployments to 0
      kubernetes.core.k8s:
        state: present
        kind: Deployment
        name: "{{ item }}"
        namespace: "{{ namespace }}"
        definition:
          spec:
            replicas: 0
      loop:
        - hyperlane-validator-gorchain
        - hyperlane-validator-solana
        - hyperlane-relayer
      failed_when: false

  tasks:
    - name: Create script ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ script_configmap_name }}"
            namespace: "{{ namespace }}"
          data:
            kill-switch.sh: "{{ lookup('file', '../scripts/kill-switch.sh') }}"

    - name: Create kill-switch Job
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', '../templates/kill-switch-job.yml.j2') }}"

    - name: Wait for Job completion
      kubernetes.core.k8s_info:
        kind: Job
        name: "{{ job_name }}"
        namespace: "{{ namespace }}"
      register: job_status
      until: >-
        (job_status.resources[0].status.succeeded | default(0)) > 0 or
        (job_status.resources[0].status.failed | default(0)) > 0
      retries: 60
      delay: 5

    - name: Fail if Job failed
      ansible.builtin.fail:
        msg: "Kill-switch job failed. Check logs: kubectl logs job/{{ job_name }}"
      when: (job_status.resources[0].status.failed | default(0)) > 0

    - name: Get Job pod name
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - "job-name={{ job_name }}"
      register: job_pod

    - name: Print Job logs
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ kubeconfig_path }}
          logs {{ job_pod.resources[0].metadata.name }}
          -n {{ namespace }}
      register: job_logs

    - name: Display logs
      ansible.builtin.debug:
        var: job_logs.stdout_lines

    - name: Create local output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory

    - name: Copy unsigned transactions from pod
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ kubeconfig_path }}
          cp {{ namespace }}/{{ job_pod.resources[0].metadata.name }}:/output/
          {{ output_dir }}/

    - name: List output files
      ansible.builtin.find:
        paths: "{{ output_dir }}"
        patterns: "*.json"
      register: tx_files

    - name: Print signing instructions
      ansible.builtin.debug:
        msg: |
          Unsigned transactions saved to {{ output_dir }}/

          For each .json file, sign and submit:
            solana sign-offloaded-transaction {{ output_dir }}/<file>.json --signer usb://ledger
            solana send-signed-transaction {{ output_dir }}/<file>.json --url <RPC_URL>

          Review .summary.txt files for per-transaction details.

  post_tasks:
    - name: Clean up Job
      kubernetes.core.k8s:
        state: absent
        kind: Job
        name: "{{ job_name }}"
        namespace: "{{ namespace }}"
        delete_options:
          propagationPolicy: Background

    - name: Clean up script ConfigMap
      kubernetes.core.k8s:
        state: absent
        kind: ConfigMap
        name: "{{ script_configmap_name }}"
        namespace: "{{ namespace }}"

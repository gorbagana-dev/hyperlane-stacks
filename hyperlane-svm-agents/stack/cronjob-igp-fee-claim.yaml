apiVersion: batch/v1
kind: CronJob
metadata:
  name: igp-fee-claim
  namespace: hyperlane-agents
  labels:
    app.kubernetes.io/name: igp-fee-claim
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/part-of: hyperlane-svm-agents
spec:
  # Claim fees every 6 hours
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: igp-fee-claim
            app.kubernetes.io/component: maintenance
        spec:
          containers:
            - name: fee-claim
              # Uses the sealevel deployer image which includes hyperlane-sealevel-client
              image: git.vdb.to/laconicnetwork/hyperlane-svm-deployer:local
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "Claiming IGP fees on Gorchain..."
                  hyperlane-sealevel-client \
                    --url "$GORCHAIN_RPC_URL" \
                    igp claim \
                    --program-id "$GORCHAIN_IGP_PROGRAM_ID" \
                    --keypair /dev/stdin <<< "$RELAYER_KEYPAIR_JSON"

                  echo "Claiming IGP fees on Solana..."
                  hyperlane-sealevel-client \
                    --url "$SOLANA_RPC_URL" \
                    igp claim \
                    --program-id "$SOLANA_IGP_PROGRAM_ID" \
                    --keypair /dev/stdin <<< "$RELAYER_KEYPAIR_JSON"

                  echo "Fee claim complete."
              envFrom:
                - configMapRef:
                    name: chain-config
              env:
                # The claim instruction is permissionless — any funded account
                # can call it, funds always go to the configured beneficiary.
                # We use the relayer key to pay tx fees.
                - name: RELAYER_KEYPAIR_JSON
                  valueFrom:
                    secretKeyRef:
                      name: relayer-key
                      key: HYP_BASE_CHAINS_GORCHAIN_SIGNER_KEY
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          restartPolicy: OnFailure

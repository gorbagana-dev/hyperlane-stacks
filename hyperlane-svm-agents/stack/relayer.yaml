apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayer
  namespace: hyperlane-agents
  labels:
    app.kubernetes.io/name: relayer
    app.kubernetes.io/component: relayer
    app.kubernetes.io/part-of: hyperlane-svm-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relayer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relayer
        app.kubernetes.io/component: relayer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      containers:
        - name: relayer
          image: gcr.io/abacus-labs-dev/hyperlane-agent:agents-v2.0.0
          args:
            - relayer
            - --db
            - /data/relayer
            - --relayChains
            - gorchain,solanatestnet
            - --allowLocalCheckpointSyncers
            - "false"
            - --metricsPort
            - "9091"
          env:
            - name: CONFIG_FILES
              value: "/config/agent-config.json"
            # Gas enforcement: None (Sealevel process_estimate_costs returns
            # hardcoded zeros — OnChainFeeQuoting is non-functional)
            - name: HYP_BASE_GASPAYMENTENFORCEMENT
              value: '[{"type": "none"}]'
            # MinIO for reading validator checkpoints
            - name: AWS_ENDPOINT_URL_S3
              value: "http://minio:9000"
            - name: AWS_REGION
              value: "us-east-1"
          envFrom:
            - secretRef:
                name: relayer-key
            - secretRef:
                name: minio-credentials
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          volumeMounts:
            - name: agent-config
              mountPath: /config
              readOnly: true
            - name: relayer-data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: agent-config
          configMap:
            name: agent-config
        - name: relayer-data
          persistentVolumeClaim:
            claimName: relayer-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: relayer-data
  namespace: hyperlane-agents
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: relayer
  namespace: hyperlane-agents
  labels:
    app.kubernetes.io/name: relayer
    app.kubernetes.io/component: relayer
spec:
  selector:
    app.kubernetes.io/name: relayer
  ports:
    - name: metrics
      port: 9091
      targetPort: 9091
  type: ClusterIP

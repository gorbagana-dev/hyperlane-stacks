apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: hyperlane-agents
data:
  # Populated by the deployer job with actual contract addresses.
  # Placeholder structure shown for reference.
  agent-config.json: |
    {
      "chains": {
        "gorchain": {
          "name": "gorchain",
          "chainId": 99999,
          "domainId": 99999,
          "protocol": "sealevel",
          "mailbox": "${GORCHAIN_MAILBOX}",
          "interchainGasPaymaster": "${GORCHAIN_IGP}",
          "validatorAnnounce": "${GORCHAIN_VALIDATOR_ANNOUNCE}",
          "merkleTreeHook": "${GORCHAIN_MERKLE_TREE_HOOK}",
          "rpcUrls": [{"http": "${GORCHAIN_RPC_URL}"}],
          "blocks": {
            "estimateBlockTime": 0.4,
            "reorgPeriod": 0
          },
          "index": {
            "from": 0,
            "chunk": 10000,
            "mode": "sequence"
          },
          "nativeToken": {
            "decimals": 9
          }
        },
        "solanatestnet": {
          "name": "solanatestnet",
          "chainId": 1399811150,
          "domainId": 1399811150,
          "protocol": "sealevel",
          "mailbox": "${SOLANA_MAILBOX}",
          "interchainGasPaymaster": "${SOLANA_IGP}",
          "validatorAnnounce": "${SOLANA_VALIDATOR_ANNOUNCE}",
          "merkleTreeHook": "${SOLANA_MERKLE_TREE_HOOK}",
          "rpcUrls": [{"http": "${SOLANA_RPC_URL}"}],
          "blocks": {
            "estimateBlockTime": 0.4,
            "reorgPeriod": 0
          },
          "index": {
            "from": 0,
            "chunk": 10000,
            "mode": "sequence"
          },
          "nativeToken": {
            "decimals": 9
          }
        }
      }
    }

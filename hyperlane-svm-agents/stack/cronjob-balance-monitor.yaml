apiVersion: batch/v1
kind: CronJob
metadata:
  name: wallet-balance-monitor
  namespace: hyperlane-agents
  labels:
    app.kubernetes.io/name: wallet-balance-monitor
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: hyperlane-svm-agents
spec:
  # Check balances every 5 minutes
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wallet-balance-monitor
            app.kubernetes.io/component: monitoring
        spec:
          containers:
            - name: balance-monitor
              image: git.vdb.to/laconicnetwork/hyperlane-gas-oracle:local
              command:
                - node
                - -e
                - |
                  import { Connection, PublicKey } from '@solana/web3.js';

                  const wallets = JSON.parse(process.env.MONITORED_WALLETS || '[]');
                  const gorchainRpc = process.env.GORCHAIN_RPC_URL;
                  const solanaRpc = process.env.SOLANA_RPC_URL;
                  const threshold = parseFloat(process.env.BALANCE_THRESHOLD_SOL || '1.0');
                  const pushGwUrl = process.env.PUSHGATEWAY_URL || 'http://prometheus-pushgw:9091';

                  async function checkBalances(rpcUrl, chainName, addresses) {
                    const conn = new Connection(rpcUrl, 'confirmed');
                    const metrics = [];
                    for (const { name, address } of addresses) {
                      try {
                        const balance = await conn.getBalance(new PublicKey(address));
                        const sol = balance / 1e9;
                        console.log(`${chainName}/${name}: ${sol} SOL`);
                        metrics.push(
                          `hyperlane_wallet_balance_sol{chain="${chainName}",wallet="${name}",address="${address}"} ${sol}`
                        );
                        if (sol < threshold) {
                          console.warn(`LOW BALANCE: ${chainName}/${name} = ${sol} SOL (threshold: ${threshold})`);
                        }
                      } catch (err) {
                        console.error(`Failed to check ${chainName}/${name}: ${err.message}`);
                        metrics.push(
                          `hyperlane_wallet_balance_error{chain="${chainName}",wallet="${name}"} 1`
                        );
                      }
                    }
                    return metrics;
                  }

                  async function main() {
                    const allMetrics = [];
                    for (const { chain, rpc, addresses } of [
                      { chain: 'gorchain', rpc: gorchainRpc, addresses: wallets.filter(w => w.chain === 'gorchain') },
                      { chain: 'solana', rpc: solanaRpc, addresses: wallets.filter(w => w.chain === 'solana') },
                    ]) {
                      if (addresses.length > 0) {
                        const m = await checkBalances(rpc, chain, addresses);
                        allMetrics.push(...m);
                      }
                    }

                    // Push to Prometheus Pushgateway
                    if (allMetrics.length > 0) {
                      const body = allMetrics.join('\n') + '\n';
                      try {
                        const resp = await fetch(`${pushGwUrl}/metrics/job/wallet-balance-monitor`, {
                          method: 'POST',
                          headers: { 'Content-Type': 'text/plain' },
                          body,
                        });
                        if (!resp.ok) console.warn(`Pushgateway returned ${resp.status}`);
                        else console.log('Metrics pushed to Pushgateway.');
                      } catch (err) {
                        // If pushgateway is unavailable, just log metrics to stdout
                        // Prometheus can scrape from logs via loki if configured
                        console.warn(`Pushgateway unavailable: ${err.message}`);
                        console.log('Metrics (stdout fallback):');
                        console.log(body);
                      }
                    }
                  }

                  main().catch(err => { console.error('Fatal:', err); process.exit(1); });
              envFrom:
                - configMapRef:
                    name: chain-config
              env:
                - name: MONITORED_WALLETS
                  valueFrom:
                    configMapKeyRef:
                      name: balance-monitor-config
                      key: MONITORED_WALLETS
                - name: BALANCE_THRESHOLD_SOL
                  valueFrom:
                    configMapKeyRef:
                      name: balance-monitor-config
                      key: BALANCE_THRESHOLD_SOL
                      optional: true
                - name: PUSHGATEWAY_URL
                  value: "http://prometheus-pushgw:9091"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          restartPolicy: OnFailure
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: balance-monitor-config
  namespace: hyperlane-agents
data:
  BALANCE_THRESHOLD_SOL: "1.0"
  # JSON array of wallets to monitor. Populate with actual addresses.
  # Example:
  # [
  #   {"chain":"gorchain","name":"validator","address":"..."},
  #   {"chain":"gorchain","name":"relayer","address":"..."},
  #   {"chain":"solana","name":"validator","address":"..."},
  #   {"chain":"solana","name":"relayer","address":"..."},
  #   {"chain":"gorchain","name":"oracle","address":"..."},
  #   {"chain":"solana","name":"oracle","address":"..."}
  # ]
  MONITORED_WALLETS: "[]"

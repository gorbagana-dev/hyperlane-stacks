---
# Privy API credentials (shared by KMS proxy sidecars and gas oracle)
apiVersion: v1
kind: Secret
metadata:
  name: privy-credentials
  namespace: hyperlane-agents
type: Opaque
stringData:
  PRIVY_APP_ID: "${PRIVY_APP_ID}"
  PRIVY_APP_SECRET: "${PRIVY_APP_SECRET}"
  PRIVY_VALIDATOR_GORCHAIN_WALLET_ID: "${PRIVY_VALIDATOR_GORCHAIN_WALLET_ID}"
  PRIVY_VALIDATOR_SOLANA_WALLET_ID: "${PRIVY_VALIDATOR_SOLANA_WALLET_ID}"
  PRIVY_ORACLE_WALLET_ID: "${PRIVY_ORACLE_WALLET_ID}"
---
# MinIO credentials
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: hyperlane-agents
type: Opaque
stringData:
  MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
  MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
  AWS_ACCESS_KEY_ID: "${MINIO_ACCESS_KEY}"
  AWS_SECRET_ACCESS_KEY: "${MINIO_SECRET_KEY}"
---
# Relayer signing key (hex private key 0x...)
apiVersion: v1
kind: Secret
metadata:
  name: relayer-key
  namespace: hyperlane-agents
type: Opaque
stringData:
  HYP_BASE_CHAINS_GORCHAIN_SIGNER_KEY: "${RELAYER_KEY}"
  HYP_BASE_CHAINS_SOLANATESTNET_SIGNER_KEY: "${RELAYER_KEY}"

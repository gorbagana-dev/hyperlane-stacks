stack: stack_orchestrator/data/stacks/hyperlane-relayer
deploy-to: k8s-kind
namespace: REPLACE_NAMESPACE
kind-cluster-name: REPLACE_KIND_CLUSTER
config:
  GORCHAIN_RPC_URL: "http://gorchain-rpc:8899"
  SOLANA_RPC_URL: "http://solana-rpc:18899"
  GORCHAIN_IGP_PROGRAM_ID: "REPLACE_AT_RUNTIME"
  SOLANA_IGP_PROGRAM_ID: "REPLACE_AT_RUNTIME"
  GORCHAIN_IGP_ACCOUNT: "REPLACE_AT_RUNTIME"
  SOLANA_IGP_ACCOUNT: "REPLACE_AT_RUNTIME"
  CLAIM_INTERVAL_SECONDS: "600"
annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9091"
resources:
  containers:
    agent-config-init:
      reservations:
        cpus: "0.1"
        memory: 64M
      limits:
        cpus: "0.25"
        memory: 128M
    relayer:
      reservations:
        cpus: "0.25"
        memory: 256M
      limits:
        cpus: "1"
        memory: 512M
    igp-fee-claim:
      reservations:
        cpus: "0.1"
        memory: 64M
      limits:
        cpus: "0.25"
        memory: 128M
volumes:
  relayer-data:
  agent-config:
configmaps:
  igp-fee-claim-scripts-config: ./configmaps/igp-fee-claim-scripts-config
secrets:
  hyperlane-relayer-secrets:
    - HYP_CHAINS_GORCHAIN_SIGNER_KEY
    - HYP_CHAINS_SOLANA_SIGNER_KEY
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - RELAYER_KEYPAIR_JSON
image-pull-secret:
  server: ghcr.io
  username: gorbagana-dev
  token-env: GHCR_PAT
external-services:
  gorchain-rpc:
    ip: REPLACE_HOST_IP
    port: 8899
  solana-rpc:
    ip: REPLACE_HOST_IP
    port: 18899

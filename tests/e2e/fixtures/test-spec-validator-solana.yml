stack: stack_orchestrator/data/stacks/hyperlane-validator
deploy-to: k8s-kind
namespace: REPLACE_NAMESPACE
kind-cluster-name: REPLACE_KIND_CLUSTER
config:
  ORIGIN_CHAIN_NAME: solana
  CHECKPOINT_BUCKET: hyperlane-validator-solana
  PRIVY_API_URL: "http://privy-mock:19876"
  PRIVY_WALLET_ID: REPLACE_PRIVY_WALLET_ID
annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
resources:
  containers:
    agent-config-init:
      reservations:
        cpus: "0.1"
        memory: 64M
      limits:
        cpus: "0.25"
        memory: 128M
    validator:
      reservations:
        cpus: "0.25"
        memory: 256M
      limits:
        cpus: "1"
        memory: 512M
    kms-proxy:
      reservations:
        cpus: "0.1"
        memory: 64M
      limits:
        cpus: "0.25"
        memory: 128M
volumes:
  validator-data:
  agent-config:
secrets:
  hyperlane-validator-solana-secrets:
    - PRIVY_APP_ID
    - PRIVY_APP_SECRET
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - HYP_DEFAULTSIGNER_KEY
registry-credentials:
  server: ghcr.io
  username: gorbagana-dev
  token-env: GHCR_PAT

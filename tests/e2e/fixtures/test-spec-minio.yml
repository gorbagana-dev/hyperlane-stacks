stack: stack_orchestrator/data/stacks/hyperlane-minio
deploy-to: k8s-kind
kind-cluster-name: hyperlane
kind-mount-root: /tmp/hyperlane-bridge-e2e
acme-email: e2e@example.test
resources:
  containers:
    minio:
      reservations:
        cpus: "0.1"
        memory: 128M
      limits:
        cpus: "0.5"
        memory: 256M
volumes:
  minio-data:
secrets:
  hyperlane-minio-secrets:
    - MINIO_ROOT_USER
    - MINIO_ROOT_PASSWORD

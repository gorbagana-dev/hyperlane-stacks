stack: stack_orchestrator/data/stacks/hyperlane-minio
deploy-to: k8s-kind
image-overrides:
  minio: minio/minio:RELEASE.2025-09-07T16-13-09Z
  minio-init: minio/mc:RELEASE.2025-08-13T08-35-41Z
kind-cluster-name: hyperlane
kind-mount-root: /tmp/hyperlane-bridge-e2e
resources:
  containers:
    minio:
      reservations:
        cpus: "0.1"
        memory: 128M
      limits:
        cpus: "0.5"
        memory: 256M
volumes:
  minio-data:
secrets:
  hyperlane-minio-secrets:
    keys:
      MINIO_ROOT_USER: { env: MINIO_ROOT_USER }
      MINIO_ROOT_PASSWORD: { env: MINIO_ROOT_PASSWORD }
network:
  acme-email: e2e@example.test
  http-proxy:
    - host-name: minio-s3.test
      routes:
        - path: /
          proxy-to: minio:9000
    - host-name: minio-console.test
      routes:
        - path: /
          proxy-to: minio:9001

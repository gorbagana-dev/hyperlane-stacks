stack: stack_orchestrator/data/stacks/hyperlane-minio
deploy-to: k8s-kind
namespace: REPLACE_NAMESPACE
kind-cluster-name: REPLACE_KIND_CLUSTER
network:
  ports:
    minio:
      - "9000"
      - "9001"
resources:
  containers:
    minio:
      reservations:
        cpus: "0.1"
        memory: 128M
      limits:
        cpus: "0.5"
        memory: 256M
volumes:
  minio-data:
secrets:
  hyperlane-minio-secrets:
    - MINIO_ROOT_USER
    - MINIO_ROOT_PASSWORD

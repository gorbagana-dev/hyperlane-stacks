kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    # Umbrella mount for deployer-Job state. Must match BRIDGE_STATE_ROOT
    # in tests/e2e/conftest.py — SO emits an extraMount with the same
    # hostPath in each deployer's generated kind-config and validates at
    # `deploy start` that the live cluster has the matching bind.
    extraMounts:
      - hostPath: /tmp/hyperlane-bridge-e2e
        containerPath: /mnt
        propagation: HostToContainer

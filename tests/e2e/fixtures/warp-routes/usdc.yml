# E2E warp route: USDC (Solana collateral) <-> gorchain synthetic.
# origin.token is replaced at runtime with a freshly created test SPL mint.
name: USDC-solana-gorchain
origin:
  chain: solana
  type: collateral
  token: "REPLACE_WITH_USDC_MINT_ADDRESS"
  name: "USD Coin"
  symbol: "USDC"
  decimals: 6
remote:
  chain: gorchain
  type: synthetic
  name: "USD Coin"
  symbol: "USDC"
  decimals: 6
# Empty on-chain Token-2022 metadata: e2e gains nothing from it and a non-empty
# value makes the deployer fetch+validate the URL (an external network dependency).
metadataUri: ""
# Token logo shown in the warp-UI (applied to both sides).
logoURI: "https://raw.githubusercontent.com/solana-labs/token-list/main/assets/mainnet/EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v/logo.png"

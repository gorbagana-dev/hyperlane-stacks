stack: stack_orchestrator/data/stacks/hyperlane-svm-warp-deployer
deploy-to: k8s-kind
namespace: laconic-hyperlane-warp-deployer
image-overrides:
  warp-deployer: REPLACE_DEPLOYER_IMAGE
kind-cluster-name: hyperlane
kind-mount-root: /tmp/hyperlane-bridge-e2e
network:
  acme-email: e2e@example.test
volumes:
  bridge-state: REPLACE_KIND_MOUNT_ROOT/bridge/generated
  bridge-logs: REPLACE_KIND_MOUNT_ROOT/bridge/logs
config:
  WARP_ROUTES: "usdc,sol"
  GORCHAIN_RPC_URL: "http://gorchain-rpc:8899"
  GORCHAIN_DOMAIN_ID: "99999"
  SOLANA_DOMAIN_ID: "99998"
  GORCHAIN_CHAIN_ID: "99999"
  SOLANA_CHAIN_ID: "99998"
  GORCHAIN_IS_TESTNET: "true"
  SOLANA_IS_TESTNET: "true"
  FORCE_REDEPLOY: "false"
configmaps:
  warp-deployer-scripts-config: ./configmaps/warp-deployer-scripts-config
  warp-deployer-registry-config: ./configmaps/warp-deployer-registry-config
  warp-routes-config: ./configmaps/warp-routes-config
resources:
  containers:
    warp-deployer:
      reservations:
        cpus: "0.5"
        memory: 512M
      limits:
        cpus: "2"
        memory: 1G
secrets:
  hyperlane-warp-deployer-secrets:
    keys:
      DEPLOYER_KEYPAIR: { env: DEPLOYER_KEYPAIR }
      HARDWARE_WALLET_PUBKEY: { env: HARDWARE_WALLET_PUBKEY }
      SOLANA_RPC_URL: { env: SOLANA_RPC_URL }
image-pull-secret:
  server: ghcr.io
  username: gorbagana-dev
  token-env: GHCR_PAT
external-services:
  gorchain-rpc:
    ip: REPLACE_HOST_IP
    port: 8899
  solana-rpc:
    ip: REPLACE_HOST_IP
    port: 18899

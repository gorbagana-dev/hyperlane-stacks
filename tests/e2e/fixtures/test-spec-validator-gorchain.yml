stack: stack_orchestrator/data/stacks/hyperlane-validator
deploy-to: k8s-kind
namespace: laconic-hyperlane-validator-gorchain
kind-cluster-name: hyperlane
kind-mount-root: /tmp/hyperlane-bridge-e2e
acme-email: e2e@example.test
config:
  ORIGIN_CHAIN_NAME: gorchain
  CHECKPOINT_BUCKET: hyperlane-validator-gorchain
  PRIVY_API_URL: "http://privy-mock:19876"
  PRIVY_WALLET_ID: REPLACE_PRIVY_WALLET_ID
annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
resources:
  containers:
    validator:
      reservations:
        cpus: "0.25"
        memory: 256M
      limits:
        cpus: "1"
        memory: 512M
    kms-proxy:
      reservations:
        cpus: "0.1"
        memory: 64M
      limits:
        cpus: "0.25"
        memory: 128M
volumes:
  validator-data:
configmaps:
  agent-config: ./configmaps/agent-config
secrets:
  hyperlane-validator-gorchain-secrets:
    - PRIVY_APP_ID
    - PRIVY_APP_SECRET
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - HYP_DEFAULTSIGNER_KEY
image-pull-secret:
  server: ghcr.io
  username: gorbagana-dev
  token-env: GHCR_PAT
external-services:
  gorchain-rpc:
    ip: REPLACE_HOST_IP
    port: 8899
  solana-rpc:
    ip: REPLACE_HOST_IP
    port: 18899
  privy-mock:
    ip: REPLACE_HOST_IP
    port: 19876
network:
  http-proxy:
    - host-name: validator-gorchain.test
      routes:
        - path: /
          proxy-to: validator:9090

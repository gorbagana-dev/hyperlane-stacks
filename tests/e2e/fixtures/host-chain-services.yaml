# host-chain-services.yaml — k8s Services + Endpoints pointing to host services
# Template variables: ${HOST_IP}, ${NAMESPACE}
# Applied by cluster.py:apply_host_chain_services()

---
# Gorchain RPC Service (headless, no selector — manually managed Endpoints)
apiVersion: v1
kind: Service
metadata:
  name: gorchain-rpc
  namespace: ${NAMESPACE}
spec:
  ports:
    - port: 8899
      targetPort: 8899
      protocol: TCP
---
# Gorchain RPC Endpoints — points to host IP
apiVersion: v1
kind: Endpoints
metadata:
  name: gorchain-rpc
  namespace: ${NAMESPACE}
subsets:
  - addresses:
      - ip: "${HOST_IP}"
    ports:
      - port: 8899
        protocol: TCP

---
# Solana RPC Service (headless, no selector — manually managed Endpoints)
apiVersion: v1
kind: Service
metadata:
  name: solana-rpc
  namespace: ${NAMESPACE}
spec:
  ports:
    - port: 18899
      targetPort: 18899
      protocol: TCP
---
# Solana RPC Endpoints — points to host IP
apiVersion: v1
kind: Endpoints
metadata:
  name: solana-rpc
  namespace: ${NAMESPACE}
subsets:
  - addresses:
      - ip: "${HOST_IP}"
    ports:
      - port: 18899
        protocol: TCP

---
# Mock Privy server (headless, no selector — manually managed Endpoints)
apiVersion: v1
kind: Service
metadata:
  name: privy-mock
  namespace: ${NAMESPACE}
spec:
  ports:
    - port: 19876
      targetPort: 19876
      protocol: TCP
---
# Mock Privy Endpoints — points to host IP
apiVersion: v1
kind: Endpoints
metadata:
  name: privy-mock
  namespace: ${NAMESPACE}
subsets:
  - addresses:
      - ip: "${HOST_IP}"
    ports:
      - port: 19876
        protocol: TCP

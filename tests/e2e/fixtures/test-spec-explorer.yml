stack: stack_orchestrator/data/stacks/hyperlane-explorer
deploy-to: k8s-kind
kind-cluster-name: hyperlane
kind-mount-root: /tmp/hyperlane-bridge-e2e
network:
  acme-email: e2e@example.test
  http-proxy:
    - host-name: explorer.test
      routes:
        - path: /
          proxy-to: explorer:3000
# The scraper runs in-cluster and reaches the host chains via these services.
external-services:
  gorchain-rpc:
    ip: REPLACE_HOST_IP
    port: 8899
  solana-rpc:
    ip: REPLACE_HOST_IP
    port: 18899
volumes:
  explorer-postgres-data: /tmp/hyperlane-bridge-e2e/explorer/postgres
config:
  # In-cluster RPCs for the scraper (the explorer's browser never calls them).
  # gorchain is also injected into the browser metadata; solana resolves from the
  # registry, so only the scraper needs the in-cluster solana RPC (below).
  GORCHAIN_RPC_URL: "http://gorchain-rpc:8899"
  # The compose wires the scraper's solana RPC via a secret; for e2e inject it
  # directly as the in-cluster URL.
  HYP_CHAINS_SOLANA_CUSTOMRPCURLS: "http://solana-rpc:18899"
  GORCHAIN_DOMAIN_ID: "99999"
  SOLANA_DOMAIN_ID: "99998"
  GORCHAIN_CHAIN_ID: "99999"
  SOLANA_CHAIN_ID: "99998"
  GORCHAIN_CHAIN_NAME: "gorchain"
  SOLANA_CHAIN_NAME: "solana"
  GORCHAIN_IS_TESTNET: "true"
  SOLANA_IS_TESTNET: "true"
  # Test-only credentials (Postgres + Hasura are cluster-internal in e2e).
  POSTGRES_PASSWORD: "e2e-postgres-password"
  HASURA_GRAPHQL_ADMIN_SECRET: "e2e-hasura-admin-secret"
configmaps:
  agent-config: ./configmaps/agent-config
image-pull-secret:
  server: ghcr.io
  username: gorbagana-dev
  token-env: GHCR_PAT
image-overrides:
  explorer: REPLACE_EXPLORER_IMAGE
  scraper: REPLACE_SCRAPER_IMAGE
  hasura: REPLACE_HASURA_IMAGE
resources:
  containers:
    postgres:
      reservations:
        cpus: "0.25"
        memory: 256M
      limits:
        cpus: "0.5"
        memory: 512M
    scraper:
      reservations:
        cpus: "0.25"
        memory: 256M
      limits:
        cpus: "0.5"
        memory: 512M
    hasura:
      reservations:
        cpus: "0.1"
        memory: 128M
      limits:
        cpus: "0.25"
        memory: 256M
    explorer:
      reservations:
        cpus: "0.1"
        memory: 128M
      limits:
        cpus: "0.25"
        memory: 256M
  volumes:
    explorer-postgres-data:
      reservations:
        storage: 2Gi

# ============================================================================
# Input ConfigMaps — operator-provided configuration for the warp deployer.
#
# These must be populated BEFORE running the warp deployer job.
# The core deployer (hyperlane-svm-deployer) must have run first to
# create the hyperlane-program-ids ConfigMap.
# ============================================================================

---
# hyperlane-warp-deployer-config
#
# Warp route parameters: token mint, chain roles, RPC URLs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hyperlane-warp-deployer-config
  labels:
    app.kubernetes.io/name: hyperlane-svm-warp-deployer
    app.kubernetes.io/component: config
data:
  # SPL token mint address (base58) of the pre-existing token to bridge.
  # This token must already be deployed on the collateral chain.
  warp-token-mint: "REPLACE_WITH_TOKEN_MINT_ADDRESS"

  # Which chain holds the collateral (locked tokens) and which
  # chain mints synthetics (wrapped tokens).
  collateral-chain: "gorchain"
  synthetic-chain: "solana"

  # Domain IDs must match core deployment configuration.
  collateral-domain-id: "REPLACE_WITH_COLLATERAL_DOMAIN_ID"
  synthetic-domain-id: "REPLACE_WITH_SYNTHETIC_DOMAIN_ID"

  # RPC endpoints for each chain.
  collateral-chain-rpc-url: "REPLACE_WITH_COLLATERAL_CHAIN_RPC_URL"
  synthetic-chain-rpc-url: "REPLACE_WITH_SYNTHETIC_CHAIN_RPC_URL"

  # Hardware wallet public key for ownership transfer (optional).
  # If set, warp route program upgrade authority is transferred
  # to this key after deployment.
  hardware-wallet-pubkey: ""

  # Set to "true" to force re-deployment even if artifacts already exist.
  force-redeploy: "false"

---
# hyperlane-warp-deployer-token-config
#
# Token configuration file consumed by hyperlane-sealevel-client
# during warp route deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hyperlane-warp-deployer-token-config
  labels:
    app.kubernetes.io/name: hyperlane-svm-warp-deployer
    app.kubernetes.io/component: config
data:
  token-config.json: |
    {
      "type": "collateral",
      "token": "REPLACE_WITH_TOKEN_MINT_ADDRESS",
      "name": "REPLACE_WITH_TOKEN_NAME",
      "symbol": "REPLACE_WITH_TOKEN_SYMBOL",
      "decimals": 6,
      "totalSupply": 0
    }

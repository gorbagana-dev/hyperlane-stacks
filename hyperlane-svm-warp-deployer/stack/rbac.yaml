# ============================================================================
# RBAC — ServiceAccount, Role, and RoleBinding for the warp deployer Job.
#
# The warp deployer needs to:
# 1. Read the hyperlane-program-ids ConfigMap (from core deployer) to get
#    mailbox and other program addresses
# 2. Create/update ConfigMaps for warp route deployment artifacts
# ============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: hyperlane-warp-deployer
  labels:
    app.kubernetes.io/name: hyperlane-svm-warp-deployer
    app.kubernetes.io/component: rbac

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hyperlane-warp-deployer
  labels:
    app.kubernetes.io/name: hyperlane-svm-warp-deployer
    app.kubernetes.io/component: rbac
rules:
  # Read core deployment artifacts (from hyperlane-svm-deployer)
  # Create and update ConfigMaps for warp route artifacts
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Read secrets (for idempotency checks)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hyperlane-warp-deployer
  labels:
    app.kubernetes.io/name: hyperlane-svm-warp-deployer
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: hyperlane-warp-deployer
roleRef:
  kind: Role
  name: hyperlane-warp-deployer
  apiGroup: rbac.authorization.k8s.io

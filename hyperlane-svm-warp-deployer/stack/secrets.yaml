# ============================================================================
# Secrets template for hyperlane-svm-warp-deployer
#
# IMPORTANT: Replace placeholder values before applying. Do NOT commit
# real secret values to version control.
#
# To apply:
#   kubectl create secret generic hyperlane-warp-deployer-secrets \
#     --from-file=deployer-keypair=./deployer-keypair.json
#
# This may use the same deployer keypair as the core deployer, or a
# separate keypair. The key must be funded on both chains.
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: hyperlane-warp-deployer-secrets
  labels:
    app.kubernetes.io/name: hyperlane-svm-warp-deployer
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # deployer-keypair: Solana keypair JSON array for the warp route deployer.
  # Must be funded on both chains for deployment transactions.
  #
  # Format: JSON array of 64 integers, e.g. [174,47,154,...,119,35]
  # Generate with: solana-keygen new --outfile deployer-keypair.json
  deployer-keypair: "REPLACE_WITH_DEPLOYER_KEYPAIR_JSON"

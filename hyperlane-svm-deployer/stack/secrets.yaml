# ============================================================================
# Secrets template for hyperlane-svm-deployer
#
# IMPORTANT: Replace placeholder values before applying. Do NOT commit
# real secret values to version control.
#
# To apply:
#   kubectl create secret generic hyperlane-deployer-secrets \
#     --from-file=deployer-keypair=./deployer-keypair.json
#
# Or use a secrets manager (Sealed Secrets, External Secrets, etc.)
# to populate this secret from an external source.
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: hyperlane-deployer-secrets
  labels:
    app.kubernetes.io/name: hyperlane-svm-deployer
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # deployer-keypair: Solana keypair JSON array for the hot deployer wallet.
  # This key must be pre-funded on both chains (~30+ SOL per chain).
  # The deployer transfers program ownership to the hardware wallet after
  # deployment, making this key safe to discard.
  #
  # Format: JSON array of 64 integers, e.g. [174,47,154,...,119,35]
  # Generate with: solana-keygen new --outfile deployer-keypair.json
  deployer-keypair: "REPLACE_WITH_DEPLOYER_KEYPAIR_JSON"

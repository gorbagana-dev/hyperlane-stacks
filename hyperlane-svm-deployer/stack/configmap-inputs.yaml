# ============================================================================
# Input ConfigMaps — operator-provided configuration for the deployer job.
#
# These must be populated BEFORE running the deployer job. They provide
# chain configuration, gas oracle settings, multisig ISM config, and
# chain registry metadata.
# ============================================================================

---
# hyperlane-deployer-config
#
# Core deployer parameters: RPC URLs, domain IDs, chain IDs, and keys.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hyperlane-deployer-config
  labels:
    app.kubernetes.io/name: hyperlane-svm-deployer
    app.kubernetes.io/component: config
data:
  # RPC endpoints for each chain
  gorchain-rpc-url: "REPLACE_WITH_GORCHAIN_RPC_URL"
  solana-rpc-url: "REPLACE_WITH_SOLANA_RPC_URL"

  # Hyperlane domain IDs (must be unique across all Hyperlane deployments)
  gorchain-domain-id: "REPLACE_WITH_GORCHAIN_DOMAIN_ID"
  solana-domain-id: "REPLACE_WITH_SOLANA_DOMAIN_ID"

  # Chain IDs
  gorchain-chain-id: "REPLACE_WITH_GORCHAIN_CHAIN_ID"
  solana-chain-id: "REPLACE_WITH_SOLANA_CHAIN_ID"

  # Hardware wallet public key for ownership transfer (Solana base58 pubkey).
  # If unset, ownership remains with the deployer key (NOT recommended for production).
  hardware-wallet-pubkey: ""

  # Privy oracle wallet public key for IGP account ownership transfer.
  # If unset, IGP ownership remains with the deployer key.
  igp-oracle-wallet-pubkey: ""

  # Set to "true" to force re-deployment even if artifacts already exist.
  force-redeploy: "false"

---
# hyperlane-deployer-chain-config
#
# Per-chain configuration files consumed by hyperlane-sealevel-client.
# Mount one JSON file per chain.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hyperlane-deployer-chain-config
  labels:
    app.kubernetes.io/name: hyperlane-svm-deployer
    app.kubernetes.io/component: config
data:
  gorchain.json: |
    {
      "name": "gorchain",
      "chainId": 0,
      "domainId": 0,
      "protocol": "sealevel",
      "rpcUrls": [{"http": "REPLACE_WITH_GORCHAIN_RPC_URL"}],
      "nativeToken": {"decimals": 9}
    }
  solana.json: |
    {
      "name": "solana",
      "chainId": 0,
      "domainId": 0,
      "protocol": "sealevel",
      "rpcUrls": [{"http": "REPLACE_WITH_SOLANA_RPC_URL"}],
      "nativeToken": {"decimals": 9}
    }

---
# hyperlane-deployer-gas-oracle-config
#
# Initial gas oracle values used during IGP configuration.
# Updated post-deploy by the gas oracle CronJob in the agents stack.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hyperlane-deployer-gas-oracle-config
  labels:
    app.kubernetes.io/name: hyperlane-svm-deployer
    app.kubernetes.io/component: config
data:
  gas-oracle-configs.json: |
    [
      {
        "domain": 0,
        "token_exchange_rate": 1000000000,
        "gas_price": 1,
        "token_decimals": 9
      }
    ]

---
# hyperlane-deployer-multisig-config
#
# Multisig ISM validator sets per chain. For v1: 1-of-1 per chain.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hyperlane-deployer-multisig-config
  labels:
    app.kubernetes.io/name: hyperlane-svm-deployer
    app.kubernetes.io/component: config
data:
  gorchain-multisig.json: |
    {
      "validators": ["REPLACE_WITH_GORCHAIN_VALIDATOR_ADDRESS"],
      "threshold": 1
    }
  solana-multisig.json: |
    {
      "validators": ["REPLACE_WITH_SOLANA_VALIDATOR_ADDRESS"],
      "threshold": 1
    }

---
# hyperlane-deployer-registry-config
#
# Chain registry metadata (metadata.yaml format).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hyperlane-deployer-registry-config
  labels:
    app.kubernetes.io/name: hyperlane-svm-deployer
    app.kubernetes.io/component: config
data:
  metadata.yaml: |
    chains:
      gorchain:
        name: gorchain
        chainId: 0
        domainId: 0
        protocol: sealevel
        rpcUrls:
          - http: "REPLACE_WITH_GORCHAIN_RPC_URL"
        nativeToken:
          name: GOR
          symbol: GOR
          decimals: 9
      solana:
        name: solana
        chainId: 0
        domainId: 0
        protocol: sealevel
        rpcUrls:
          - http: "REPLACE_WITH_SOLANA_RPC_URL"
        nativeToken:
          name: SOL
          symbol: SOL
          decimals: 9

[tool.ruff]
target-version = "py310"
line-length = 120

exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    ".eggs",
    "*.egg-info",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["lib"]

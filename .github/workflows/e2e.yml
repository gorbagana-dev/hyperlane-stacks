name: E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git credentials for private gorbagana-dev repos
        run: git config --global url."https://x-access-token:${{ secrets.CICD_REPO_TOKEN }}@github.com/gorbagana-dev/".insteadOf "https://github.com/gorbagana-dev/"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          cd tests/e2e
          pip install -r requirements.txt
          playwright install chromium

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      # TODO: Switch to published binary once stack-orchestrator package publishing is fixed:
      #   curl -L -o ~/bin/laconic-so https://git.vdb.to/cerc-io/stack-orchestrator/releases/download/latest/laconic-so
      - name: Build laconic-so from source
        run: |
          git clone https://github.com/cerc-io/stack-orchestrator.git /tmp/stack-orchestrator
          cd /tmp/stack-orchestrator
          python3 -m venv venv
          source venv/bin/activate
          pip install shiv
          pip install -r requirements.txt
          ./scripts/create_build_tag_file.sh
          shiv -c laconic-so -o laconic-so .
          mkdir -p ~/bin
          cp laconic-so ~/bin/laconic-so
          echo "$HOME/bin" >> $GITHUB_PATH
          deactivate

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Foundry (cast)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run E2E tests
        env:
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd tests/e2e
          xvfb-run pytest -v -x

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            tests/e2e/.logs/
            tests/e2e/.deployments/
            /tmp/solana-test-ledger/validator.log
          retention-days: 7
          include-hidden-files: true

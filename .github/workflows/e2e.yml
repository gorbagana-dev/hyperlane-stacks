name: E2E Tests

on:
  workflow_dispatch:

env:
  LACONIC_SO_VERSION: v1.1.0-b3e9366-202605111309

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git credentials for private gorbagana-dev repos
        run: git config --global url."https://x-access-token:${{ secrets.CICD_REPO_TOKEN }}@github.com/gorbagana-dev/".insteadOf "https://github.com/gorbagana-dev/"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          cd tests/e2e
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Install laconic-so
        run: |
          mkdir -p ~/bin
          curl -L -o ~/bin/laconic-so https://github.com/cerc-io/stack-orchestrator/releases/download/${{ env.LACONIC_SO_VERSION }}/laconic-so
          chmod +x ~/bin/laconic-so
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Foundry (cast)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install mkcert
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          curl -L -o /tmp/mkcert \
            https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64
          sudo install /tmp/mkcert /usr/local/bin/mkcert
          mkcert -install

      - name: Run E2E tests
        env:
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
          # Force HTTPS fetch for laconic-so fetch-stack; the workflow's
          # git insteadOf rewrite (above) supplies the PAT. SSH would fail
          # on the runner because no key is configured.
          E2E_GIT_HTTPS: "1"
        run: |
          cd tests/e2e
          xvfb-run pytest -v -x

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            tests/e2e/.logs/
            tests/e2e/.deployments/
            tests/e2e/.data/test-validator-solana.stderr
            tests/e2e/.data/test-ledger-solana/validator.log
          retention-days: 7
          include-hidden-files: true

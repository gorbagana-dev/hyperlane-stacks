# TODO: Change trigger to run on releases instead of textfile changes
name: Build and Publish Images

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-publish-deployer.txt'
      - '.github/trigger-publish-agent.txt'
      - '.github/trigger-publish-kms-proxy.txt'
  workflow_dispatch:

env:
  REGISTRY: git.vdb.to
  REGISTRY_ORG: laconicnetwork

jobs:
  build-deployer:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.modified, '.github/trigger-publish-deployer.txt')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE_NAME: laconic/hyperlane-svm-deployer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to registry
        run: echo ${{ secrets.CICD_PUBLISH_TOKEN }} | docker login https://git.vdb.to -u laconiccicd --password-stdin

      - name: Install laconic-so
        run: |
          mkdir -p ~/bin
          curl -L -o ~/bin/laconic-so https://git.vdb.to/cerc-io/stack-orchestrator/releases/download/latest/laconic-so
          chmod +x ~/bin/laconic-so
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Enable containers in stack.yml for building
        run: |
          STACK_YML="$(pwd)/stack_orchestrator/data/stacks/hyperlane-svm-deployer/stack.yml"
          sed -i 's/^# containers:/containers:/' "$STACK_YML"
          sed -i 's/^#   - laconic/  - laconic/' "$STACK_YML"

      - name: Setup repositories
        run: laconic-so --stack $(pwd)/stack_orchestrator/data/stacks/hyperlane-svm-deployer setup-repositories

      - name: Build container image
        run: laconic-so --stack $(pwd)/stack_orchestrator/data/stacks/hyperlane-svm-deployer build-containers

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "tag=${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Tag and push image
        run: |
          LOCAL_IMAGE="${IMAGE_NAME}:local"
          REMOTE_TAG="${REGISTRY}/${REGISTRY_ORG}/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"
          REMOTE_LATEST="${REGISTRY}/${REGISTRY_ORG}/${IMAGE_NAME}:latest"

          docker tag "${LOCAL_IMAGE}" "${REMOTE_TAG}"
          docker tag "${LOCAL_IMAGE}" "${REMOTE_LATEST}"

          docker push "${REMOTE_TAG}"
          docker push "${REMOTE_LATEST}"

          echo "Published: ${REMOTE_TAG}"
          echo "Published: ${REMOTE_LATEST}"

  build-agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.modified, '.github/trigger-publish-agent.txt')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE_NAME: laconic/hyperlane-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to registry
        run: echo ${{ secrets.CICD_PUBLISH_TOKEN }} | docker login https://git.vdb.to -u laconiccicd --password-stdin

      - name: Install laconic-so
        run: |
          mkdir -p ~/bin
          curl -L -o ~/bin/laconic-so https://git.vdb.to/cerc-io/stack-orchestrator/releases/download/latest/laconic-so
          chmod +x ~/bin/laconic-so
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Enable containers in stack.yml for building
        run: |
          STACK_YML="$(pwd)/stack_orchestrator/data/stacks/hyperlane-validator/stack.yml"
          sed -i 's/^# containers:/containers:/' "$STACK_YML"
          sed -i 's/^#   - laconic/  - laconic/' "$STACK_YML"
          sed -i 's/^#   #/  #/' "$STACK_YML"

      - name: Setup repositories
        run: laconic-so --stack $(pwd)/stack_orchestrator/data/stacks/hyperlane-validator setup-repositories

      - name: Build agent image
        run: laconic-so --stack $(pwd)/stack_orchestrator/data/stacks/hyperlane-validator build-containers --include laconic/hyperlane-agent

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "tag=${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Tag and push agent image
        run: |
          LOCAL_IMAGE="${IMAGE_NAME}:local"
          REMOTE_TAG="${REGISTRY}/${REGISTRY_ORG}/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"
          REMOTE_LATEST="${REGISTRY}/${REGISTRY_ORG}/${IMAGE_NAME}:latest"

          docker tag "${LOCAL_IMAGE}" "${REMOTE_TAG}"
          docker tag "${LOCAL_IMAGE}" "${REMOTE_LATEST}"

          docker push "${REMOTE_TAG}"
          docker push "${REMOTE_LATEST}"

          echo "Published: ${REMOTE_TAG}"
          echo "Published: ${REMOTE_LATEST}"

  build-kms-proxy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.modified, '.github/trigger-publish-kms-proxy.txt')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: laconic/hyperlane-kms-proxy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to registry
        run: echo ${{ secrets.CICD_PUBLISH_TOKEN }} | docker login https://git.vdb.to -u laconiccicd --password-stdin

      - name: Install laconic-so
        run: |
          mkdir -p ~/bin
          curl -L -o ~/bin/laconic-so https://git.vdb.to/cerc-io/stack-orchestrator/releases/download/latest/laconic-so
          chmod +x ~/bin/laconic-so
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Enable containers in stack.yml for building
        run: |
          STACK_YML="$(pwd)/stack_orchestrator/data/stacks/hyperlane-validator/stack.yml"
          sed -i 's/^# containers:/containers:/' "$STACK_YML"
          sed -i 's/^#   - laconic/  - laconic/' "$STACK_YML"
          sed -i 's/^#   #/  #/' "$STACK_YML"

      - name: Build kms-proxy image
        run: laconic-so --stack $(pwd)/stack_orchestrator/data/stacks/hyperlane-validator build-containers --include laconic/hyperlane-kms-proxy

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "tag=${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Tag and push image
        run: |
          LOCAL_IMAGE="${IMAGE_NAME}:local"
          REMOTE_TAG="${REGISTRY}/${REGISTRY_ORG}/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"
          REMOTE_LATEST="${REGISTRY}/${REGISTRY_ORG}/${IMAGE_NAME}:latest"

          docker tag "${LOCAL_IMAGE}" "${REMOTE_TAG}"
          docker tag "${LOCAL_IMAGE}" "${REMOTE_LATEST}"

          docker push "${REMOTE_TAG}"
          docker push "${REMOTE_LATEST}"

          echo "Published: ${REMOTE_TAG}"
          echo "Published: ${REMOTE_LATEST}"

# TODO: Change trigger to run on releases instead of textfile changes
name: Build and Publish Images

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-publish-deployer.txt'
      - '.github/trigger-publish-agent.txt'
      - '.github/trigger-publish-kms-proxy.txt'
      - '.github/trigger-publish-warp-ui.txt'
      - '.github/trigger-publish-gas-oracle.txt'
  workflow_dispatch:

env:
  LACONIC_SO_VERSION: v1.1.0-0bf1ea7-202604021227

jobs:
  # Detect which trigger files changed — works reliably with squash merges,
  # unlike github.event.head_commit.modified which only sees the last commit.
  changes:
    runs-on: ubuntu-latest
    outputs:
      deployer: ${{ steps.check.outputs.deployer }}
      agent: ${{ steps.check.outputs.agent }}
      kms-proxy: ${{ steps.check.outputs.kms-proxy }}
      warp-ui: ${{ steps.check.outputs.warp-ui }}
      gas-oracle: ${{ steps.check.outputs.gas-oracle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1)
          echo "deployer=$(echo "$CHANGED" | grep -qF trigger-publish-deployer.txt && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "agent=$(echo "$CHANGED" | grep -qF trigger-publish-agent.txt && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "kms-proxy=$(echo "$CHANGED" | grep -qF trigger-publish-kms-proxy.txt && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "warp-ui=$(echo "$CHANGED" | grep -qF trigger-publish-warp-ui.txt && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "gas-oracle=$(echo "$CHANGED" | grep -qF trigger-publish-gas-oracle.txt && echo true || echo false)" >> $GITHUB_OUTPUT

  build-deployer:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.deployer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: gorbagana-dev/hyperlane-svm-deployer:local
      REMOTE_IMAGE: ghcr.io/${{ github.repository_owner }}/hyperlane-svm-deployer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install laconic-so
        run: |
          mkdir -p ~/bin
          curl -L -o ~/bin/laconic-so https://git.vdb.to/cerc-io/stack-orchestrator/releases/download/${{ env.LACONIC_SO_VERSION }}/laconic-so
          chmod +x ~/bin/laconic-so
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Enable containers in stack.yml for building
        run: |
          STACK_YML="$(pwd)/stack_orchestrator/data/stacks/hyperlane-svm-deployer/stack.yml"
          sed -i 's/^# containers:/containers:/' "$STACK_YML"
          sed -i 's/^#   - gorbagana-dev/  - gorbagana-dev/' "$STACK_YML"

      - name: Setup repositories
        run: laconic-so --stack $(pwd)/stack_orchestrator/data/stacks/hyperlane-svm-deployer setup-repositories

      - name: Build container image
        run: laconic-so --stack $(pwd)/stack_orchestrator/data/stacks/hyperlane-svm-deployer build-containers

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "tag=${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Tag and push image
        run: |
          REMOTE_TAG="${REMOTE_IMAGE}:${{ steps.tag.outputs.tag }}"
          REMOTE_LATEST="${REMOTE_IMAGE}:latest"

          docker tag "${LOCAL_IMAGE}" "${REMOTE_TAG}"
          docker tag "${LOCAL_IMAGE}" "${REMOTE_LATEST}"

          docker push "${REMOTE_TAG}"
          docker push "${REMOTE_LATEST}"

          echo "Published: ${REMOTE_TAG}"
          echo "Published: ${REMOTE_LATEST}"

  build-agent:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: gorbagana-dev/hyperlane-agent:local
      REMOTE_IMAGE: ghcr.io/${{ github.repository_owner }}/hyperlane-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install laconic-so
        run: |
          mkdir -p ~/bin
          curl -L -o ~/bin/laconic-so https://git.vdb.to/cerc-io/stack-orchestrator/releases/download/${{ env.LACONIC_SO_VERSION }}/laconic-so
          chmod +x ~/bin/laconic-so
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Enable containers in stack.yml for building
        run: |
          STACK_YML="$(pwd)/stack_orchestrator/data/stacks/hyperlane-validator/stack.yml"
          sed -i 's/^# containers:/containers:/' "$STACK_YML"
          sed -i 's/^#   - gorbagana-dev/  - gorbagana-dev/' "$STACK_YML"
          sed -i 's/^#   #/  #/' "$STACK_YML"

      - name: Setup repositories
        run: laconic-so --stack $(pwd)/stack_orchestrator/data/stacks/hyperlane-validator setup-repositories

      - name: Build agent image
        run: laconic-so --stack $(pwd)/stack_orchestrator/data/stacks/hyperlane-validator build-containers --include gorbagana-dev/hyperlane-agent

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "tag=${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Tag and push agent image
        run: |
          REMOTE_TAG="${REMOTE_IMAGE}:${{ steps.tag.outputs.tag }}"
          REMOTE_LATEST="${REMOTE_IMAGE}:latest"

          docker tag "${LOCAL_IMAGE}" "${REMOTE_TAG}"
          docker tag "${LOCAL_IMAGE}" "${REMOTE_LATEST}"

          docker push "${REMOTE_TAG}"
          docker push "${REMOTE_LATEST}"

          echo "Published: ${REMOTE_TAG}"
          echo "Published: ${REMOTE_LATEST}"

  build-kms-proxy:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kms-proxy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: gorbagana-dev/hyperlane-kms-proxy:local
      REMOTE_IMAGE: ghcr.io/${{ github.repository_owner }}/hyperlane-kms-proxy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install laconic-so
        run: |
          mkdir -p ~/bin
          curl -L -o ~/bin/laconic-so https://git.vdb.to/cerc-io/stack-orchestrator/releases/download/${{ env.LACONIC_SO_VERSION }}/laconic-so
          chmod +x ~/bin/laconic-so
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Enable containers in stack.yml for building
        run: |
          STACK_YML="$(pwd)/stack_orchestrator/data/stacks/hyperlane-validator/stack.yml"
          sed -i 's/^# containers:/containers:/' "$STACK_YML"
          sed -i 's/^#   - gorbagana-dev/  - gorbagana-dev/' "$STACK_YML"
          sed -i 's/^#   #/  #/' "$STACK_YML"

      - name: Build kms-proxy image
        run: laconic-so --stack $(pwd)/stack_orchestrator/data/stacks/hyperlane-validator build-containers --include gorbagana-dev/hyperlane-kms-proxy

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "tag=${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Tag and push image
        run: |
          REMOTE_TAG="${REMOTE_IMAGE}:${{ steps.tag.outputs.tag }}"
          REMOTE_LATEST="${REMOTE_IMAGE}:latest"

          docker tag "${LOCAL_IMAGE}" "${REMOTE_TAG}"
          docker tag "${LOCAL_IMAGE}" "${REMOTE_LATEST}"

          docker push "${REMOTE_TAG}"
          docker push "${REMOTE_LATEST}"

          echo "Published: ${REMOTE_TAG}"
          echo "Published: ${REMOTE_LATEST}"

  build-warp-ui:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.warp-ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: gorbagana-dev/hyperlane-warp-ui:local
      REMOTE_IMAGE: ghcr.io/${{ github.repository_owner }}/hyperlane-warp-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install laconic-so
        run: |
          mkdir -p ~/bin
          curl -L -o ~/bin/laconic-so https://git.vdb.to/cerc-io/stack-orchestrator/releases/download/${{ env.LACONIC_SO_VERSION }}/laconic-so
          chmod +x ~/bin/laconic-so
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Enable containers in stack.yml for building
        run: |
          STACK_YML="$(pwd)/stack_orchestrator/data/stacks/hyperlane-warp-ui/stack.yml"
          sed -i 's/^# containers:/containers:/' "$STACK_YML"
          sed -i 's/^#   - gorbagana-dev/  - gorbagana-dev/' "$STACK_YML"

      - name: Setup repositories
        run: laconic-so --stack $(pwd)/stack_orchestrator/data/stacks/hyperlane-warp-ui setup-repositories

      - name: Build warp-ui image
        run: laconic-so --stack $(pwd)/stack_orchestrator/data/stacks/hyperlane-warp-ui build-containers

      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "tag=${TIMESTAMP}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Tag and push image
        run: |
          REMOTE_TAG="${REMOTE_IMAGE}:${{ steps.tag.outputs.tag }}"
          REMOTE_LATEST="${REMOTE_IMAGE}:latest"

          docker tag "${LOCAL_IMAGE}" "${REMOTE_TAG}"
          docker tag "${LOCAL_IMAGE}" "${REMOTE_LATEST}"

          docker push "${REMOTE_TAG}"
          docker push "${REMOTE_LATEST}"

          echo "Published: ${REMOTE_TAG}"
          echo "Published: ${REMOTE_LATEST}"

  build-gas-oracle:
    needs: changes
    if: >-

# restore-job.yaml
# Reconfigures ISM back to real validator addresses and scales agents up.
# Outputs unsigned transactions for operator to sign with hardware wallet.
#
# Operator workflow:
#   1. kubectl create -f restore-job.yaml
#   2. Wait for job completion: kubectl wait --for=condition=complete job/restore
#   3. Retrieve unsigned txs: kubectl cp restore-<pod>:/output/ ./restore-txs/
#   4. Review each .summary.txt file
#   5. Sign: solana sign-offloaded-transaction restore-txs/restore-gorchain-01.json --signer usb://ledger
#   6. Submit: solana send-signed-transaction restore-txs/restore-gorchain-01.json --url $GORCHAIN_RPC_URL
#   7. Repeat for all tx files — agents will resume processing once scaled up
apiVersion: batch/v1
kind: Job
metadata:
  name: restore
  labels:
    app.kubernetes.io/name: hyperlane-svm-ops
    app.kubernetes.io/component: restore
  annotations:
    description: |
      Restore bridge after kill switch — reconfigures ISM to real validator
      addresses on both chains and scales agents back up. Messages dispatched
      during the pause will be delivered once agents resume.
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restore
          image: hyperlane-svm-deployer:local
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              OUTPUT_DIR="/output"
              CLIENT="hyperlane-sealevel-client"
              mkdir -p "${OUTPUT_DIR}"

              log() { echo "[restore] $(date -u +%Y-%m-%dT%H:%M:%SZ) $*"; }

              # Validate required env
              for var in GORCHAIN_VALIDATOR_ADDRESS SOLANA_VALIDATOR_ADDRESS HARDWARE_WALLET_PUBKEY; do
                [[ -n "${!var:-}" ]] || { log "FATAL: ${var} not set"; exit 1; }
              done

              # Load program IDs
              GORCHAIN_ISM_ID="$(jq -r '.multisig_ism_message_id // .ism' /config/program-ids/gorchain-program-ids.json)"
              SOLANA_ISM_ID="$(jq -r '.multisig_ism_message_id // .ism' /config/program-ids/solanasvm-program-ids.json)"

              log "Restoring ISM configuration..."
              log "Gorchain ISM: ${GORCHAIN_ISM_ID} -> validator ${SOLANA_VALIDATOR_ADDRESS}"
              log "Solana ISM:   ${SOLANA_ISM_ID} -> validator ${GORCHAIN_VALIDATOR_ADDRESS}"

              # Step 1: Build unsigned ISM restore transactions
              # Gorchain — restore real Solana validator
              log "Building unsigned tx: restore ISM on Gorchain..."
              ${CLIENT} --url "${GORCHAIN_RPC_URL}" \
                multisig-ism set \
                --program-id "${GORCHAIN_ISM_ID}" \
                --authority "${HARDWARE_WALLET_PUBKEY}" \
                --domain "${SOLANA_DOMAIN_ID}" \
                --validators "${SOLANA_VALIDATOR_ADDRESS}" \
                --threshold 1 \
                --output-unsigned-tx "${OUTPUT_DIR}/restore-gorchain-01.json" \
                2>&1 || true

              cat > "${OUTPUT_DIR}/restore-gorchain-01.summary.txt" <<SUMMARY
              Operation: Restore — Gorchain ISM Reconfiguration
              Program:   ${GORCHAIN_ISM_ID}
              Action:    Set Multisig ISM validators back to real address for remote domain ${SOLANA_DOMAIN_ID}
              Validators: ${SOLANA_VALIDATOR_ADDRESS}
              Threshold:  1
              Effect:     Re-enables message delivery FROM Solana TO Gorchain
              Signer:     ${HARDWARE_WALLET_PUBKEY} (hardware wallet — ISM owner)

              To sign:  solana sign-offloaded-transaction restore-gorchain-01.json --signer usb://ledger
              To submit: solana send-signed-transaction restore-gorchain-01.json --url ${GORCHAIN_RPC_URL}
              SUMMARY

              # Solana — restore real Gorchain validator
              log "Building unsigned tx: restore ISM on Solana..."
              ${CLIENT} --url "${SOLANA_RPC_URL}" \
                multisig-ism set \
                --program-id "${SOLANA_ISM_ID}" \
                --authority "${HARDWARE_WALLET_PUBKEY}" \
                --domain "${GORCHAIN_DOMAIN_ID}" \
                --validators "${GORCHAIN_VALIDATOR_ADDRESS}" \
                --threshold 1 \
                --output-unsigned-tx "${OUTPUT_DIR}/restore-solana-01.json" \
                2>&1 || true

              cat > "${OUTPUT_DIR}/restore-solana-01.summary.txt" <<SUMMARY
              Operation: Restore — Solana ISM Reconfiguration
              Program:   ${SOLANA_ISM_ID}
              Action:    Set Multisig ISM validators back to real address for remote domain ${GORCHAIN_DOMAIN_ID}
              Validators: ${GORCHAIN_VALIDATOR_ADDRESS}
              Threshold:  1
              Effect:     Re-enables message delivery FROM Gorchain TO Solana
              Signer:     ${HARDWARE_WALLET_PUBKEY} (hardware wallet — ISM owner)

              To sign:  solana sign-offloaded-transaction restore-solana-01.json --signer usb://ledger
              To submit: solana send-signed-transaction restore-solana-01.json --url ${SOLANA_RPC_URL}
              SUMMARY

              log "Unsigned transactions written to ${OUTPUT_DIR}/"
              ls -la "${OUTPUT_DIR}/"

              # Step 2: Scale agents back up (after operator signs and submits ISM txs)
              log ""
              log "NEXT STEPS:"
              log "  1. Sign and submit the unsigned transactions above"
              log "  2. Then scale agents back up:"
              log "     kubectl scale deployment hyperlane-validator-gorchain --replicas=1"
              log "     kubectl scale deployment hyperlane-validator-solana --replicas=1"
              log "     kubectl scale deployment hyperlane-relayer --replicas=1"
              log ""
              log "Messages dispatched during the pause will be delivered once agents resume."
          env:
            - name: GORCHAIN_RPC_URL
              valueFrom:
                configMapKeyRef:
                  name: hyperlane-chain-config
                  key: gorchain-rpc-url
            - name: SOLANA_RPC_URL
              valueFrom:
                configMapKeyRef:
                  name: hyperlane-chain-config
                  key: solana-rpc-url
            - name: GORCHAIN_DOMAIN_ID
              value: "99999"
            - name: SOLANA_DOMAIN_ID
              value: "99998"
            - name: HARDWARE_WALLET_PUBKEY
              valueFrom:
                secretKeyRef:
                  name: hyperlane-ops-keys
                  key: hardware-wallet-pubkey
            - name: GORCHAIN_VALIDATOR_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: hyperlane-multisig-config
                  key: gorchain-validator-address
            - name: SOLANA_VALIDATOR_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: hyperlane-multisig-config
                  key: solana-validator-address
          volumeMounts:
            - name: program-ids
              mountPath: /config/program-ids
              readOnly: true
            - name: output
              mountPath: /output
      volumes:
        - name: program-ids
          configMap:
            name: hyperlane-program-ids
        - name: output
          emptyDir: {}

# verify-ownership-job.yaml
# Read-only verification: confirms all programs are owned by correct keys post-deploy.
# No hardware wallet signing required — this is purely informational.
#
# Usage:
#   kubectl create -f verify-ownership-job.yaml
#   kubectl logs job/verify-ownership
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-ownership
  labels:
    app.kubernetes.io/name: hyperlane-svm-ops
    app.kubernetes.io/component: verify-ownership
  annotations:
    description: |
      Read-only job that verifies all deployed programs have correct ownership:
      - Program upgrade authority → HARDWARE_WALLET_PUBKEY
      - IGP account owner → IGP_ORACLE_PUBKEY
      Exits non-zero if any ownership is incorrect.
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: verify-ownership
          image: hyperlane-svm-deployer:local
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              CLIENT="hyperlane-sealevel-client"
              PASS=0
              FAIL=0

              log() { echo "[verify] $(date -u +%Y-%m-%dT%H:%M:%SZ) $*"; }

              check_upgrade_authority() {
                local chain_name="$1"
                local rpc_url="$2"
                local prog_key="$3"
                local prog_id="$4"
                local expected_authority="$5"

                local actual_authority
                actual_authority="$(solana program show "${prog_id}" --url "${rpc_url}" --output json 2>/dev/null \
                  | jq -r '.authority // "NONE"')" || actual_authority="ERROR"

                if [[ "${actual_authority}" == "${expected_authority}" ]]; then
                  log "  PASS: ${chain_name}/${prog_key} upgrade authority = ${actual_authority}"
                  PASS=$((PASS + 1))
                else
                  log "  FAIL: ${chain_name}/${prog_key} upgrade authority"
                  log "    Expected: ${expected_authority}"
                  log "    Actual:   ${actual_authority}"
                  FAIL=$((FAIL + 1))
                fi
              }

              verify_chain() {
                local chain_name="$1"
                local rpc_url="$2"
                local programs_file="$3"

                log "======================================"
                log "Verifying ownership on ${chain_name}"
                log "======================================"

                local prog_keys
                prog_keys="$(jq -r 'keys[]' "${programs_file}")"

                for prog_key in ${prog_keys}; do
                  local prog_id
                  prog_id="$(jq -r ".${prog_key}" "${programs_file}")"

                  # All programs should have upgrade authority = hardware wallet
                  check_upgrade_authority "${chain_name}" "${rpc_url}" \
                    "${prog_key}" "${prog_id}" "${HARDWARE_WALLET_PUBKEY}"
                done

                # Verify IGP account ownership → oracle wallet
                local igp_id
                igp_id="$(jq -r '.igp // .interchain_gas_paymaster // empty' "${programs_file}")"
                if [[ -n "${igp_id}" && -n "${IGP_ORACLE_PUBKEY:-}" ]]; then
                  log "  Checking IGP account owner..."
                  local igp_owner
                  igp_owner="$(${CLIENT} --url "${rpc_url}" \
                    igp get-owner --program-id "${igp_id}" 2>/dev/null || echo "ERROR")"

                  if echo "${igp_owner}" | grep -q "${IGP_ORACLE_PUBKEY}"; then
                    log "  PASS: ${chain_name}/igp account owner = ${IGP_ORACLE_PUBKEY}"
                    PASS=$((PASS + 1))
                  else
                    log "  FAIL: ${chain_name}/igp account owner"
                    log "    Expected: ${IGP_ORACLE_PUBKEY}"
                    log "    Actual:   ${igp_owner}"
                    FAIL=$((FAIL + 1))
                  fi
                fi
              }

              verify_chain "gorchain" "${GORCHAIN_RPC_URL}" \
                /config/program-ids/gorchain-program-ids.json

              verify_chain "solanasvm" "${SOLANA_RPC_URL}" \
                /config/program-ids/solanasvm-program-ids.json

              log ""
              log "======================================"
              log "Results: ${PASS} passed, ${FAIL} failed"
              log "======================================"

              if [[ "${FAIL}" -gt 0 ]]; then
                log "OWNERSHIP VERIFICATION FAILED"
                exit 1
              else
                log "All ownership checks passed"
              fi
          env:
            - name: GORCHAIN_RPC_URL
              valueFrom:
                configMapKeyRef:
                  name: hyperlane-chain-config
                  key: gorchain-rpc-url
            - name: SOLANA_RPC_URL
              valueFrom:
                configMapKeyRef:
                  name: hyperlane-chain-config
                  key: solana-rpc-url
            - name: HARDWARE_WALLET_PUBKEY
              valueFrom:
                secretKeyRef:
                  name: hyperlane-ops-keys
                  key: hardware-wallet-pubkey
            - name: IGP_ORACLE_PUBKEY
              valueFrom:
                secretKeyRef:
                  name: hyperlane-ops-keys
                  key: igp-oracle-pubkey
          volumeMounts:
            - name: program-ids
              mountPath: /config/program-ids
              readOnly: true
      volumes:
        - name: program-ids
          configMap:
            name: hyperlane-program-ids

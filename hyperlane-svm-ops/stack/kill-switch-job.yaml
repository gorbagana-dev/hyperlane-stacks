# kill-switch-job.yaml
# Scales agents to 0 and reconfigures Multisig ISM to null validator on both chains.
# Outputs unsigned transactions for operator to sign with hardware wallet.
#
# Operator workflow:
#   1. kubectl create -f kill-switch-job.yaml
#   2. Wait for job completion: kubectl wait --for=condition=complete job/kill-switch
#   3. Retrieve unsigned txs: kubectl cp kill-switch-<pod>:/output/ ./kill-txs/
#   4. Review each .summary.txt file
#   5. Sign: solana sign-offloaded-transaction kill-txs/kill-gorchain-01.json --signer usb://ledger
#   6. Submit: solana send-signed-transaction kill-txs/kill-gorchain-01.json --url $GORCHAIN_RPC_URL
#   7. Repeat for all tx files
apiVersion: batch/v1
kind: Job
metadata:
  name: kill-switch
  labels:
    app.kubernetes.io/name: hyperlane-svm-ops
    app.kubernetes.io/component: kill-switch
  annotations:
    description: |
      Emergency kill switch — reconfigures ISM to null validator (0x000...000)
      on both chains, making message delivery impossible even by third-party relayers.
      Requires hardware wallet signature for ISM owner transactions.
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kill-switch
          image: hyperlane-svm-deployer:local
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              NULL_VALIDATOR="0x0000000000000000000000000000000000000000"
              OUTPUT_DIR="/output"
              CLIENT="hyperlane-sealevel-client"
              mkdir -p "${OUTPUT_DIR}"

              log() { echo "[kill-switch] $(date -u +%Y-%m-%dT%H:%M:%SZ) $*"; }

              # Load program IDs
              GORCHAIN_ISM_ID="$(jq -r '.multisig_ism_message_id // .ism' /config/program-ids/gorchain-program-ids.json)"
              SOLANA_ISM_ID="$(jq -r '.multisig_ism_message_id // .ism' /config/program-ids/solanasvm-program-ids.json)"

              log "Gorchain ISM: ${GORCHAIN_ISM_ID}"
              log "Solana ISM:   ${SOLANA_ISM_ID}"

              # Step 1: Scale agents to 0
              log "Scaling agent deployments to 0..."
              if kubectl get deployment hyperlane-validator-gorchain &>/dev/null; then
                kubectl scale deployment hyperlane-validator-gorchain --replicas=0
                kubectl scale deployment hyperlane-validator-solana --replicas=0
                kubectl scale deployment hyperlane-relayer --replicas=0
                log "Agents scaled to 0"
              else
                log "WARNING: Agent deployments not found — may already be scaled down or in different namespace"
              fi

              # Step 2: Build unsigned ISM reconfiguration transactions
              # Gorchain — set ISM validators to null
              log "Building unsigned tx: reconfigure ISM on Gorchain..."
              ${CLIENT} --url "${GORCHAIN_RPC_URL}" \
                multisig-ism set \
                --program-id "${GORCHAIN_ISM_ID}" \
                --authority "${HARDWARE_WALLET_PUBKEY}" \
                --domain "${SOLANA_DOMAIN_ID}" \
                --validators "${NULL_VALIDATOR}" \
                --threshold 1 \
                --output-unsigned-tx "${OUTPUT_DIR}/kill-gorchain-01.json" \
                2>&1 || true

              cat > "${OUTPUT_DIR}/kill-gorchain-01.summary.txt" <<SUMMARY
              Operation: Kill Switch — Gorchain ISM Reconfiguration
              Program:   ${GORCHAIN_ISM_ID}
              Action:    Set Multisig ISM validators to null address for remote domain ${SOLANA_DOMAIN_ID}
              Validators: ${NULL_VALIDATOR}
              Threshold:  1
              Effect:     No relayer (including third-party) can deliver messages FROM Solana TO Gorchain
              Signer:     ${HARDWARE_WALLET_PUBKEY} (hardware wallet — ISM owner)

              To sign:  solana sign-offloaded-transaction kill-gorchain-01.json --signer usb://ledger
              To submit: solana send-signed-transaction kill-gorchain-01.json --url ${GORCHAIN_RPC_URL}
              SUMMARY

              # Solana — set ISM validators to null
              log "Building unsigned tx: reconfigure ISM on Solana..."
              ${CLIENT} --url "${SOLANA_RPC_URL}" \
                multisig-ism set \
                --program-id "${SOLANA_ISM_ID}" \
                --authority "${HARDWARE_WALLET_PUBKEY}" \
                --domain "${GORCHAIN_DOMAIN_ID}" \
                --validators "${NULL_VALIDATOR}" \
                --threshold 1 \
                --output-unsigned-tx "${OUTPUT_DIR}/kill-solana-01.json" \
                2>&1 || true

              cat > "${OUTPUT_DIR}/kill-solana-01.summary.txt" <<SUMMARY
              Operation: Kill Switch — Solana ISM Reconfiguration
              Program:   ${SOLANA_ISM_ID}
              Action:    Set Multisig ISM validators to null address for remote domain ${GORCHAIN_DOMAIN_ID}
              Validators: ${NULL_VALIDATOR}
              Threshold:  1
              Effect:     No relayer (including third-party) can deliver messages FROM Gorchain TO Solana
              Signer:     ${HARDWARE_WALLET_PUBKEY} (hardware wallet — ISM owner)

              To sign:  solana sign-offloaded-transaction kill-solana-01.json --signer usb://ledger
              To submit: solana send-signed-transaction kill-solana-01.json --url ${SOLANA_RPC_URL}
              SUMMARY

              log "Unsigned transactions written to ${OUTPUT_DIR}/"
              ls -la "${OUTPUT_DIR}/"
              log "Kill switch preparation complete. Sign and submit the transactions with your hardware wallet."
          env:
            - name: GORCHAIN_RPC_URL
              valueFrom:
                configMapKeyRef:
                  name: hyperlane-chain-config
                  key: gorchain-rpc-url
            - name: SOLANA_RPC_URL
              valueFrom:
                configMapKeyRef:
                  name: hyperlane-chain-config
                  key: solana-rpc-url
            - name: GORCHAIN_DOMAIN_ID
              value: "99999"
            - name: SOLANA_DOMAIN_ID
              value: "99998"
            - name: HARDWARE_WALLET_PUBKEY
              valueFrom:
                secretKeyRef:
                  name: hyperlane-ops-keys
                  key: hardware-wallet-pubkey
          volumeMounts:
            - name: program-ids
              mountPath: /config/program-ids
              readOnly: true
            - name: output
              mountPath: /output
      volumes:
        - name: program-ids
          configMap:
            name: hyperlane-program-ids
        - name: output
          emptyDir: {}
